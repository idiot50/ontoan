/* ---------- error log ---------- */
let logFilter = 'all';
function buildLog() {
  const map = new Map();
  for (const a of sortedAttempts()) {
    for (const [id, sc] of Object.entries(a.res || {})) {
      if (!IDX[id]) continue;
      const e = map.get(id) || { id, tries: 0, wrong: 0, lastOk: true, lastU: '', flagged: false, lastDate: a.date };
      e.tries++; const ok = sc >= IDX[id].max; e.lastOk = ok; e.lastDate = a.date;
      if (!ok) { e.wrong++; const w = (a.wrong || []).find(x => x.id === id); e.lastU = w ? w.u : ''; }
      map.set(id, e);
    }
    for (const id of (a.flags || [])) { if (!IDX[id]) continue; const e = map.get(id) || { id, tries: 0, wrong: 0, lastOk: true, lastU: '', flagged: false, lastDate: a.date }; e.flagged = true; map.set(id, e); }
  }
  return Array.from(map.values()).filter(e => e.wrong > 0 || e.flagged);
}
function renderLog() {
  const entries = buildLog();
  const filters = [['all', 'Tất cả'], ['open', 'Chưa sửa được'], ['fixed', 'Đã làm đúng lại'], ['flag', '⚑ Đánh dấu khó']];
  byId('log-filters').innerHTML = filters.map(([k, l]) => '<button type="button" data-f="' + k + '" class="' + (logFilter === k ? 'active' : '') + '">' + l + '</button>').join('');
  for (const b of all('#rv-log-filters button')) b.addEventListener('click', () => { logFilter = b.dataset.f; renderLog(); });
  const list = entries.filter(e => logFilter === 'all' || (logFilter === 'open' && e.wrong > 0 && !e.lastOk) || (logFilter === 'fixed' && e.wrong > 0 && e.lastOk) || (logFilter === 'flag' && e.flagged));
  if (!list.length) { byId('log').innerHTML = '<div class="empty">' + (entries.length ? 'Không có câu nào trong mục này.' : 'Chưa có lỗi nào được ghi. Làm một đề để bắt đầu.') + '</div>'; return; }
  const groups = {};
  for (const e of list) { const r = IDX[e.id].it.rule; (groups[r] = groups[r] || []).push(e); }
  const order = Object.entries(groups).sort((a, b) => b[1].reduce((s, e) => s + e.wrong, 0) - a[1].reduce((s, e) => s + e.wrong, 0));
  byId('log').innerHTML = order.map(([r, es]) => {
    const tot = es.reduce((s, e) => s + e.wrong, 0);
    return '<div class="group"><h3>' + esc(DATA.rules[r].name) + ' <span class="chip bad">' + tot + ' lỗi · ' + es.length + ' câu</span></h3><p class="tipline">' + esc(DATA.rules[r].tip) + '</p><ul class="log">' +
      es.sort((a, b) => b.wrong - a.wrong).map(e => { const r2 = IDX[e.id]; return '<li><div class="meta">' + esc(r2.t.name) + ' · Bài ' + r2.ex.n + ' · câu ' + e.id.split('-')[2] + ' · sai ' + e.wrong + '/' + e.tries + ' lần' +
        (e.wrong ? (e.lastOk ? ' <span class="chip ok">✓ lần gần nhất đúng</span>' : ' <span class="chip bad">✗ lần gần nhất vẫn sai</span>') : '') + (e.flagged ? ' <span class="chip flag">⚑ khó</span>' : '') + '</div>' + itemText(e.id) +
        (e.lastU ? '<div class="small">Con viết: <span class="u">' + esc(e.lastU) + '</span></div>' : '') + '<div class="small muted">' + esc(r2.it.why) + '</div></li>'; }).join('') + '</ul></div>';
  }).join('');
}

/* ---------- progress ---------- */
function renderChart(list) {
  const W = 640, H = 260, L = 38, R = 14, T = 16, B = 40;
  const n = list.length; const x = i => n === 1 ? (L + (W - L - R) / 2) : L + (W - L - R) * i / (n - 1);
  const y = v => T + (H - T - B) * (1 - v / 100);
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Điểm các lần làm bài">';
  for (let v = 0; v <= 100; v += 20) s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="axis" x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
  s += '<line class="target" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(80) + '" y2="' + y(80) + '"/>';
  const pts = list.map((a, i) => [x(i), y(a.score)]);
  if (n > 1) { s += '<path class="area" d="M' + pts.map(p => p[0] + ',' + p[1]).join(' L') + ' L' + pts[n - 1][0] + ',' + y(0) + ' L' + pts[0][0] + ',' + y(0) + ' Z"/>'; s += '<path class="ln" d="M' + pts.map(p => p[0] + ',' + p[1]).join(' L') + '"/>'; }
  list.forEach((a, i) => { const t = DATA.tests.find(x => x.id === a.test); const [px, py] = pts[i];
    s += '<circle class="pt ' + (t && t.levelKey === 'hard' ? 'hard' : '') + '" cx="' + px + '" cy="' + py + '" r="5"/>';
    if (n <= 12 || i === n - 1 || i === 0) s += '<text class="lbl" x="' + px + '" y="' + (py - 10) + '" text-anchor="middle">' + a.score + '</text>';
    s += '<text class="axis" x="' + px + '" y="' + (H - B + 16) + '" text-anchor="middle">Đề ' + a.test + '</text>';
    if (n <= 8) s += '<text class="axis" x="' + px + '" y="' + (H - B + 30) + '" text-anchor="middle">' + new Date(a.date).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' }) + '</text>';
    s += '<circle class="hit" cx="' + px + '" cy="' + py + '" r="14" data-i="' + i + '"/>';
  });
  return s + '</svg>';
}
function pct(list, pick) { let s = 0, m = 0; for (const a of list) { const v = pick(a); s += v[0]; m += v[1]; } return m ? Math.round(100 * s / m) : null; }
function renderProgress() {
  const allA = sortedAttempts();
  if (!allA.length) { byId('progress').innerHTML = '<div class="empty">Chưa có dữ liệu. Làm một đề để bắt đầu theo dõi.</div>' + backupCard(); bindBackup(); return; }
  let h = '<div class="card"><h2 style="margin-top:0">Điểm qua từng lần làm</h2><div class="legend"><span><i></i>đề tương đương</span><span><i class="hard"></i>đề khó hơn</span><span><i class="target"></i>mục tiêu 80</span></div><div style="position:relative" id="rv-chartbox">' + renderChart(allA) + '</div></div>';
  h += '<h2>Theo đề</h2><div class="card"><table class="ex"><tr><th>Đề</th><th class="r">Số lần</th><th class="r">Cao nhất</th><th class="r">Gần nhất</th><th class="r">So với lần trước</th></tr>' + DATA.tests.map(t => { const s = testStats(t.id); const d = (s.last != null && s.prev != null) ? s.last - s.prev : null; return '<tr><td>' + esc(t.name) + ' <span class="lvl ' + t.levelKey + '">' + esc(t.level) + '</span></td><td class="r">' + s.n + '</td><td class="r">' + (s.best == null ? '–' : s.best) + '</td><td class="r">' + (s.last == null ? '–' : s.last) + '</td><td class="r ' + (d == null ? '' : d >= 0 ? 'trend up' : 'trend down') + '">' + (d == null ? '–' : (d >= 0 ? '+' : '') + d) + '</td></tr>'; }).join('') + '</table></div>';
  const first = allA.slice(0, 3), last = allA.slice(-3);
  h += '<h2>Theo dạng bài</h2><p class="muted small">So sánh 3 lần làm đầu tiên với 3 lần gần nhất (tỉ lệ điểm đạt được).</p><div class="card"><table class="ex"><tr><th>Bài</th><th class="r">3 lần đầu</th><th class="r">3 lần gần nhất</th><th></th></tr>' + DATA.tests[0].exercises.map(ex => { const f = pct(first, a => { const e = a.ex.find(x => x.n === ex.n); return e ? [e.s, e.m] : [0, 0]; }); const l = pct(last, a => { const e = a.ex.find(x => x.n === ex.n); return e ? [e.s, e.m] : [0, 0]; }); const d = (f != null && l != null && allA.length > 3) ? l - f : null; return '<tr><td>' + ex.n + '. ' + esc(ex.vi.split('.')[0]) + '</td><td class="r">' + (f == null ? '–' : f + '%') + '</td><td class="r">' + (l == null ? '–' : l + '%') + '</td><td class="' + (d == null ? '' : d > 0 ? 'trend up' : d < 0 ? 'trend down' : '') + '">' + (d == null ? '' : d > 0 ? '▲ +' + d : d < 0 ? '▼ ' + d : '=') + '</td></tr>'; }).join('') + '</table></div>';
  const rf = {}, rl = {}, rt = {};
  for (const a of first) for (const [r, c] of Object.entries(a.rules || {})) rf[r] = (rf[r] || 0) + c;
  for (const a of last) for (const [r, c] of Object.entries(a.rules || {})) rl[r] = (rl[r] || 0) + c;
  for (const a of allA) for (const [r, c] of Object.entries(a.rules || {})) rt[r] = (rt[r] || 0) + c;
  const rr = Object.entries(rt).sort((a, b) => b[1] - a[1]);
  h += '<h2>Theo quy tắc</h2><p class="muted small">Số lỗi theo từng quy tắc. Mũi tên xanh = ít lỗi hơn trước.</p><div class="card">' + (rr.length ? '<table class="ex"><tr><th>Quy tắc</th><th class="r">Tổng lỗi</th><th class="r">3 lần đầu</th><th class="r">3 lần gần nhất</th><th></th></tr>' + rr.map(([r, c]) => { const f = rf[r] || 0, l = rl[r] || 0; const d = allA.length > 3 ? l - f : null; return '<tr><td>' + esc(DATA.rules[r].name) + '</td><td class="r">' + c + '</td><td class="r">' + f + '</td><td class="r">' + l + '</td><td class="' + (d == null ? '' : d < 0 ? 'trend up' : d > 0 ? 'trend down' : '') + '">' + (d == null ? '' : d < 0 ? '▼ ' + d : d > 0 ? '▲ +' + d : '=') + '</td></tr>'; }).join('') + '</table>' : '<p class="muted">Chưa có lỗi nào.</p>') + '</div>';
  h += '<h2>Lịch sử</h2><div class="card"><table class="ex"><tr><th>Ngày</th><th>Đề</th><th class="r">Điểm</th><th class="r">Phút</th><th class="r">Câu sai</th></tr>' + allA.slice().reverse().map(a => '<tr><td>' + fmtDate(a.date) + '</td><td>Đề ' + a.test + '</td><td class="r"><b>' + a.score + '</b></td><td class="r">' + Math.round(a.dur / 60) + '</td><td class="r">' + (a.wrong || []).length + '</td></tr>').join('') + '</table></div>';
  h += backupCard();
  byId('progress').innerHTML = h; bindBackup();
  let tip = byId('tip'); const box = byId('chartbox');
  if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; tip.id = 'rv-tip'; tip.hidden = true; }
  for (const c of box.querySelectorAll('.hit')) {
    const a = allA[Number(c.dataset.i)];
    const showTip = ev => { tip.hidden = false; tip.innerHTML = '<b>Đề ' + a.test + ' · ' + a.score + ' điểm</b><br>' + fmtDate(a.date) + '<br>' + (a.wrong || []).length + ' câu sai · ' + Math.round(a.dur / 60) + ' phút'; const r = box.getBoundingClientRect(); tip.style.left = (ev.clientX - r.left + 12) + 'px'; tip.style.top = (ev.clientY - r.top - 10) + 'px'; };
    c.addEventListener('mousemove', showTip); c.addEventListener('mouseenter', showTip); c.addEventListener('mouseleave', () => tip.hidden = true);
    c.addEventListener('click', showTip);
  }
  box.style.position = 'relative'; box.appendChild(tip);
}

/* ---------- sao lưu / khôi phục (chỉ ngoài viewer claude.ai: ở đó kết quả đã lưu trên mạng, còn tải file bị chặn) ---------- */
let inViewer = false;
function backupCard() {
  if (inViewer) return '';
  return '<h2>Sao lưu &amp; khôi phục</h2><div class="card backup"><span class="muted small">Trên trang này kết quả chỉ lưu trong trình duyệt đang dùng. Tải file sao lưu để chuyển sang máy khác, hoặc để giữ lại trước khi xoá dữ liệu trình duyệt.</span>' +
    '<button class="btn" type="button" id="rv-export">⬇ Tải file sao lưu</button><label class="btn" for="rv-import">⬆ Khôi phục từ file</label><input type="file" id="rv-import" accept="application/json,.json"></div>';
}
function bindBackup() {
  const ex = byId('export'), im = byId('import'); if (!ex || !im) return;
  ex.addEventListener('click', () => {
    try {
      const blob = new Blob([JSON.stringify({ app: 'revision-1-9', v: 1, exported: new Date().toISOString(), attempts: sortedAttempts() }, null, 1)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'revision-1-9-ket-qua.json';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch (e) { setSync('Không tải được file sao lưu'); }
  });
  im.addEventListener('change', () => {
    const f = im.files && im.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(String(r.result)); const list = Array.isArray(o) ? o : (o && o.attempts) || [];
        const have = new Set(store.attempts.map(a => a.id));
        const fresh = list.filter(a => a && a.id && typeof a.score === 'number' && !have.has(a.id));
        mergeAttempts(fresh); saveLocal(); setSync('Đã khôi phục ' + fresh.length + ' lần làm');
        if (db) for (const a of fresh) db.collection('attempts').doc(a.id).set(a).catch(() => {});
        renderCurrent(); if (opts.onChange) opts.onChange();
      } catch (e) { setSync('File sao lưu không hợp lệ'); }
      im.value = '';
    };
    r.readAsText(f);
  });
}

/* ---------- mount ---------- */
function mount(host, o) {
  opts = o || {};
  inViewer = !!(window.claude && window.claude.use);
  if (!root) {
    root = document.createElement('div'); root.id = 'rv';
    root.className = opts.standalone ? 'rv-standalone' : 'rv-embedded';
    root.innerHTML = MARKUP;
    if (opts.back) { const a = document.createElement('a'); a.className = 'back'; a.href = opts.back.href; a.textContent = opts.back.label; root.querySelector('.top .in-wrap').prepend(a); }
    for (const b of all('.rv-nav button')) b.addEventListener('click', () => show(b.dataset.view));
    loadLocal();
    renderHome();
    host.appendChild(root);
    const hash = opts.standalone ? (location.hash || '').replace('#', '') : '';
    if (['errors', 'progress'].includes(hash)) show(hash);
    else if (/^t[1-5]$/.test(hash)) startTest(Number(hash.slice(1)));
    initDb();
  } else {
    if (root.parentElement !== host) host.appendChild(root);
    renderCurrent();
  }
  return root;
}
function summary() {
  if (!store.attempts.length) { loadLocal(); }
  const l = sortedAttempts(); if (!l.length) return '';
  return ' · ' + l.length + ' lần · ' + l[l.length - 1].score + '/100';
}
return { mount, summary, data: DATA, idx: IDX, attempts: sortedAttempts, startTest, show };
})();
