<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%93%98%3C/text%3E%3C/svg%3E">
<title>Revision Units 1–9</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
  /* standalone page only: body ground + font. The module itself is scoped under #rv (see embed block). */
  html, body { margin: 0; }
  body { background: #f4f6f3; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background: #131916; color-scheme: dark; } }
  :root[data-theme="dark"] body { background: #131916; color-scheme: dark; }
  #rv.rv-standalone { --rv-font: "Nunito", "Segoe UI", system-ui, sans-serif; }
</style>
<!--RV:EMBED-START-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap">
<style>
  /* Revision Units 1–9 module. Every rule is scoped under #rv so it can live inside another page.
     Layout: one reading column; a test is a stack of exercise cards; after grading the summary sits on top. */
  #rv {
    --rv-bg: #f4f6f3; --rv-surface: #ffffff; --rv-fg: #1d2924; --rv-muted: #5d6c65; --rv-line: #d7ded8; --rv-line-strong: #b9c4bd;
    --rv-accent: #1f6f5c; --rv-accent-ink: #ffffff; --rv-accent-soft: #e2f1ea;
    --rv-ok: #2c7a39; --rv-ok-soft: #e4f4e6; --rv-bad: #b9312f; --rv-bad-soft: #fbe7e5; --rv-warn: #9a5b00; --rv-warn-soft: #fff1d6;
    --rv-sample: #2a4ea3; --rv-shadow: 0 1px 2px rgba(20,40,30,.06);
    --scene-bg: #eef4ee; --scene-floor: #d9cdb8; --scene-grass: #cfe6c4; --scene-wood: #a9794a; --scene-soft: #f5efe2;
    --scene-water: #bcdcf0; --scene-dark: #4a5059; --scene-line: #3a4a42; --scene-ink: #2b3a33;
    --rv-font: inherit; --rv-hand: "Caveat", "Segoe Script", cursive;
    font-family: var(--rv-font); color: var(--rv-fg); font-size: 16px; line-height: 1.5; min-width: 0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #rv {
      --rv-bg: #131916; --rv-surface: #1b2420; --rv-fg: #e5ebe6; --rv-muted: #9db0a5; --rv-line: #2c3a33; --rv-line-strong: #41534a;
      --rv-accent: #6fcfb0; --rv-accent-ink: #0f1f19; --rv-accent-soft: #1d3a31;
      --rv-ok: #7bd389; --rv-ok-soft: #1e3525; --rv-bad: #ff8f85; --rv-bad-soft: #3d2321; --rv-warn: #ffc46b; --rv-warn-soft: #3a2c14;
      --rv-sample: #a3bdff; --rv-shadow: none;
      --scene-bg: #1f2a25; --scene-floor: #4a4034; --scene-grass: #28402a; --scene-wood: #8a6238; --scene-soft: #3a3a33;
      --scene-water: #27455c; --scene-dark: #6b7280; --scene-line: #c9d4cd; --scene-ink: #e5ebe6;
    }
  }
  :root[data-theme="dark"] #rv {
    --rv-bg: #131916; --rv-surface: #1b2420; --rv-fg: #e5ebe6; --rv-muted: #9db0a5; --rv-line: #2c3a33; --rv-line-strong: #41534a;
    --rv-accent: #6fcfb0; --rv-accent-ink: #0f1f19; --rv-accent-soft: #1d3a31;
    --rv-ok: #7bd389; --rv-ok-soft: #1e3525; --rv-bad: #ff8f85; --rv-bad-soft: #3d2321; --rv-warn: #ffc46b; --rv-warn-soft: #3a2c14;
    --rv-sample: #a3bdff; --rv-shadow: none;
    --scene-bg: #1f2a25; --scene-floor: #4a4034; --scene-grass: #28402a; --scene-wood: #8a6238; --scene-soft: #3a3a33;
    --scene-water: #27455c; --scene-dark: #6b7280; --scene-line: #c9d4cd; --scene-ink: #e5ebe6;
  }
  #rv *, #rv *::before, #rv *::after { box-sizing: border-box; }
  #rv [hidden] { display: none !important; }
  #rv button, #rv input, #rv select { font: inherit; }
  #rv a { color: var(--rv-accent); }
  #rv p { margin: 6px 0; }
  #rv h1 { font-size: 1.45rem; font-weight: 800; margin: 6px 0 4px; text-wrap: balance; line-height: 1.25; }
  #rv h2 { font-size: 1.15rem; font-weight: 800; margin: 20px 0 8px; }
  #rv h3 { font-size: 1rem; font-weight: 800; margin: 14px 0 6px; }
  #rv .muted { color: var(--rv-muted); }
  #rv .small { font-size: .88rem; }
  #rv .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--rv-surface); border-bottom: 1px solid var(--rv-line); }
  #rv .top .in-wrap { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  #rv .brand { font-weight: 800; font-size: 1.05rem; }
  #rv .brand small { font-weight: 600; color: var(--rv-muted); font-size: .8rem; margin-left: 6px; }
  #rv .rv-nav { display: flex; gap: 6px; flex-wrap: wrap; }
  #rv .rv-nav button { border: 1px solid var(--rv-line); background: transparent; color: var(--rv-fg); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 700; }
  #rv .rv-nav button.active { background: var(--rv-accent); color: var(--rv-accent-ink); border-color: var(--rv-accent); }
  #rv .sync { margin-left: auto; font-size: .78rem; color: var(--rv-muted); }
  #rv .back { font-size: .88rem; font-weight: 700; color: var(--rv-accent); text-decoration: none; border: 1px solid var(--rv-line); border-radius: 999px; padding: 4px 11px; }
  #rv .backup { display: flex; gap: 8px 10px; flex-wrap: wrap; align-items: center; }
  #rv .backup .small { flex: 1 1 100%; }
  #rv label.btn { display: inline-block; }
  #rv .backup input[type="file"] { display: none; }
  #rv .wrap { max-width: 860px; margin: 0 auto; padding-block: 16px 110px; padding-inline: 16px; }
  #rv.rv-embedded .top { position: static; background: transparent; border-bottom: 0; }
  #rv.rv-embedded .top .in-wrap, #rv.rv-embedded .wrap { max-width: none; padding-inline: 0; }
  #rv.rv-embedded .top .in-wrap { padding-block: 4px 10px; border-bottom: 1px dashed var(--rv-line); }
  #rv.rv-embedded .brand { display: none; }
  #rv.rv-embedded .wrap { padding-block: 10px 40px; }
  #rv .card { background: var(--rv-surface); border: 1px solid var(--rv-line); border-radius: 14px; padding: 14px 16px; margin: 0; box-shadow: var(--rv-shadow); animation: none; }
  #rv .btn { border: 1px solid var(--rv-line-strong); background: var(--rv-surface); color: var(--rv-fg); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 700; font-size: 1rem; }
  #rv .btn.primary { background: var(--rv-accent); color: var(--rv-accent-ink); border-color: var(--rv-accent); }
  #rv .btn.big { font-size: 1.05rem; padding: 11px 20px; }
  #rv .btn:disabled { opacity: .5; cursor: default; }
  #rv .btn:focus-visible, #rv .rv-nav button:focus-visible, #rv .in:focus-visible, #rv .sel:focus-visible, #rv .flag:focus-visible { outline: 3px solid var(--rv-accent); outline-offset: 2px; }

  /* home */
  #rv .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 10px 0 16px; }
  #rv .tile { background: var(--rv-surface); border: 1px solid var(--rv-line); border-radius: 12px; padding: 10px 12px; }
  #rv .tile .v { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  #rv .tile .l { font-size: .8rem; color: var(--rv-muted); }
  #rv .tests { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  #rv .test { display: flex; flex-direction: column; gap: 8px; }
  #rv .test .nm { font-weight: 800; font-size: 1.1rem; }
  #rv .lvl { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--rv-accent-soft); color: var(--rv-accent); }
  #rv .lvl.hard { background: var(--rv-warn-soft); color: var(--rv-warn); }
  #rv .test .st { font-size: .88rem; color: var(--rv-muted); font-variant-numeric: tabular-nums; }
  #rv .test .st b { color: var(--rv-fg); }
  #rv .remind { border-left: 4px solid var(--rv-warn); background: var(--rv-warn-soft); padding: 8px 12px; border-radius: 8px; margin: 10px 0; }
  #rv .remind ul { margin: 4px 0 0; padding-left: 18px; }
  #rv .remind li { margin: 2px 0; }

  /* exercise */
  #rv .ex { margin-top: 14px; }
  #rv .exh { display: flex; gap: 10px; align-items: flex-start; }
  #rv .num { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: var(--rv-accent); color: var(--rv-accent-ink); font-weight: 800; display: flex; align-items: center; justify-content: center; }
  #rv .ttl { flex: 1 1 auto; min-width: 0; }
  #rv .ttl b { font-size: 1.02rem; }
  #rv .ttl .vi { display: block; color: var(--rv-muted); font-size: .9rem; }
  #rv .pts { flex: 0 0 auto; font-size: .8rem; color: var(--rv-muted); border: 1px solid var(--rv-line); border-radius: 999px; padding: 2px 9px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #rv .pts.done { color: var(--rv-fg); font-weight: 800; border-color: var(--rv-line-strong); }
  #rv .bank { display: flex; flex-wrap: wrap; gap: 6px 10px; background: var(--rv-accent-soft); color: var(--rv-fg); padding: 8px 12px; border-radius: 10px; margin: 10px 0; font-weight: 700; }
  #rv .eg { margin: 10px 0 2px; color: var(--rv-muted); }
  #rv .sample { font-family: var(--rv-hand); color: var(--rv-sample); font-size: 1.25em; font-weight: 600; }
  #rv .item { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto; gap: 6px 8px; align-items: start; padding: 9px 0; border-top: 1px dashed var(--rv-line); }
  #rv .item .n { font-weight: 800; color: var(--rv-muted); padding-top: 8px; }
  #rv .item .body { min-width: 0; }
  #rv .item .q { margin-bottom: 6px; }
  #rv .in { padding: 8px 10px; border: 1.5px solid var(--rv-line-strong); border-radius: 8px; background: var(--rv-surface); color: var(--rv-fg); min-width: 0; font-size: 1rem; }
  #rv .in.wide { width: 100%; }
  #rv .in.gap { width: 9.5em; max-width: 100%; display: inline-block; vertical-align: baseline; margin: 2px 2px; }
  #rv .sel { padding: 7px 8px; border: 1.5px solid var(--rv-line-strong); border-radius: 8px; background: var(--rv-surface); color: var(--rv-fg); display: inline-block; vertical-align: baseline; margin: 2px 2px; max-width: 100%; font-size: 1rem; }
  #rv .in.ok, #rv .sel.ok { border-color: var(--rv-ok); background: var(--rv-ok-soft); }
  #rv .in.bad, #rv .sel.bad { border-color: var(--rv-bad); background: var(--rv-bad-soft); }
  #rv .line { display: block; white-space: pre-wrap; }
  #rv .qa { display: grid; gap: 6px; }
  #rv .qa label { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 6px; align-items: center; font-size: .9rem; color: var(--rv-muted); }
  @media (max-width: 480px) { #rv .qa label { grid-template-columns: 1fr; gap: 2px; } }
  #rv .mark { display: inline-block; margin: 0 4px; font-weight: 800; color: var(--rv-ok); font-size: .95rem; background: transparent; }
  #rv .mark.bad { color: var(--rv-bad); }
  #rv .mark b { color: var(--rv-fg); background: var(--rv-ok-soft); padding: 0 5px; border-radius: 5px; }
  #rv .fb { font-size: .9rem; color: var(--rv-muted); margin-top: 4px; }
  #rv .fb b { color: var(--rv-fg); }
  #rv .flag { border: 1px solid var(--rv-line); background: transparent; color: var(--rv-muted); border-radius: 8px; padding: 5px 8px; cursor: pointer; font-size: .85rem; white-space: nowrap; }
  #rv .flag.on { color: var(--rv-warn); border-color: var(--rv-warn); background: var(--rv-warn-soft); }
  #rv .para { line-height: 2.35; margin-top: 8px; }
  #rv .para .flag { padding: 2px 6px; vertical-align: baseline; }
  #rv .gapno { font-weight: 800; color: var(--rv-muted); margin-right: 2px; }
  #rv .fblist { margin: 8px 0 0; padding-left: 18px; list-style: disc; }
  #rv .fblist li { margin: 3px 0; font-size: .92rem; }
  #rv table.freq { border-collapse: collapse; margin: 10px 0; font-size: .95rem; width: 100%; max-width: 520px; }
  #rv table.freq th, #rv table.freq td { border: 1px solid var(--rv-line-strong); padding: 5px 8px; text-align: center; vertical-align: middle; background: transparent; }
  #rv table.freq th { background: var(--rv-accent-soft); font-weight: 700; }
  #rv table.freq td.rh { font-weight: 700; text-align: left; background: var(--rv-bg); }
  #rv .scene { margin: 10px 0; }
  #rv .scene svg { width: 100%; max-width: 470px; height: auto; display: block; border: 1px solid var(--rv-line); border-radius: 10px; }

  /* bottom bar */
  #rv .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--rv-surface); border-top: 1px solid var(--rv-line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
  #rv .bar .in-wrap { max-width: 860px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  #rv .bar .prog { font-variant-numeric: tabular-nums; color: var(--rv-muted); }
  #rv .bar .prog b { color: var(--rv-fg); }
  #rv .confirm { background: var(--rv-warn-soft); border: 1px solid var(--rv-warn); border-radius: 10px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* results */
  #rv .result { border: 2px solid var(--rv-accent); text-align: left; padding: 14px 16px; }
  #rv .score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #rv .score .big { font-size: 2.6rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; color: var(--rv-fg); }
  #rv .score .of { color: var(--rv-muted); }
  #rv .delta { font-weight: 700; }
  #rv .delta.up { color: var(--rv-ok); } #rv .delta.down { color: var(--rv-bad); }
  #rv table.ex { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: .93rem; }
  #rv table.ex th, #rv table.ex td { border: 0; border-bottom: 1px solid var(--rv-line); padding: 5px 6px; text-align: left; background: transparent; vertical-align: middle; }
  #rv table.ex th { font-weight: 700; }
  #rv table.ex td.r, #rv table.ex th.r { text-align: right; font-variant-numeric: tabular-nums; }
  #rv .pbar { height: 8px; background: var(--rv-line); border-radius: 999px; overflow: hidden; min-width: 70px; }
  #rv .pbar i { display: block; height: 100%; background: var(--rv-accent); border-radius: 999px; }
  #rv .pbar i.low { background: var(--rv-bad); } #rv .pbar i.mid { background: var(--rv-warn); }
  #rv .rules { margin: 6px 0 0; padding-left: 0; list-style: none; display: grid; gap: 8px; }
  #rv .rules li { border-left: 4px solid var(--rv-warn); background: var(--rv-warn-soft); padding: 8px 12px; border-radius: 8px; margin: 0; }
  #rv .rules li b { display: block; }
  #rv .rules li .rep { font-size: .78rem; font-weight: 800; color: var(--rv-bad); margin-left: 6px; }
  #rv .wrongs { margin: 6px 0 0; padding-left: 0; list-style: none; display: grid; gap: 6px; }
  #rv .wrongs li { padding: 6px 10px; border: 1px solid var(--rv-line); border-radius: 8px; font-size: .93rem; margin: 0; }
  #rv .wrongs .u { color: var(--rv-bad); text-decoration: line-through; }
  #rv .a { color: var(--rv-ok); font-weight: 800; }
  #rv .chip { display: inline-block; font-size: .75rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--rv-line); color: var(--rv-muted); margin-left: 4px; }
  #rv .chip.bad { color: var(--rv-bad); border-color: var(--rv-bad); }
  #rv .chip.ok { color: var(--rv-ok); border-color: var(--rv-ok); }
  #rv .chip.flag { color: var(--rv-warn); border-color: var(--rv-warn); }

  /* error log */
  #rv .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
  #rv .filters button { border: 1px solid var(--rv-line); background: var(--rv-surface); color: var(--rv-fg); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: .88rem; }
  #rv .filters button.active { background: var(--rv-accent-soft); border-color: var(--rv-accent); color: var(--rv-accent); font-weight: 800; }
  #rv .group { margin-top: 14px; }
  #rv .group h3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #rv .group .tipline { font-size: .9rem; color: var(--rv-muted); margin: 0 0 6px; }
  #rv .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  #rv .log li { background: var(--rv-surface); border: 1px solid var(--rv-line); border-radius: 10px; padding: 8px 12px; font-size: .95rem; margin: 0; }
  #rv .log .meta { font-size: .8rem; color: var(--rv-muted); }
  #rv .log .u { color: var(--rv-bad); }

  /* progress */
  #rv .chart { width: 100%; height: auto; display: block; }
  #rv .chart .grid { stroke: var(--rv-line); stroke-width: 1; }
  #rv .chart .axis { fill: var(--rv-muted); font-size: 11px; font-family: var(--rv-font); }
  #rv .chart .ln { fill: none; stroke: var(--rv-accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  #rv .chart .area { fill: var(--rv-accent); opacity: .12; }
  #rv .chart .pt { fill: var(--rv-accent); stroke: var(--rv-surface); stroke-width: 2; }
  #rv .chart .pt.hard { fill: var(--rv-surface); stroke: var(--rv-accent); stroke-width: 2.5; }
  #rv .chart .target { stroke: var(--rv-warn); stroke-width: 1.5; stroke-dasharray: 5 5; }
  #rv .chart .lbl { fill: var(--rv-fg); font-size: 11px; font-weight: 700; font-family: var(--rv-font); }
  #rv .chart .hit { fill: transparent; cursor: pointer; }
  #rv .tip { position: absolute; pointer-events: none; background: var(--rv-surface); border: 1px solid var(--rv-line-strong); border-radius: 8px; padding: 6px 9px; font-size: .85rem; box-shadow: var(--rv-shadow); z-index: 4; }
  #rv .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--rv-muted); margin: 4px 0 10px; }
  #rv .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--rv-accent); margin-right: 5px; vertical-align: middle; }
  #rv .legend i.hard { background: var(--rv-surface); border: 2px solid var(--rv-accent); }
  #rv .legend i.target { width: 16px; height: 0; border-top: 2px dashed var(--rv-warn); border-radius: 0; }
  #rv .trend.up { color: var(--rv-ok); font-weight: 800; } #rv .trend.down { color: var(--rv-bad); font-weight: 800; }
  #rv .empty { color: var(--rv-muted); padding: 14px; text-align: center; border: 1px dashed var(--rv-line-strong); border-radius: 10px; }
  @media (prefers-reduced-motion: no-preference) { #rv .pbar i { transition: width .4s ease; } }
</style>
</head>
<body>
<script>
window.RV19 = (function () {
const DATA = {"title":"Revision Units 1–9","source":"Soạn theo khung 10 bài của Revision 3 (Units 1–9), New Round Up 3 trang 158–160. Đề 1–2 tương đương sách, đề 3–5 khó hơn khoảng 40%.","rules":{"plural-s":{"name":"Số nhiều của danh từ","tip":"Thêm -s; tận cùng -s/-sh/-ch/-x/-o → -es; phụ âm + y → -ies; -f/-fe → -ves (knife → knives, leaf → leaves). Bất quy tắc: man → men, woman → women, child → children, tooth → teeth, foot → feet, mouse → mice, goose → geese, person → people; fish, sheep, deer giữ nguyên. Ngoại lệ -o: photos, pianos, radios."},"plural-demo":{"name":"Đổi cả câu sang số nhiều","tip":"This → These, That → Those; It's / He's / She's → They're; is → are, has → have; động từ mất -s (hurts → hurt); bỏ a / an. Với 'a glass of water' chỉ đổi glass → glasses."},"poss-adj":{"name":"Tính từ sở hữu: my, your, his, her, its, our, their","tip":"Luôn đứng TRƯỚC danh từ: my house, your mum, its bowl. Không dùng một mình."},"poss-pron":{"name":"Đại từ sở hữu: mine, yours, his, hers, ours, theirs","tip":"Đứng MỘT MÌNH, không có danh từ theo sau: That coat is hers (= her coat). Sau chỗ trống mà không có danh từ → dùng nhóm này."},"obj-pron":{"name":"Đại từ tân ngữ: me, you, him, her, it, us, them","tip":"Đứng SAU động từ hoặc giới từ: Look at him. Can you see them? Give it to us. Help me!"},"art-a-an":{"name":"a / an","tip":"Chọn theo ÂM đầu, không phải chữ cái: a + âm phụ âm (a red bike, a university, a uniform); an + âm nguyên âm (an orange, an hour vì h câm, an honest girl)."},"art-the":{"name":"the","tip":"the với vật duy nhất (the sun), công trình / sông / biển / dãy núi có tên (the Eiffel Tower, the Nile, the Alps, the Pacific), tên dân tộc chỉ cả dân tộc (the Chinese), nhạc cụ (play the piano)."},"art-zero":{"name":"Không mạo từ (–)","tip":"Không dùng mạo từ trước tên người, nước, thành phố (– Amy, – Italy, – London), bữa ăn (have – breakfast), môn thể thao (play – football), ngôn ngữ (speak – English), ngọn núi đơn (– Mount Everest)."},"much-many":{"name":"much / many","tip":"much + danh từ KHÔNG đếm được (milk, water, money, homework, time, news, furniture); many + danh từ đếm được số nhiều (apples, brothers, people, children, hours)."},"some-any":{"name":"some / any","tip":"some: câu khẳng định và câu xin / mời (Can I have some…? Would you like some…?); any: câu phủ định và câu hỏi thường (There isn't any… Have you got any…?)."},"no-compounds":{"name":"something / anything / nothing, someone / anyone / no one, somewhere / anywhere / nowhere","tip":"some- trong câu khẳng định; any- trong phủ định và câu hỏi; no- (nothing, no one / nobody, nowhere) mang nghĩa phủ định nên động từ để KHẲNG ĐỊNH (There is nothing = There isn't anything). Viết LIỀN: anything, nothing, someone (riêng 'no one' viết rời)."},"verb-s":{"name":"Thêm -s / -es với he, she, it","tip":"Hiện tại đơn, chủ ngữ he / she / it (Tony, my dad, the baby, the sun): drinks, watches, goes, studies, brushes. Với I / you / we / they: giữ nguyên động từ."},"do-does":{"name":"do / does trong câu hỏi và phủ định","tip":"Câu hỏi: Do + I / you / we / they…? Does + he / she / it…? Phủ định: don't / doesn't + động từ NGUYÊN MẪU (she doesn't like, không phải 'doesn't likes'). Không được bỏ do / does: 'Where do you live?' chứ không phải 'Where you live?'"},"freq-adv":{"name":"Trạng từ tần suất: always, usually, often, sometimes, never","tip":"Đứng TRƯỚC động từ thường (He always watches…), SAU động từ be (She is never late). 'never' là phủ định → trả lời ngắn là No, nhưng động từ vẫn khẳng định (He never goes…)."},"present-cont":{"name":"Hiện tại tiếp diễn: am / is / are + V-ing","tip":"Dùng khi việc ĐANG xảy ra: now, at the moment, right now, Look!, Listen!, Sh!, Hurry up! Chính tả: swim → swimming, run → running, make → making, lie → lying. Câu hỏi đảo be lên trước: Is it raining?"},"present-simple":{"name":"Hiện tại đơn: thói quen, sự thật","tip":"Dấu hiệu: every day, usually, always, often, on Saturdays, twice a day, sự thật (The sun rises in the east). Nhớ -s / -es với he / she / it."},"stative":{"name":"Động từ KHÔNG dùng tiếp diễn","tip":"like, love, hate, want, need, know, understand, remember, think (= cho rằng), have got → luôn dùng hiện tại đơn, kể cả khi có 'now' hay 'at the moment'."},"prep-place":{"name":"Giới từ chỉ nơi chốn","tip":"in = trong; on = trên (chạm mặt); under = dưới; beside / next to = bên cạnh; in front of = phía trước; behind = phía sau; between = ở giữa hai vật; opposite = đối diện (bên kia đường); above = phía trên (không chạm)."},"prep-time":{"name":"Giới từ chỉ thời gian","tip":"at + giờ (at 7 o'clock, at half past six), at night, at noon, at midnight, at the weekend / at weekends, at Christmas; on + thứ, ngày (on Monday, on Saturdays, on 5th May, on Monday morning); in + buổi, tháng, mùa, năm (in the morning, in May, in summer, in 2026)."}},"tests":[{"id":1,"name":"Đề 1","level":"Tương đương sách","levelKey":"eq","exercises":[{"n":1,"type":"rewrite","title":"Write the sentences in the plural.","vi":"Viết lại các câu ở dạng số nhiều.","pts":2,"example":{"q":"She's a happy girl.","a":"They're happy girls."},"items":[{"q":"This is a box of chocolates.","a":["These are boxes of chocolates."],"why":"This → These; box tận cùng -x → boxes; bỏ 'a'. 'chocolates' giữ nguyên.","rule":"plural-s"},{"q":"That's a red bus.","a":["Those are red buses."],"why":"That's → Those are; bus tận cùng -s → buses.","rule":"plural-demo"},{"q":"Look at that child.","a":["Look at those children."],"why":"that → those; child → children (bất quy tắc).","rule":"plural-s"},{"q":"It's a brown mouse.","a":["They're brown mice."],"why":"It's → They're; mouse → mice (bất quy tắc); bỏ 'a'.","rule":"plural-demo"},{"q":"He's a good teacher.","a":["They're good teachers."],"why":"He's → They're; teacher → teachers; bỏ 'a'.","rule":"plural-demo"}]},{"n":2,"type":"gap","title":"Complete the sentences with the words in the list.","vi":"Điền vào chỗ trống bằng các từ trong khung (mỗi từ dùng một lần).","pts":2,"bank":["me","his","your","us","her","mine","their"],"example":{"text":"The girls are with ___ mum.","a":"their"},"items":[{"text":"Tom has got a new bike. That bike is ___.","a":[["his"]],"why":"Sau chỗ trống không có danh từ → đại từ sở hữu. Của Tom → his.","rule":"poss-pron"},{"text":"Hello, Mr Brown. Is this ___ car?","a":[["your"]],"why":"Đứng trước danh từ 'car', nói với Mr Brown → your.","rule":"poss-adj"},{"text":"We are in the garden. Can you see ___?","a":[["us"]],"why":"Tân ngữ sau động từ see, thay cho 'we' → us.","rule":"obj-pron"},{"text":"This is my mum. ___ name is Anna.","a":[["her"]],"why":"Đứng trước danh từ 'name', của mẹ (she) → Her.","rule":"poss-adj"},{"text":"That pencil is ___. Give it to me, please.","a":[["mine"]],"why":"Không có danh từ theo sau, của tôi → mine (= my pencil).","rule":"poss-pron"},{"text":"Listen to ___! I can sing.","a":[["me"]],"why":"Sau giới từ to, người nói (I) → me.","rule":"obj-pron"}]},{"n":3,"type":"gap","title":"Fill in the gaps with a, an, the or –.","vi":"Điền a / an / the, hoặc – nếu không cần mạo từ.","pts":2,"opts":["a","an","the","–"],"example":{"text":"___ Mary is my sister.","a":"–"},"items":[{"text":"My mum is ___ actress.","a":[["an"]],"why":"actress bắt đầu bằng nguyên âm a → an.","rule":"art-a-an"},{"text":"I've got ___ blue pen.","a":[["a"]],"why":"blue bắt đầu bằng phụ âm b → a.","rule":"art-a-an"},{"text":"Can I have ___ apple?","a":[["an"]],"why":"apple bắt đầu bằng nguyên âm a → an.","rule":"art-a-an"},{"text":"Is ___ Nile in Egypt?","a":[["the"]],"why":"Tên sông luôn đi với the: the Nile.","rule":"art-the"},{"text":"___ English drink a lot of tea.","a":[["the"]],"why":"The English = người Anh (cả dân tộc) → the.","rule":"art-the"}]},{"n":4,"type":"gap","title":"Fill in the gaps with much, many, some or any.","vi":"Điền much / many / some / any (mỗi chỗ trống 1 điểm).","pts":2,"opts":["much","many","some","any"],"example":{"text":"A: How ___ sugar is there?  B: Not ___.","a":"much / much"},"items":[{"text":"A: Can I have ___ water, please?\nB: Sorry, there isn't ___ left.","a":[["some"],["any","much"]],"why":"Câu xin 'Can I have…?' → some; câu phủ định 'there isn't' → any (hoặc much = không còn nhiều).","rule":"some-any"},{"text":"A: How ___ apples do you want?\nB: I don't want ___.","a":[["many"],["any","many"]],"why":"apples đếm được → How many; phủ định 'don't want' → any (hoặc many = không muốn nhiều).","rule":"much-many"},{"text":"A: I need ___ eggs for the cake.\nB: How ___?","a":[["some"],["many"]],"why":"Câu khẳng định → some; eggs đếm được → How many.","rule":"much-many"},{"text":"A: How ___ milk do you drink every day?\nB: Not ___.","a":[["much"],["much"]],"why":"milk không đếm được → How much? Not much.","rule":"much-many"}]},{"n":5,"type":"gap","para":true,"title":"Fill in the gaps with some, any, no or their derivatives.","vi":"Điền some / any / no hoặc các từ ghép (someone, anything, nothing, no one…).","pts":2,"lead":"*Someone* is in the kitchen. ","items":[{"text":"There isn't ___ bread ","a":[["any"]],"why":"'There isn't' là phủ định → any.","rule":"some-any"},{"text":"and there's ___ to eat. ","a":[["nothing"]],"why":"'there's' khẳng định nhưng nghĩa 'không có gì' → nothing (= there isn't anything).","rule":"no-compounds"},{"text":"Is there ___ else in the fridge? ","a":[["anything"]],"why":"Câu hỏi → anything; 'anything else' = thứ gì khác.","rule":"no-compounds"},{"text":"No, there isn't ___ there. ","a":[["anything","any"]],"why":"Phủ định 'there isn't' → anything (hoặc any = không còn bánh mì).","rule":"no-compounds"},{"text":"Mum isn't at home, so there's ___ to ask. ","a":[["no one","nobody"]],"why":"Không có ai để hỏi, động từ khẳng định 'there's' → no one / nobody.","rule":"no-compounds"},{"text":"Let's go and buy ___ for dinner.","a":[["something"]],"why":"Câu khẳng định (đề nghị) → something.","rule":"no-compounds"}]},{"n":6,"type":"qa","title":"Look at the table. What do these people do on Sundays? Write the questions and answers.","vi":"Nhìn bảng. Viết câu hỏi, câu trả lời ngắn và câu trả lời đầy đủ như mẫu.","pts":2,"when":"on Sundays","table":{"cols":["go swimming","play football","read books"],"rows":[{"who":"Sam","vals":["always","never","sometimes"]},{"who":"Ann and Kate","vals":["never","sometimes","always"]}]},"example":{"prompt":"Ann and Kate / play football","q":"Do Ann and Kate play football on Sundays?","s":"Yes, they do.","f":"They sometimes play football on Sundays."},"items":[{"prompt":"Sam / go swimming","subj":"Sam","pron":"he","a":{"q":"Does Sam go swimming on Sundays?","s":"Yes, he does.","f":"He always goes swimming on Sundays."},"why":"Sam = he → Does…? / Yes, he does. always đứng trước động từ, go → goes.","rule":"verb-s"},{"prompt":"Sam / play football","subj":"Sam","pron":"he","a":{"q":"Does Sam play football on Sundays?","s":"No, he doesn't.","f":"He never plays football on Sundays."},"why":"never → trả lời No, he doesn't. Câu đầy đủ: He never plays (vẫn thêm -s).","rule":"freq-adv"},{"prompt":"Ann and Kate / read books","subj":"Ann and Kate","pron":"they","a":{"q":"Do Ann and Kate read books on Sundays?","s":"Yes, they do.","f":"They always read books on Sundays."},"why":"Hai người = they → Do…? / Yes, they do. Động từ không thêm -s.","rule":"do-does"},{"prompt":"Ann and Kate / go swimming","subj":"Ann and Kate","pron":"they","a":{"q":"Do Ann and Kate go swimming on Sundays?","s":"No, they don't.","f":"They never go swimming on Sundays."},"why":"never → No, they don't. They never go (không -s).","rule":"freq-adv"},{"prompt":"Sam / read books","subj":"Sam","pron":"he","a":{"q":"Does Sam read books on Sundays?","s":"Yes, he does.","f":"He sometimes reads books on Sundays."},"why":"sometimes → Yes, he does. He sometimes reads (thêm -s).","rule":"verb-s"}]},{"n":7,"type":"gap","title":"Put the verbs in brackets into the present simple or the present continuous.","vi":"Chia động từ trong ngoặc ở thì hiện tại đơn hoặc hiện tại tiếp diễn.","pts":2,"example":{"text":"She ___ (play) tennis every Sunday.","a":"plays"},"items":[{"text":"Every day, she ___ (go) to school by bus.","a":[["goes"]],"why":"Every day → thói quen; she → go + es = goes.","rule":"verb-s"},{"text":"Listen! The birds ___ (sing).","a":[["are singing"]],"why":"Listen! → đang xảy ra; the birds (they) → are singing.","rule":"present-cont"},{"text":"My dad ___ (read) a newspaper at the moment.","a":[["is reading"]],"why":"at the moment → hiện tại tiếp diễn; my dad (he) → is reading.","rule":"present-cont"},{"text":"We usually ___ (have) dinner at 7 o'clock.","a":[["have"]],"why":"usually → thói quen; chủ ngữ we → giữ nguyên have.","rule":"present-simple"},{"text":"Look! The children ___ (play) in the park.","a":[["are playing"]],"why":"Look! → đang xảy ra; the children (they) → are playing.","rule":"present-cont"},{"text":"He always ___ (wash) his car on Saturdays.","a":[["washes"]],"why":"always, on Saturdays → thói quen; he + wash tận cùng -sh → washes.","rule":"verb-s"}]},{"n":8,"type":"gap","para":true,"title":"Put the verbs in brackets into the present simple or the present continuous.","vi":"Chia động từ trong ngoặc (đoạn hội thoại).","pts":2,"lead":"**a** **Ann:** What *are you doing* (you/do) now?\n**Ben:** ","items":[{"text":"I ___ (make) a cake.\n**b** **Kim:** ","a":[["am making","'m making"]],"why":"Đang làm lúc này (now) → I am making.","rule":"present-cont"},{"text":"Where ___ (you/work)?\n**Lee:** ","a":[["do you work"]],"why":"Câu hỏi hiện tại đơn với you → do you work (không được bỏ do).","rule":"do-does"},{"text":"I ___ (work) in a shop ","a":[["work"]],"why":"Công việc lâu dài → hiện tại đơn; chủ ngữ I → work.","rule":"present-simple"},{"text":"but I ___ (not/like) it, ","a":[["don't like","do not like"]],"why":"Phủ định hiện tại đơn: don't + like. 'like' không dùng tiếp diễn.","rule":"do-does"},{"text":"so I ___ (look) for a new job now.","a":[["am looking","'m looking"]],"why":"now → đang diễn ra → am looking.","rule":"present-cont"}]},{"n":9,"type":"gap","para":true,"title":"Look at the picture and fill in the gaps with on, in, under, beside or in front of.","vi":"Nhìn tranh và điền on / in / under / beside / in front of.","pts":2,"opts":["on","in","under","beside","in front of"],"scene":"<svg viewBox='0 0 400 220' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='0' y='0' width='400' height='220' fill='var(--scene-bg)'/><rect x='0' y='185' width='400' height='35' fill='var(--scene-floor)'/><rect x='180' y='35' width='80' height='55' rx='4' fill='var(--scene-water)' stroke='var(--scene-line)' stroke-width='2'/><text x='205' y='72' font-size='22'>🐟<\/text><text x='232' y='60' font-size='18'>🐟<\/text><text x='220' y='104' font-size='10' text-anchor='middle' fill='var(--scene-ink)'>fish tank<\/text><rect x='40' y='120' width='110' height='10' rx='2' fill='var(--scene-wood)'/><rect x='46' y='130' width='8' height='55' fill='var(--scene-wood)'/><rect x='136' y='130' width='8' height='55' fill='var(--scene-wood)'/><text x='95' y='116' font-size='26' text-anchor='middle'>📚<\/text><text x='95' y='176' font-size='28' text-anchor='middle'>🐱<\/text><text x='95' y='200' font-size='10' text-anchor='middle' fill='var(--scene-ink)'>table<\/text><rect x='200' y='130' width='90' height='22' rx='4' fill='var(--scene-wood)'/><rect x='200' y='150' width='90' height='35' rx='6' fill='var(--scene-soft)' stroke='var(--scene-line)' stroke-width='2'/><text x='245' y='200' font-size='10' text-anchor='middle' fill='var(--scene-ink)'>sofa<\/text><line x1='312' y1='185' x2='312' y2='150' stroke='var(--scene-line)' stroke-width='3'/><text x='312' y='150' font-size='26' text-anchor='middle'>💡<\/text><text x='312' y='200' font-size='10' text-anchor='middle' fill='var(--scene-ink)'>lamp<\/text><line x1='356' y1='155' x2='356' y2='185' stroke='var(--scene-line)' stroke-width='4'/><rect x='320' y='100' width='72' height='55' rx='4' fill='var(--scene-dark)' stroke='var(--scene-line)' stroke-width='2'/><text x='356' y='134' font-size='16' text-anchor='middle' fill='#fff' font-weight='bold'>TV<\/text><text x='356' y='172' font-size='30' text-anchor='middle'>🐶<\/text><\/svg>","lead":"This is our living room. There's a cat *under* the table. ","items":[{"text":"There are some books ___ the table. ","a":[["on"]],"why":"Sách đặt trên mặt bàn → on.","rule":"prep-place"},{"text":"There's a lamp ___ the sofa. ","a":[["beside"]],"why":"Đèn ở bên cạnh ghế sofa → beside.","rule":"prep-place"},{"text":"A dog is ___ the TV. ","a":[["in front of"]],"why":"Chó đứng phía trước ti vi → in front of.","rule":"prep-place"},{"text":"There are some fish ___ the fish tank.","a":[["in"]],"why":"Cá ở trong bể → in.","rule":"prep-place"}]},{"n":10,"type":"gap","para":true,"title":"Fill in the gaps with on, in or at.","vi":"Điền on / in / at (giới từ chỉ thời gian).","pts":2,"opts":["on","in","at"],"lead":"*At* the weekend, I get up ","items":[{"text":"___ nine o'clock. ","a":[["at"]],"why":"at + giờ: at nine o'clock.","rule":"prep-time"},{"text":"___ Saturdays, I play football with my friends. ","a":[["on"]],"why":"on + thứ: On Saturdays.","rule":"prep-time"},{"text":"___ the afternoon, we go to the cinema. ","a":[["in"]],"why":"in + buổi: In the afternoon.","rule":"prep-time"},{"text":"___ Sunday evening, I do my homework.","a":[["on"]],"why":"Thứ + buổi → on: On Sunday evening.","rule":"prep-time"}]}]},{"id":2,"name":"Đề 2","level":"Tương đương sách","levelKey":"eq","exercises":[{"n":1,"type":"rewrite","title":"Write the sentences in the plural.","vi":"Viết lại các câu ở dạng số nhiều.","pts":2,"example":{"q":"It's a big dog.","a":"They're big dogs."},"items":[{"q":"This is a photo of my family.","a":["These are photos of my family."],"why":"This → These; photo là ngoại lệ chỉ thêm -s: photos (không phải photoes).","rule":"plural-s"},{"q":"That's a sandwich.","a":["Those are sandwiches."],"why":"That's → Those are; sandwich tận cùng -ch → sandwiches.","rule":"plural-demo"},{"q":"Look at this strawberry.","a":["Look at these strawberries."],"why":"this → these; phụ âm + y → strawberries.","rule":"plural-s"},{"q":"She's a tall woman.","a":["They're tall women."],"why":"She's → They're; woman → women.","rule":"plural-demo"},{"q":"It's a sheep.","a":["They're sheep."],"why":"It's → They're; sheep số nhiều vẫn là sheep; bỏ 'a'.","rule":"plural-s"}]},{"n":2,"type":"gap","title":"Complete the sentences with the words in the list.","vi":"Điền vào chỗ trống bằng các từ trong khung (mỗi từ dùng một lần).","pts":2,"bank":["them","our","hers","him","yours","my","her"],"example":{"text":"This is Mrs Lee and this is ___ dog.","a":"her"},"items":[{"text":"Is this bag ___? It's got your name on it.","a":[["yours"]],"why":"Không có danh từ theo sau, của bạn → yours.","rule":"poss-pron"},{"text":"We've got a new house. ___ house is big.","a":[["our"]],"why":"Đứng trước danh từ 'house', của chúng tôi (we) → Our.","rule":"poss-adj"},{"text":"I can't find my keys. Can you see ___?","a":[["them"]],"why":"Tân ngữ sau see, thay cho 'my keys' (số nhiều) → them.","rule":"obj-pron"},{"text":"That's Jenny's hat. The hat is ___.","a":[["hers"]],"why":"Không có danh từ theo sau, của Jenny → hers.","rule":"poss-pron"},{"text":"Peter is in the garden. Look at ___.","a":[["him"]],"why":"Sau 'Look at', thay cho Peter → him.","rule":"obj-pron"},{"text":"I'm Kate and this is ___ brother.","a":[["my"]],"why":"Đứng trước danh từ 'brother', của tôi → my.","rule":"poss-adj"}]},{"n":3,"type":"gap","title":"Fill in the gaps with a, an, the or –.","vi":"Điền a / an / the, hoặc – nếu không cần mạo từ.","pts":2,"opts":["a","an","the","–"],"example":{"text":"I live in ___ London.","a":"–"},"items":[{"text":"He's got ___ umbrella.","a":[["an"]],"why":"umbrella bắt đầu bằng nguyên âm u (đọc /ʌ/) → an.","rule":"art-a-an"},{"text":"She's ___ doctor.","a":[["a"]],"why":"doctor bắt đầu bằng phụ âm d → a.","rule":"art-a-an"},{"text":"___ sun is very hot today.","a":[["the"]],"why":"Mặt trời là vật duy nhất → The sun.","rule":"art-the"},{"text":"Do you want ___ egg?","a":[["an"]],"why":"egg bắt đầu bằng nguyên âm e → an.","rule":"art-a-an"},{"text":"___ Peter is my best friend.","a":[["–"]],"why":"Tên người không dùng mạo từ → –.","rule":"art-zero"}]},{"n":4,"type":"gap","title":"Fill in the gaps with much, many, some or any.","vi":"Điền much / many / some / any (mỗi chỗ trống 1 điểm).","pts":2,"opts":["much","many","some","any"],"example":{"text":"A: Have you got ___ money?  B: Yes, I've got ___.","a":"any / some"},"items":[{"text":"A: How ___ children are there in the class?\nB: Not ___.","a":[["many"],["many"]],"why":"children đếm được (số nhiều bất quy tắc) → How many? Not many.","rule":"much-many"},{"text":"A: Is there ___ cheese?\nB: Yes, there's ___ in the fridge.","a":[["any","much"],["some"]],"why":"Câu hỏi → any (hoặc much với danh từ không đếm được); câu khẳng định → some.","rule":"some-any"},{"text":"A: How ___ homework have you got?\nB: Not ___.","a":[["much"],["much"]],"why":"homework không đếm được → How much? Not much.","rule":"much-many"},{"text":"A: Can I have ___ biscuits?\nB: Sorry, there aren't ___.","a":[["some"],["any","many"]],"why":"Câu xin → some; phủ định 'there aren't' → any (hoặc many = không còn nhiều).","rule":"some-any"}]},{"n":5,"type":"gap","para":true,"title":"Fill in the gaps with some, any, no or their derivatives.","vi":"Điền some / any / no hoặc các từ ghép (someone, anything, nothing, no one…).","pts":2,"lead":"*Someone* is at the door. Who is it? ","items":[{"text":"I can't see ___. ","a":[["anyone","anybody","anything"]],"why":"Phủ định 'can't see' → anyone / anybody (không thấy ai) hoặc anything (không thấy gì).","rule":"no-compounds"},{"text":"Is ___ in the garden? ","a":[["anyone","anybody"]],"why":"Câu hỏi về người → anyone / anybody.","rule":"no-compounds"},{"text":"Is there ___ on the table? ","a":[["anything"]],"why":"Câu hỏi về vật → anything.","rule":"no-compounds"},{"text":"Yes, there's ___ in a small box. ","a":[["something"]],"why":"Câu khẳng định → something.","rule":"no-compounds"},{"text":"___ knows what it is, ","a":[["no one","nobody"]],"why":"Không ai biết → No one / Nobody + knows (động từ khẳng định, số ít).","rule":"no-compounds"},{"text":"so let's ask ___ in the house.","a":[["someone","somebody"]],"why":"Câu khẳng định (đề nghị) → someone / somebody.","rule":"no-compounds"}]},{"n":6,"type":"qa","title":"Look at the table. What do these people do on Saturdays? Write the questions and answers.","vi":"Nhìn bảng. Viết câu hỏi, câu trả lời ngắn và câu trả lời đầy đủ như mẫu.","pts":2,"when":"on Saturdays","table":{"cols":["watch TV","play the piano","go to the beach"],"rows":[{"who":"Lucy","vals":["sometimes","always","never"]},{"who":"Tom and Ben","vals":["always","never","sometimes"]}]},"example":{"prompt":"Lucy / watch TV","q":"Does Lucy watch TV on Saturdays?","s":"Yes, she does.","f":"She sometimes watches TV on Saturdays."},"items":[{"prompt":"Tom and Ben / play the piano","subj":"Tom and Ben","pron":"they","a":{"q":"Do Tom and Ben play the piano on Saturdays?","s":"No, they don't.","f":"They never play the piano on Saturdays."},"why":"Hai người = they → Do…? never → No, they don't. They never play.","rule":"freq-adv"},{"prompt":"Lucy / go to the beach","subj":"Lucy","pron":"she","a":{"q":"Does Lucy go to the beach on Saturdays?","s":"No, she doesn't.","f":"She never goes to the beach on Saturdays."},"why":"Lucy = she → Does…? never → No, she doesn't. She never goes (vẫn -es).","rule":"freq-adv"},{"prompt":"Tom and Ben / watch TV","subj":"Tom and Ben","pron":"they","a":{"q":"Do Tom and Ben watch TV on Saturdays?","s":"Yes, they do.","f":"They always watch TV on Saturdays."},"why":"they → Do…? Yes, they do. Động từ không thêm -es với they.","rule":"do-does"},{"prompt":"Lucy / play the piano","subj":"Lucy","pron":"she","a":{"q":"Does Lucy play the piano on Saturdays?","s":"Yes, she does.","f":"She always plays the piano on Saturdays."},"why":"she → Does…? Yes, she does. She always plays (thêm -s).","rule":"verb-s"},{"prompt":"Tom and Ben / go to the beach","subj":"Tom and Ben","pron":"they","a":{"q":"Do Tom and Ben go to the beach on Saturdays?","s":"Yes, they do.","f":"They sometimes go to the beach on Saturdays."},"why":"they → Do…? sometimes → Yes, they do. They sometimes go.","rule":"do-does"}]},{"n":7,"type":"gap","title":"Put the verbs in brackets into the present simple or the present continuous.","vi":"Chia động từ trong ngoặc ở thì hiện tại đơn hoặc hiện tại tiếp diễn.","pts":2,"example":{"text":"I ___ (get) up at 7 every day.","a":"get"},"items":[{"text":"My sister ___ (study) English every evening.","a":[["studies"]],"why":"every evening → thói quen; she + study (phụ âm + y) → studies.","rule":"verb-s"},{"text":"Be quiet! The baby ___ (sleep).","a":[["is sleeping"]],"why":"Be quiet! → đang xảy ra; the baby (it) → is sleeping.","rule":"present-cont"},{"text":"They ___ (not/watch) TV now.","a":[["aren't watching","are not watching"]],"why":"now → tiếp diễn; phủ định: aren't watching.","rule":"present-cont"},{"text":"___ (she/like) ice cream?","a":[["does she like"]],"why":"like là động từ trạng thái → hiện tại đơn; câu hỏi với she → Does she like…?","rule":"do-does"},{"text":"We ___ (visit) Grandma every Sunday.","a":[["visit"]],"why":"every Sunday → thói quen; we → visit (không -s).","rule":"present-simple"},{"text":"Look! Dad ___ (cook) dinner.","a":[["is cooking"]],"why":"Look! → đang xảy ra; Dad (he) → is cooking.","rule":"present-cont"}]},{"n":8,"type":"gap","para":true,"title":"Put the verbs in brackets into the present simple or the present continuous.","vi":"Chia động từ trong ngoặc (đoạn hội thoại).","pts":2,"lead":"**a** **Mum:** What *are you eating* (you/eat)?\n**Tim:** ","items":[{"text":"I ___ (eat) a sandwich.\n**b** **Sue:** ","a":[["am eating","'m eating"]],"why":"Đang ăn lúc này → I am eating.","rule":"present-cont"},{"text":"Where ___ (your dad/work)?\n**Ann:** ","a":[["does your dad work"]],"why":"Câu hỏi hiện tại đơn, your dad = he → Does your dad work…?","rule":"do-does"},{"text":"He ___ (work) in a bank. ","a":[["works"]],"why":"Công việc lâu dài → hiện tại đơn; he → works.","rule":"verb-s"},{"text":"He ___ (not/work) on Sundays. ","a":[["doesn't work","does not work"]],"why":"on Sundays → thói quen; phủ định với he: doesn't + work (nguyên mẫu).","rule":"do-does"},{"text":"He ___ (sleep) at the moment.","a":[["is sleeping","'s sleeping"]],"why":"at the moment → đang diễn ra → is sleeping.","rule":"present-cont"}]},{"n":9,"type":"gap","para":true,"title":"Look at the picture and fill in the gaps with on, in, under, beside or in front of.","vi":"Nhìn tranh và điền on / in / under / beside / in front of.","pts":2,"opts":["on","in","under","beside","in front of"],"scene":"<svg viewBox='0 0 400 220' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='0' y='0' width='400' height='220' fill='var(--scene-bg)'/><rect x='0' y='185' width='400' height='35' fill='var(--scene-floor)'/><rect x='40' y='75' width='7' height='55' fill='var(--scene-wood)'/><rect x='40' y='125' width='50' height='8' rx='2' fill='var(--scene-wood)'/><rect x='44' y='133' width='6' height='52' fill='var(--scene-wood)'/><rect x='80' y='133' width='6' height='52' fill='var(--scene-wood)'/><text x='65' y='176' font-size='28' text-anchor='middle'>🐱<\/text><text x='65' y='200' font-size='10' text-anchor='middle' fill='var(--scene-ink)'>chair<\/text><rect x='120' y='112' width='120' height='10' rx='2' fill='var(--scene-wood)'/><rect x='126' y='122' width='8' height='63' fill='var(--scene-wood)'/><rect x='226' y='122' width='8' height='63' fill='var(--scene-wood)'/><ellipse cx='180' cy='108' rx='32' ry='10' fill='var(--scene-soft)' stroke='var(--scene-line)' stroke-width='2'/><text x='168' y='106' font-size='16'>🍎<\/text><text x='184' y='104' font-size='16'>🍎<\/text><text x='180' y='200' font-size='10' text-anchor='middle' fill='var(--scene-ink)'>table + bowl<\/text><rect x='262' y='40' width='48' height='145' rx='4' fill='var(--scene-soft)' stroke='var(--scene-line)' stroke-width='2'/><line x1='262' y1='85' x2='310' y2='85' stroke='var(--scene-line)' stroke-width='2'/><text x='286' y='36' font-size='10' text-anchor='middle' fill='var(--scene-ink)'>fridge<\/text><text x='286' y='182' font-size='30' text-anchor='middle'>👦<\/text><rect x='335' y='40' width='50' height='145' rx='3' fill='var(--scene-wood)' stroke='var(--scene-line)' stroke-width='2'/><circle cx='377' cy='115' r='3' fill='var(--scene-ink)'/><text x='360' y='36' font-size='10' text-anchor='middle' fill='var(--scene-ink)'>door<\/text><text x='322' y='182' font-size='24' text-anchor='middle'>🎒<\/text><\/svg>","lead":"This is our kitchen. There's a cat *under* the chair. ","items":[{"text":"There are some apples ___ the bowl. ","a":[["in"]],"why":"Táo nằm trong bát → in.","rule":"prep-place"},{"text":"The bowl is ___ the table. ","a":[["on"]],"why":"Bát đặt trên mặt bàn → on.","rule":"prep-place"},{"text":"There's a bag ___ the door. ","a":[["beside"]],"why":"Cặp để bên cạnh cửa → beside.","rule":"prep-place"},{"text":"A boy is ___ the fridge.","a":[["in front of"]],"why":"Cậu bé đứng phía trước tủ lạnh → in front of.","rule":"prep-place"}]},{"n":10,"type":"gap","para":true,"title":"Fill in the gaps with on, in or at.","vi":"Điền on / in / at (giới từ chỉ thời gian).","pts":2,"opts":["on","in","at"],"lead":"*In* the morning I have breakfast ","items":[{"text":"___ half past seven. ","a":[["at"]],"why":"at + giờ: at half past seven.","rule":"prep-time"},{"text":"___ Mondays I have a music lesson. ","a":[["on"]],"why":"on + thứ: On Mondays.","rule":"prep-time"},{"text":"My birthday is ___ May. ","a":[["in"]],"why":"in + tháng: in May.","rule":"prep-time"},{"text":"We go to the park ___ the weekend.","a":[["at"]],"why":"at the weekend (cụm cố định).","rule":"prep-time"}]}]},{"id":3,"name":"Đề 3","level":"Khó hơn ~40%","levelKey":"hard","exercises":[{"n":1,"type":"rewrite","title":"Write the sentences in the plural.","vi":"Viết lại các câu ở dạng số nhiều (có danh từ bất quy tắc và câu có 2 danh từ).","pts":2,"example":{"q":"That's a tooth.","a":"Those are teeth."},"items":[{"q":"This is a knife.","a":["These are knives."],"why":"This → These; knife tận cùng -fe → knives.","rule":"plural-s"},{"q":"That's a leaf.","a":["Those are leaves."],"why":"That's → Those are; leaf tận cùng -f → leaves.","rule":"plural-s"},{"q":"Look at that person.","a":["Look at those people."],"why":"that → those; person → people (bất quy tắc).","rule":"plural-s"},{"q":"It's a tomato.","a":["They're tomatoes."],"why":"It's → They're; tomato tận cùng -o → tomatoes.","rule":"plural-s"},{"q":"It's a mouse in a box.","a":["They're mice in boxes.","They're mice in a box."],"why":"It's → They're; mouse → mice; 'in a box' có thể giữ nguyên (nhiều chuột trong một hộp) hoặc đổi thành boxes.","rule":"plural-demo"}]},{"n":2,"type":"gap","title":"Complete the sentences with the words in the list. Two words are extra.","vi":"Điền từ trong khung. Khung có 2 từ thừa không dùng đến.","pts":2,"bank":["it","theirs","ours","her","us","yours","hers","his","mine"],"example":{"text":"This isn't your pen. It's ___.","a":"mine"},"items":[{"text":"The dog is hungry. Give ___ some food.","a":[["it"]],"why":"Tân ngữ sau give, thay cho 'the dog' (con vật) → it.","rule":"obj-pron"},{"text":"Is this your classroom, children? Yes, it's ___.","a":[["ours"]],"why":"Không có danh từ theo sau, của chúng tôi → ours.","rule":"poss-pron"},{"text":"Those are Tom and Ben's bikes. They're ___.","a":[["theirs"]],"why":"Của Tom và Ben (they), đứng một mình → theirs.","rule":"poss-pron"},{"text":"Mrs Green is our teacher. We like ___ very much.","a":[["her"]],"why":"Tân ngữ sau like, thay cho Mrs Green → her.","rule":"obj-pron"},{"text":"Come with ___! We're going to the zoo.","a":[["us"]],"why":"Sau giới từ with, thay cho 'we' → us.","rule":"obj-pron"},{"text":"Excuse me, is this umbrella ___?","a":[["yours"]],"why":"Không có danh từ theo sau, của bạn → yours.","rule":"poss-pron"}]},{"n":3,"type":"gap","title":"Fill in the gaps with a, an, the or –.","vi":"Điền a / an / the, hoặc – nếu không cần mạo từ. Chú ý âm đầu của từ, không phải chữ cái.","pts":2,"opts":["a","an","the","–"],"example":{"text":"She plays ___ tennis on Sundays.","a":"–"},"items":[{"text":"We have ___ hour for lunch.","a":[["an"]],"why":"hour có h câm, đọc bắt đầu bằng nguyên âm → an hour.","rule":"art-a-an"},{"text":"There's ___ university in my town.","a":[["a"]],"why":"university đọc /ju:/ (âm phụ âm y) → a university.","rule":"art-a-an"},{"text":"___ Alps are in Europe.","a":[["the"]],"why":"Dãy núi đi với the: the Alps.","rule":"art-the"},{"text":"Do you speak ___ French?","a":[["–"]],"why":"Tên ngôn ngữ không dùng mạo từ → –.","rule":"art-zero"},{"text":"I play ___ guitar every day.","a":[["the"]],"why":"Nhạc cụ đi với the: play the guitar.","rule":"art-the"}]},{"n":4,"type":"gap","title":"Fill in the gaps with much, many, some or any.","vi":"Điền much / many / some / any (mỗi chỗ trống 1 điểm). Có danh từ bẫy: homework, money, people.","pts":2,"opts":["much","many","some","any"],"example":{"text":"A: How ___ people are coming?  B: Not ___.","a":"many / many"},"items":[{"text":"A: How ___ homework have you got?\nB: Not ___, only two exercises.","a":[["much"],["much"]],"why":"homework KHÔNG đếm được (dù có nhiều bài) → much / much.","rule":"much-many"},{"text":"A: Would you like ___ orange juice?\nB: Yes, please. I haven't got ___ at home.","a":[["some"],["any","much"]],"why":"Lời mời 'Would you like…?' → some; phủ định 'haven't got' → any (hoặc much).","rule":"some-any"},{"text":"A: How ___ people live in your house?\nB: Five. We haven't got ___ pets.","a":[["many"],["any","many"]],"why":"people là số nhiều đếm được → many; phủ định → any (hoặc many).","rule":"much-many"},{"text":"A: I need ___ money for the bus.\nB: How ___?","a":[["some"],["much"]],"why":"Câu khẳng định → some; money không đếm được → How much?","rule":"much-many"}]},{"n":5,"type":"gap","para":true,"title":"Fill in the gaps with some, any, no or their derivatives.","vi":"Điền some / any / no hoặc các từ ghép, kể cả somewhere / anywhere / nowhere.","pts":2,"lead":"*Nobody* is at the beach today. ","items":[{"text":"There isn't ___ swimming in the water ","a":[["anyone","anybody"]],"why":"Phủ định 'there isn't' + người đang bơi → anyone / anybody.","rule":"no-compounds"},{"text":"and there's ___ to do. ","a":[["nothing"]],"why":"'there's' khẳng định, nghĩa 'không có gì để làm' → nothing.","rule":"no-compounds"},{"text":"Is there ___ to buy ice cream? ","a":[["anywhere"]],"why":"Câu hỏi về nơi chốn → anywhere.","rule":"no-compounds"},{"text":"No, there's ___ open. ","a":[["nowhere","nothing"]],"why":"'there's' + nghĩa phủ định → nowhere (không có chỗ nào) hoặc nothing (không có gì mở cửa).","rule":"no-compounds"},{"text":"Wait! ___ is coming! It's Dad. ","a":[["someone","somebody"]],"why":"Câu khẳng định về người → Someone / Somebody.","rule":"no-compounds"},{"text":"He's got ___ for us.","a":[["something"]],"why":"Câu khẳng định về vật → something.","rule":"no-compounds"}]},{"n":6,"type":"qa","title":"Look at the table. What do these people do on Fridays? Write the questions and answers.","vi":"Bảng có 3 người, thêm trạng từ often. Viết câu hỏi, câu trả lời ngắn và câu đầy đủ như mẫu.","pts":2,"when":"on Fridays","table":{"cols":["go jogging","cook dinner","visit friends"],"rows":[{"who":"Mark","vals":["often","never","sometimes"]},{"who":"Lisa","vals":["never","always","often"]},{"who":"Tom and Ann","vals":["sometimes","never","always"]}]},"example":{"prompt":"Lisa / cook dinner","q":"Does Lisa cook dinner on Fridays?","s":"Yes, she does.","f":"She always cooks dinner on Fridays."},"items":[{"prompt":"Mark / go jogging","subj":"Mark","pron":"he","a":{"q":"Does Mark go jogging on Fridays?","s":"Yes, he does.","f":"He often goes jogging on Fridays."},"why":"Mark = he → Does…? often → Yes, he does. He often goes (thêm -es).","rule":"verb-s"},{"prompt":"Tom and Ann / cook dinner","subj":"Tom and Ann","pron":"they","a":{"q":"Do Tom and Ann cook dinner on Fridays?","s":"No, they don't.","f":"They never cook dinner on Fridays."},"why":"they → Do…? never → No, they don't. They never cook.","rule":"freq-adv"},{"prompt":"Lisa / visit friends","subj":"Lisa","pron":"she","a":{"q":"Does Lisa visit friends on Fridays?","s":"Yes, she does.","f":"She often visits friends on Fridays."},"why":"she → Does…? Yes, she does. She often visits (thêm -s).","rule":"verb-s"},{"prompt":"Mark / cook dinner","subj":"Mark","pron":"he","a":{"q":"Does Mark cook dinner on Fridays?","s":"No, he doesn't.","f":"He never cooks dinner on Fridays."},"why":"never → No, he doesn't. He never cooks (vẫn thêm -s).","rule":"freq-adv"},{"prompt":"Tom and Ann / visit friends","subj":"Tom and Ann","pron":"they","a":{"q":"Do Tom and Ann visit friends on Fridays?","s":"Yes, they do.","f":"They always visit friends on Fridays."},"why":"they → Do…? always → Yes, they do. They always visit.","rule":"do-does"}]},{"n":7,"type":"gap","title":"Put the verbs in brackets into the present simple or the present continuous.","vi":"Chia động từ, có câu phủ định, câu hỏi và động từ trạng thái.","pts":2,"example":{"text":"Tom ___ (not/eat) meat.","a":"doesn't eat"},"items":[{"text":"The students ___ (not/study) now. They're having a break.","a":[["aren't studying","are not studying"]],"why":"now → tiếp diễn; phủ định: aren't studying.","rule":"present-cont"},{"text":"My cat ___ (lie) on the sofa at the moment.","a":[["is lying"]],"why":"at the moment → tiếp diễn; lie → lying (ie → y).","rule":"present-cont"},{"text":"___ (your mum/work) on Saturdays?","a":[["does your mum work"]],"why":"on Saturdays → thói quen; câu hỏi với she → Does your mum work…?","rule":"do-does"},{"text":"I ___ (not/understand) this question.","a":[["don't understand","do not understand"]],"why":"understand là động từ trạng thái → hiện tại đơn: don't understand.","rule":"stative"},{"text":"Hurry up! The bus ___ (come).","a":[["is coming"]],"why":"Hurry up! → đang xảy ra → is coming.","rule":"present-cont"},{"text":"Jim ___ (swim) in the lake every summer.","a":[["swims"]],"why":"every summer → thói quen; Jim (he) → swims.","rule":"verb-s"}]},{"n":8,"type":"gap","para":true,"title":"Put the verbs in brackets into the present simple or the present continuous.","vi":"Chia động từ trong ngoặc (đoạn hội thoại).","pts":2,"lead":"**a** **Ann:** Why *are you running* (you/run)?\n**Ben:** ","items":[{"text":"I ___ (not/want) to be late for school!\n**b** **Pat:** ","a":[["don't want","do not want"]],"why":"want là động từ trạng thái → hiện tại đơn; phủ định với I: don't want.","rule":"stative"},{"text":"___ (you/know) that girl?\n**Sam:** ","a":[["do you know"]],"why":"know là động từ trạng thái → hiện tại đơn; câu hỏi với you → Do you know…?","rule":"stative"},{"text":"Yes, she ___ (sit) next to me in class every day. ","a":[["sits"]],"why":"every day → thói quen; she → sits.","rule":"verb-s"},{"text":"She ___ (not/talk) much ","a":[["doesn't talk","does not talk"]],"why":"Thói quen, phủ định với she: doesn't + talk.","rule":"do-does"},{"text":"but she ___ (want) to be my friend.","a":[["wants"]],"why":"want là động từ trạng thái → hiện tại đơn; she → wants.","rule":"stative"}]},{"n":9,"type":"gap","para":true,"title":"Look at the picture and fill in the gaps with in front of, behind, between, next to, opposite or under.","vi":"Nhìn tranh và điền giới từ. Thêm các giới từ mới: behind, between, next to, opposite.","pts":2,"opts":["in front of","behind","between","next to","opposite","under"],"scene":"<svg viewBox='0 0 400 220' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='0' y='0' width='400' height='220' fill='var(--scene-bg)'/><text x='130' y='68' font-size='44' text-anchor='middle'>🌳<\/text><rect x='55' y='60' width='150' height='70' rx='3' fill='var(--scene-soft)' stroke='var(--scene-line)' stroke-width='2'/><rect x='118' y='100' width='24' height='30' fill='var(--scene-wood)'/><rect x='70' y='75' width='22' height='18' fill='var(--scene-water)'/><rect x='168' y='75' width='22' height='18' fill='var(--scene-water)'/><text x='130' y='93' font-size='13' text-anchor='middle' font-weight='bold' fill='var(--scene-ink)'>SCHOOL<\/text><text x='130' y='150' font-size='32' text-anchor='middle'>🚌<\/text><text x='178' y='150' font-size='28' text-anchor='middle'>👧<\/text><text x='280' y='128' font-size='40' text-anchor='middle'>🌳<\/text><text x='370' y='128' font-size='40' text-anchor='middle'>🌳<\/text><text x='325' y='132' font-size='28' text-anchor='middle'>🚲<\/text><rect x='0' y='158' width='400' height='26' fill='var(--scene-dark)'/><line x1='0' y1='171' x2='400' y2='171' stroke='#fff' stroke-width='2' stroke-dasharray='14 10'/><rect x='60' y='190' width='110' height='28' rx='3' fill='var(--scene-soft)' stroke='var(--scene-line)' stroke-width='2'/><text x='115' y='209' font-size='13' text-anchor='middle' font-weight='bold' fill='var(--scene-ink)'>SHOP<\/text><\/svg>","lead":"This is my school. There's a big tree *behind* the school. ","items":[{"text":"A yellow bus is ___ the school. ","a":[["in front of"]],"why":"Xe buýt đỗ phía trước trường → in front of.","rule":"prep-place"},{"text":"My bike is ___ the two trees. ","a":[["between"]],"why":"Xe đạp ở giữa hai cái cây → between.","rule":"prep-place"},{"text":"The shop is ___ the school, across the road. ","a":[["opposite"]],"why":"Cửa hàng ở bên kia đường, đối diện trường → opposite.","rule":"prep-place"},{"text":"A girl is standing ___ the bus.","a":[["next to"]],"why":"Cô bé đứng ngay cạnh xe buýt → next to.","rule":"prep-place"}]},{"n":10,"type":"gap","para":true,"title":"Fill in the gaps with on, in or at.","vi":"Điền on / in / at. Có các cụm bẫy: at night, in winter, on 3rd June.","pts":2,"opts":["on","in","at"],"lead":"*On* Monday mornings I have maths. School starts ","items":[{"text":"___ half past eight. ","a":[["at"]],"why":"at + giờ: at half past eight.","rule":"prep-time"},{"text":"___ winter it's dark ","a":[["in"]],"why":"in + mùa: In winter.","rule":"prep-time"},{"text":"___ night. ","a":[["at"]],"why":"at night (cụm cố định).","rule":"prep-time"},{"text":"My mum's birthday is ___ 3rd June.","a":[["on"]],"why":"on + ngày cụ thể: on 3rd June.","rule":"prep-time"}]}]},{"id":4,"name":"Đề 4","level":"Khó hơn ~40%","levelKey":"hard","exercises":[{"n":1,"type":"rewrite","title":"Write the sentences in the plural.","vi":"Viết lại các câu ở dạng số nhiều (có câu phải đổi 2 danh từ).","pts":2,"example":{"q":"This is a wolf.","a":"These are wolves."},"items":[{"q":"That's a baby with a toy.","a":["Those are babies with toys."],"why":"That's → Those are; baby → babies; toy (nguyên âm + y) → toys.","rule":"plural-s"},{"q":"This is a box of matches.","a":["These are boxes of matches."],"why":"This → These; box → boxes; 'matches' đã là số nhiều.","rule":"plural-s"},{"q":"It's a goose.","a":["They're geese."],"why":"It's → They're; goose → geese (bất quy tắc).","rule":"plural-s"},{"q":"Look at this bus and that lorry.","a":["Look at these buses and those lorries."],"why":"this → these, that → those; bus → buses; lorry → lorries.","rule":"plural-demo"},{"q":"He's a man from Wales.","a":["They're men from Wales."],"why":"He's → They're; man → men; bỏ 'a'. 'Wales' là tên nước, giữ nguyên.","rule":"plural-demo"}]},{"n":2,"type":"gap","title":"Complete the sentences with the words in the list. Two words are extra.","vi":"Điền từ trong khung. Khung có 2 từ thừa không dùng đến.","pts":2,"bank":["him","hers","ours","its","me","theirs","your","them","my"],"example":{"text":"Mum, where are ___ shoes?","a":"my"},"items":[{"text":"The boy is crying. Give ___ the teddy bear.","a":[["him"]],"why":"Tân ngữ sau give, thay cho the boy → him.","rule":"obj-pron"},{"text":"Those aren't our seats. These are ___.","a":[["ours"]],"why":"Không có danh từ theo sau, của chúng tôi → ours.","rule":"poss-pron"},{"text":"Can you help ___? I can't do this exercise.","a":[["me"]],"why":"Tân ngữ sau help, người nói → me.","rule":"obj-pron"},{"text":"Sara has got a new phone. The phone is ___.","a":[["hers"]],"why":"Đứng một mình, của Sara → hers.","rule":"poss-pron"},{"text":"The cat is hungry. ___ bowl is empty.","a":[["its"]],"why":"Đứng trước danh từ 'bowl', của con mèo → Its (không có dấu nháy).","rule":"poss-adj"},{"text":"Those are Tom and Jim's books. They're ___.","a":[["theirs"]],"why":"Đứng một mình, của Tom và Jim → theirs.","rule":"poss-pron"}]},{"n":3,"type":"gap","title":"Fill in the gaps with a, an, the or –.","vi":"Điền a / an / the hoặc –. Một số câu có 2 chỗ trống (mỗi chỗ 1 điểm).","pts":2,"opts":["a","an","the","–"],"example":{"text":"___ Mount Everest is very high.","a":"–"},"items":[{"text":"She's ___ honest girl.","a":[["an"]],"why":"honest có h câm, đọc bắt đầu bằng nguyên âm → an.","rule":"art-a-an"},{"text":"We have ___ breakfast at 8.","a":[["–"]],"why":"Bữa ăn không dùng mạo từ: have – breakfast.","rule":"art-zero"},{"text":"I'd like ___ sandwich and ___ orange.","a":[["a"],["an"]],"why":"sandwich bắt đầu bằng phụ âm → a; orange bắt đầu bằng nguyên âm → an.","rule":"art-a-an"},{"text":"___ Pacific is the biggest ocean.","a":[["the"]],"why":"Tên đại dương đi với the: the Pacific.","rule":"art-the"},{"text":"___ Chinese speak ___ Chinese.","a":[["the"],["–"]],"why":"The Chinese = người Trung Quốc (dân tộc) → the; Chinese = tiếng Trung (ngôn ngữ) → –.","rule":"art-the"}]},{"n":4,"type":"gap","title":"Fill in the gaps with much, many, some or any.","vi":"Điền much / many / some / any (mỗi chỗ trống 1 điểm). Bẫy: time, news, mice.","pts":2,"opts":["much","many","some","any"],"example":{"text":"A: Have we got ___ bread?  B: Yes, but not ___.","a":"any / much"},"items":[{"text":"A: How ___ time have we got?\nB: Not ___. The bus leaves in five minutes.","a":[["much"],["much"]],"why":"time (thời gian) không đếm được → much / much.","rule":"much-many"},{"text":"A: There are ___ letters for you.\nB: How ___?","a":[["some"],["many"]],"why":"Khẳng định → some; letters đếm được → How many?","rule":"much-many"},{"text":"A: Is there ___ news?\nB: No, there isn't ___ news today.","a":[["any","much"],["any","much"]],"why":"Câu hỏi / phủ định → any; news không đếm được nên much cũng đúng (không có nhiều tin).","rule":"some-any"},{"text":"A: How ___ mice are there in the garden?\nB: Too ___!","a":[["many"],["many"]],"why":"mice là số nhiều (của mouse) đếm được → many / many.","rule":"much-many"}]},{"n":5,"type":"gap","para":true,"title":"Fill in the gaps with some, any, no or their derivatives.","vi":"Điền some / any / no hoặc các từ ghép.","pts":2,"lead":"*Nobody* is in the classroom. ","items":[{"text":"The teacher isn't ___ in the school. ","a":[["anywhere"]],"why":"Phủ định 'isn't' + nơi chốn → anywhere.","rule":"no-compounds"},{"text":"There's ___ strange on the board. ","a":[["something"]],"why":"Câu khẳng định → something (strange đứng sau).","rule":"no-compounds"},{"text":"___ is writing 'Happy Birthday!' on it. ","a":[["someone","somebody"]],"why":"Câu khẳng định về người → Someone / Somebody + is (số ít).","rule":"no-compounds"},{"text":"Does ___ know whose birthday it is? ","a":[["anyone","anybody"]],"why":"Câu hỏi về người → anyone / anybody.","rule":"no-compounds"},{"text":"There's ___ on the calendar. ","a":[["nothing"]],"why":"'There's' + nghĩa không có gì → nothing.","rule":"no-compounds"},{"text":"Let's ask ___ in the office.","a":[["someone","somebody"]],"why":"Đề nghị (khẳng định) → someone / somebody.","rule":"no-compounds"}]},{"n":6,"type":"qa","title":"Look at the table. How often do these people do these things? Write the questions and answers.","vi":"Bảng 3 người, có usually và often. Viết câu hỏi, trả lời ngắn và câu đầy đủ như mẫu (không cần cụm thời gian).","pts":2,"when":"","table":{"cols":["get up early","eat fast food","do sport"],"rows":[{"who":"Emma","vals":["always","never","often"]},{"who":"Jack","vals":["never","often","sometimes"]},{"who":"Mr and Mrs Lee","vals":["usually","never","always"]}]},"example":{"prompt":"Emma / eat fast food","q":"Does Emma eat fast food?","s":"No, she doesn't.","f":"She never eats fast food."},"items":[{"prompt":"Jack / get up early","subj":"Jack","pron":"he","a":{"q":"Does Jack get up early?","s":"No, he doesn't.","f":"He never gets up early."},"why":"Jack = he → Does…? never → No, he doesn't. He never gets up (thêm -s).","rule":"freq-adv"},{"prompt":"Mr and Mrs Lee / do sport","subj":"Mr and Mrs Lee","pron":"they","a":{"q":"Do Mr and Mrs Lee do sport?","s":"Yes, they do.","f":"They always do sport."},"why":"Hai người = they → Do…? Yes, they do. They always do sport.","rule":"do-does"},{"prompt":"Emma / do sport","subj":"Emma","pron":"she","a":{"q":"Does Emma do sport?","s":"Yes, she does.","f":"She often does sport."},"why":"she → Does…? Yes, she does. She often does sport (do → does).","rule":"verb-s"},{"prompt":"Jack / eat fast food","subj":"Jack","pron":"he","a":{"q":"Does Jack eat fast food?","s":"Yes, he does.","f":"He often eats fast food."},"why":"he → Does…? Yes, he does. He often eats (thêm -s).","rule":"verb-s"},{"prompt":"Mr and Mrs Lee / get up early","subj":"Mr and Mrs Lee","pron":"they","a":{"q":"Do Mr and Mrs Lee get up early?","s":"Yes, they do.","f":"They usually get up early."},"why":"they → Do…? usually → Yes, they do. They usually get up.","rule":"do-does"}]},{"n":7,"type":"gap","title":"Put the verbs in brackets into the present simple or the present continuous.","vi":"Chia động từ, có câu hỏi, phủ định, động từ trạng thái và chính tả -ing.","pts":2,"example":{"text":"Water ___ (boil) at 100 degrees.","a":"boils"},"items":[{"text":"Sh! Grandpa ___ (sleep) now.","a":[["is sleeping","'s sleeping"]],"why":"Sh! + now → đang xảy ra; Grandpa (he) → is sleeping.","rule":"present-cont"},{"text":"___ (your parents/go) to work by car?","a":[["do your parents go"]],"why":"Thói quen; your parents = they → Do your parents go…?","rule":"do-does"},{"text":"She ___ (not/wear) her glasses at the moment.","a":[["isn't wearing","is not wearing"]],"why":"at the moment → tiếp diễn; phủ định: isn't wearing.","rule":"present-cont"},{"text":"I ___ (want) a new bike.","a":[["want"]],"why":"want là động từ trạng thái → hiện tại đơn; I → want.","rule":"stative"},{"text":"The sun ___ (rise) in the east.","a":[["rises"]],"why":"Sự thật hiển nhiên → hiện tại đơn; the sun (it) → rises.","rule":"verb-s"},{"text":"The kids ___ (run) in the garden right now.","a":[["are running"]],"why":"right now → tiếp diễn; run → running (gấp đôi n).","rule":"present-cont"}]},{"n":8,"type":"gap","para":true,"title":"Put the verbs in brackets into the present simple or the present continuous.","vi":"Chia động từ trong ngoặc (đoạn hội thoại).","pts":2,"lead":"**a** **Kim:** Who *are you talking* (you/talk) to?\n**Dan:** ","items":[{"text":"I ___ (talk) to my cousin. ","a":[["am talking","'m talking"]],"why":"Đang nói chuyện lúc này → am talking.","rule":"present-cont"},{"text":"He ___ (live) in Canada.\n**b** **Mum:** ","a":[["lives"]],"why":"Nơi ở lâu dài → hiện tại đơn; he → lives.","rule":"verb-s"},{"text":"___ (you/need) any help?\n**Zoe:** No, thanks. ","a":[["do you need"]],"why":"need là động từ trạng thái → hiện tại đơn; câu hỏi với you → Do you need…?","rule":"stative"},{"text":"I ___ (make) a salad ","a":[["am making","'m making"]],"why":"Đang làm lúc này → am making (make → making).","rule":"present-cont"},{"text":"and Dad ___ (cut) the bread.","a":[["is cutting","'s cutting"]],"why":"Đang làm lúc này; Dad (he) → is cutting (gấp đôi t).","rule":"present-cont"}]},{"n":9,"type":"gap","para":true,"title":"Look at the picture and fill in the gaps with above, in, under, next to, behind or between.","vi":"Nhìn tranh và điền giới từ. Chú ý above (phía trên, không chạm) và behind (phía sau, bị che).","pts":2,"opts":["above","in","under","next to","behind","between"],"scene":"<svg viewBox='0 0 400 220' xmlns='http://www.w3.org/2000/svg' font-family=' function norm(s) {
  s = String(s == null ? '' : s).normalize('NFC').toLowerCase();
  s = s.replace(/[’‘`´]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-');
  s = s.replace(/[.,!?;:"]/g, ' ');
  s = s.replace(/\s+/g, ' ').trim();
  s = s.replace(/^'s\b/, 'is').replace(/^'m\b/, 'am').replace(/^'re\b/, 'are');
  s = s.replace(/\bi'm\b/g, 'i am').replace(/\b(they|we|you)'re\b/g, '$1 are')
       .replace(/\b(it|he|she|that|there|what|who|where|how)'s\b/g, '$1 is')
       .replace(/\bisn't\b/g, 'is not').replace(/\baren't\b/g, 'are not')
       .replace(/\bdon't\b/g, 'do not').replace(/\bdoesn't\b/g, 'does not')
       .replace(/\bcan't\b/g, 'cannot').replace(/\bhaven't\b/g, 'have not').replace(/\bhasn't\b/g, 'has not')
       .replace(/\b(i|you|we|they)'ve\b/g, '$1 have');
  s = s.replace(/\bno-one\b/g, 'no one').replace(/\bnoone\b/g, 'no one');
  return s.replace(/\s+/g, ' ').trim();
}
function matches(user, accepted) {
  const u = norm(user);
  if (!u) return false;
  for (const a0 of accepted) {
    const a = norm(a0);
    if (u === a) return true;
    if (a.indexOf(' ') > 0 && u.endsWith(' ' + a) && u.split(' ').length <= a.split(' ').length + 1) return true;
  }
  return false;
}
function qaAccepted(ex, it) {
  const when = ex.when ? ' ' + ex.when : '';
  const strip = s => when ? s.replace(when, '') : s;
  const q = [it.a.q, strip(it.a.q)];
  const s = [it.a.s];
  const f = [it.a.f, strip(it.a.f)];
  const pronCap = it.pron.charAt(0).toUpperCase() + it.pron.slice(1) + ' ';
  if (it.a.f.indexOf(pronCap) === 0) { const g = it.subj + ' ' + it.a.f.slice(pronCap.length); f.push(g, strip(g)); }
  return { q, s, f };
}
function itemFields(ex, it) {
  if (ex.type === 'rewrite') return [{ k: 0, accepted: it.a, model: it.a[0] }];
  if (ex.type === 'qa') { const a = qaAccepted(ex, it); return [{ k: 0, accepted: a.q, model: it.a.q, label: 'Câu hỏi' }, { k: 1, accepted: a.s, model: it.a.s, label: 'Trả lời ngắn' }, { k: 2, accepted: a.f, model: it.a.f, label: 'Câu đầy đủ' }]; }
  return it.a.map((alts, k) => ({ k, accepted: alts, model: alts[0] }));
}
function scoreItem(ex, okFlags) {
  const pts = ex.pts || 2;
  const n = okFlags.length, ok = okFlags.filter(Boolean).length;
  return Math.floor(pts * ok / n);
}

function grade() {
