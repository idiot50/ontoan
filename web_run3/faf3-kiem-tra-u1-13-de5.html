<title>Kiểm tra FaF3 Units 1–13 · Đề 5</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E📝%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root {
  --bg: #f4f6f3; --surface: #fff; --fg: #1d2924; --muted: #5d6c65; --line: #d7ded8; --line2: #b9c4bd;
  --accent: #1f6f5c; --accent-ink: #fff; --accent-soft: #e2f1ea;
  --ok: #2c7a39; --ok-soft: #e4f4e6; --bad: #b9312f; --bad-soft: #fbe7e5; --warn: #9a5b00; --warn-soft: #fff1d6;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131916; --surface: #1b2420; --fg: #e5ebe6; --muted: #9db0a5; --line: #2c3a33; --line2: #41534a;
  --accent: #6fcfb0; --accent-ink: #0f1f19; --accent-soft: #1d3a31;
  --ok: #7bd389; --ok-soft: #1e3525; --bad: #ff8f85; --bad-soft: #3d2321; --warn: #ffc46b; --warn-soft: #3a2c14; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #131916; --surface: #1b2420; --fg: #e5ebe6; --muted: #9db0a5; --line: #2c3a33; --line2: #41534a;
  --accent: #6fcfb0; --accent-ink: #0f1f19; --accent-soft: #1d3a31;
  --ok: #7bd389; --ok-soft: #1e3525; --bad: #ff8f85; --bad-soft: #3d2321; --warn: #ffc46b; --warn-soft: #3a2c14; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: "Nunito", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
[hidden] { display: none !important; }
button, input, select { font: inherit; }
.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .in { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { white-space: nowrap; }
.back { margin-left: auto; font-size: .88rem; font-weight: 700; color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; }
.wrap { max-width: 860px; margin: 0 auto; padding: 16px 16px 120px; }
h1 { font-size: 1.45rem; margin: 6px 0 4px; line-height: 1.25; }
h2.part { font-size: 1.15rem; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--accent); }
.muted { color: var(--muted); } .small { font-size: .88rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
.btn { border: 1px solid var(--line2); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:focus-visible, .in-t:focus-visible, select:focus-visible, .opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.exh { display: flex; gap: 10px; align-items: flex-start; }
.num { flex: 0 0 auto; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 15px; background: var(--accent); color: var(--accent-ink); font-weight: 800; display: flex; align-items: center; justify-content: center; }
.ttl { flex: 1; min-width: 0; } .ttl b { font-size: 1.02rem; } .ttl .vi { display: block; color: var(--muted); font-size: .9rem; }
.pts { flex: 0 0 auto; font-size: .8rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.pts.done { color: var(--fg); font-weight: 800; }
.audio { margin: 10px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.audio audio { width: 100%; max-width: 420px; }
.bank { display: flex; flex-wrap: wrap; gap: 6px 14px; background: var(--accent-soft); padding: 8px 12px; border-radius: 10px; margin: 10px 0; font-weight: 700; }
.eg { margin: 8px 0 2px; color: var(--muted); font-size: .95rem; }
.eg b { color: var(--accent); }
.passage { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 10px 0; white-space: pre-line; line-height: 1.7; }
.passage h4 { margin: 0 0 4px; }
.item { display: grid; grid-template-columns: 1.8em minmax(0, 1fr); gap: 4px 6px; padding: 10px 0; border-top: 1px dashed var(--line); }
.item .n { font-weight: 800; color: var(--muted); padding-top: 2px; }
.q { margin-bottom: 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.opt { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line2); border-radius: 10px; padding: 6px 12px; cursor: pointer; background: var(--surface); }
.opt input { accent-color: var(--accent); margin: 0; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); } .opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.in-t { padding: 8px 10px; border: 1.5px solid var(--line2); border-radius: 8px; background: var(--surface); color: var(--fg); width: 100%; font-size: 1rem; }
.in-t.gap { width: 9em; display: inline-block; padding: 4px 8px; margin: 2px; }
select.in-t { width: auto; max-width: 100%; }
.in-t.ok { border-color: var(--ok); background: var(--ok-soft); } .in-t.bad { border-color: var(--bad); background: var(--bad-soft); }
.words { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--line2); padding: 0 4px; margin: 0 2px; font-weight: 700; color: var(--accent); text-align: center; }
.words span { border: 1px dashed var(--line2); border-radius: 6px; padding: 2px 8px; font-weight: 700; }
.fb { font-size: .9rem; color: var(--muted); margin-top: 6px; border-left: 3px solid var(--line2); padding-left: 8px; }
.fb .a { color: var(--ok); font-weight: 800; } .fb .x { color: var(--bad); font-weight: 800; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.bar .in { max-width: 860px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.confirm { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 10px; padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score .big { font-size: 2.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.band { font-weight: 800; font-size: 1.1rem; }
table.t { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: .93rem; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; }
table.t td.r, table.t th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pbar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; min-width: 60px; }
.pbar i { display: block; height: 100%; background: var(--accent); }
.pbar i.low { background: var(--bad); } .pbar i.mid { background: var(--warn); }
.speak li { margin: 4px 0; }
.rub { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
.hist li { margin: 3px 0; }
@media (max-width: 480px) { .in-t.gap { width: 7.5em; } .brand { font-size: .9rem; } .back { font-size: .8rem; padding: 3px 9px; } .top .in { padding: 8px 12px; gap: 6px; } }
</style>

<script>
const DATA = {"pageTitle":"Kiểm tra FaF3 Units 1–13 · Đề 5","brand":"Family and Friends 3 · Units 1–13 · Đề 5","storageKey":"faf3-test-u1-13-de5-v1","exportName":"ket-qua-faf3-u1-13-de5.json","audioDir":"faf3-de5","outFile":"faf3-kiem-tra-u1-13-de5.html","title":"Bài kiểm tra Family and Friends 3 · Units 1–13 · Đề 5","subtitle":"Listening · Vocabulary & Phonics · Grammar · Reading · Writing — 100 điểm, khoảng 70 phút","instructions":["Làm lần lượt từ trên xuống. Phần nghe: bấm ▶ để nghe, mỗi bài nghe 2 lần.","Đề này có nhiều câu phải tự viết. Đọc kỹ cả câu trước và câu sau chỗ trống.","Bài viết: chữ hoa hay chữ thường đều được; viết tắt (didn't) hay viết đầy đủ (did not) đều được.","Làm xong bấm «Nộp bài» ở dưới cùng. Bài đang làm được tự lưu trên máy này."],"parts":{"A":"Part A · Listening (25 điểm)","B":"Part B · Vocabulary & Phonics (20 điểm)","C":"Part C · Grammar (28 điểm)","D":"Part D · Reading (15 điểm)","E":"Part E · Writing (12 điểm)"},"unitTitles":{"1":"They're from Australia!","2":"My weekend","3":"My things","4":"We're having fun at the beach!","5":"A naughty monkey!","6":"Jim's day","7":"Places to go!","8":"I'd like a melon!","9":"What's the fastest animal in the world?","10":"In the park!","11":"In the museum","12":"A clever baby!","13":"The Ancient Egyptians"},"bands":[{"min":85,"label":"Giỏi","advice":"Rất vững Units 1–13, kể cả các câu phải tự viết. Có thể học tiếp Units 14–15."},{"min":70,"label":"Khá","advice":"Nắm được phần lớn kiến thức. Xem lại các câu sai ở phần C và E (đặt câu hỏi, chia động từ) và các unit có thanh màu cam/đỏ."},{"min":50,"label":"Trung bình","advice":"Ôn lại từng unit yếu (bảng dưới), luyện thêm đặt câu hỏi Wh- và viết câu quá khứ, làm lại sau 1 tuần."},{"min":0,"label":"Cần ôn lại","advice":"Cần ôn lại từ vựng và ngữ pháp cơ bản theo từng unit, rồi làm lại Đề 2/3 trước khi làm lại đề này."}],"audioSources":{"t039.mp3":"../../faf/audio/Family and Friends 3 CD1_2/CD_1/Track 39.mp3","t079.mp3":"../../faf/audio/Family and Friends 3 CD1_2/CD_2/Track 32.mp3","t134.mp3":"../../faf/audio/Family and Friends 3 Class CD3/Track 47.mp3","t138.mp3":"../../faf/audio/Family and Friends 3 Class CD3/Track 51.mp3"},"exercises":[{"id":"A1","part":"A","type":"text","audio":"audio/faf3-de5/t039.mp3","title":"Listen to five children at the beach. Write one word or choose.","vi":"Nghe 5 bạn nhỏ (số 1 đến số 5) nói các bạn thích làm gì ở bãi biển. Viết MỘT từ vào chỗ trống, hoặc chọn đáp án. Trong băng có câu lệnh của sách «Listen and write the numbers» — con không cần làm theo, chỉ trả lời câu hỏi trên màn hình.","items":[{"q":"(Number 1 – Jack) Jack likes ___ at the beach.","accept":["snorkelling","snorkeling"],"unit":4,"level":2,"why":"\"What do you like doing at the beach?\" – \"I like snorkelling. It's great!\" (snorkelling = lặn với ống thở).","trap":{"snorkel":"Sau like dùng V-ing: like snorkelling.","swimming":"Bơi (swimming) là bạn số 5, Billy. Jack thích snorkelling.","surfing":"Lướt sóng là bạn số 4, Katie. Jack thích snorkelling."}},{"q":"(Number 2 – Emma) Emma likes ___ at the beach.","accept":["water skiing","waterskiing","water-skiing"],"unit":4,"level":3,"why":"\"What do you like doing at the beach, Emma?\" – \"I like water skiing.\" (water skiing = lướt ván nước, có thuyền kéo).","trap":{"windsurfing":"Băng nói \"water skiing\" (lướt ván nước), không phải windsurfing (lướt ván buồm).","surfing":"Surfing là của Katie (số 4). Emma nói \"water skiing\".","water ski":"Sau like dùng V-ing: water skiing."}},{"q":"(Number 2 – Emma) Emma thinks water skiing is very ___.","accept":["safe"],"unit":4,"level":3,"why":"\"Is it dangerous?\" – \"No, it isn't. It's very safe.\" — Emma nói KHÔNG nguy hiểm, rất an toàn (safe).","trap":{"dangerous":"Người hỏi nói \"Is it dangerous?\" nhưng Emma trả lời \"No, it isn't. It's very safe.\" → safe.","great":"\"It's great\" là Jack nói về snorkelling. Emma nói \"very safe\".","fun":"\"It's fun\" là Tony và Katie nói. Emma nói \"very safe\"."}},{"q":"(Number 3 – Tony) Tony thinks kayaking is ___, but it's fun.","accept":["difficult"],"unit":13,"level":2,"why":"\"Is it difficult?\" – \"Yes, but it's fun!\" → chèo thuyền kayak khó (difficult) nhưng vui.","trap":{"easy":"Tony trả lời \"Yes\" cho câu hỏi \"Is it difficult?\" → khó (difficult), không phải easy.","dificult":"difficult có HAI chữ f: di-ff-i-cult.","safe":"\"very safe\" là Emma nói về water skiing."}},{"type":"mcq","q":"(Number 4 – Katie) Why does Katie like surfing?","options":["It's safe.","It's fun.","It's easy."],"answer":1,"unit":4,"level":1,"why":"\"I like surfing. It's fun!\"","trap":{"0":"\"It's very safe\" là Emma (số 2) nói về water skiing.","2":"Không ai nói \"easy\". Katie nói \"It's fun\"."}},{"q":"(Number 5 – Billy) Billy likes swimming. The person who asks the questions likes ___, too.","accept":["swimming"],"unit":2,"level":3,"why":"Billy: \"I like swimming!\" – Người hỏi: \"Do you? I like swimming too!\" — too = cũng.","trap":{"swim":"like + V-ing: likes swimming.","surfing":"Người hỏi không nói thích surfing. Người đó nói \"I like swimming too!\"","snorkelling":"Người hỏi không nói thích snorkelling. Người đó nói \"I like swimming too!\""}}]},{"id":"A2","part":"A","type":"text","audio":"audio/faf3-de5/t079.mp3","title":"Listen to the quiz about four countries. Write one word or choose.","vi":"Nghe đố vui về hồ, sông, núi ở 4 nước. Tên riêng khó nghe con không cần viết — chỉ viết các từ được hỏi, hoặc chọn đáp án. Trong băng có câu lệnh của sách «Listen and complete the table» — con không cần làm theo, chỉ trả lời câu hỏi trên màn hình.","items":[{"q":"(Number 1 – Egypt) The Nile is the ___ river in Egypt.","accept":["longest"],"unit":9,"level":2,"why":"\"What's the longest river in Egypt?\" – \"The Nile.\" → longest (dài nhất).","trap":{"longer":"Băng nói \"the longest river\" (dài nhất). longer dùng với than.","long":"Có the … in Egypt → so sánh nhất: longest.","biggest":"biggest đi với lake (hồ): the biggest lake. Sông Nile là the longest river.","highest":"highest đi với mountain (núi). Sông Nile là the longest river."}},{"q":"(Number 1 – Egypt) Mount Catherine is the highest ___ in Egypt.","accept":["mountain"],"unit":9,"level":1,"why":"\"What's the highest mountain in Egypt?\" – \"Mount Catherine.\"","trap":{"river":"Câu hỏi trong băng là \"the highest mountain\". Mount = núi.","lake":"Hồ lớn nhất là Lake Nasser. Mount Catherine là núi (mountain).","mountian":"Chính tả: m-o-u-n-t-a-i-n."}},{"type":"mcq","q":"Lake Sanabria is the biggest lake in ___.","options":["Egypt","Spain","Brazil"],"answer":1,"unit":1,"level":2,"why":"Bài số 2: \"What's the biggest lake in Spain?\" – \"Is it Lake Sanabria?\" – \"Yes, it is!\"","trap":{"0":"Hồ lớn nhất ở Egypt là Lake Nasser (bài số 1).","2":"Hồ lớn nhất ở Brazil là Lake Patos (bài số 3)."}},{"type":"mcq","q":"(Number 3 – Brazil) The longest river in Brazil is ___.","options":["the Nile","the Tagus","the Amazon"],"answer":2,"unit":9,"level":1,"why":"\"What's the longest river in Brazil?\" – \"The Amazon.\" – \"That's right!\"","trap":{"0":"The Nile là sông dài nhất ở Egypt (bài số 1).","1":"The Tagus là sông dài nhất ở Spain (bài số 2)."}},{"q":"Ben Nevis is the highest mountain in ___.","accept":["the UK","UK","the U.K."],"unit":1,"level":2,"why":"Bài số 4 nói về the UK: \"What's the highest mountain in the UK?\" – \"Is it Ben Nevis?\" – \"Yes, it is!\"","trap":{"Spain":"Núi cao nhất ở Spain là Mount Teide (bài số 2). Ben Nevis ở the UK (bài số 4).","Egypt":"Núi cao nhất ở Egypt là Mount Catherine. Ben Nevis ở the UK.","Brazil":"Ben Nevis ở bài số 4 — the UK."}},{"type":"mcq","q":"(Number 4 – the UK) Which question can't the child answer?","options":["What's the biggest lake in the UK?","What's the longest river in the UK?","What's the highest mountain in the UK?"],"answer":1,"unit":9,"level":3,"why":"\"What's the longest river in the UK?\" – \"Oh, I don't know that.\" → người lớn phải nói: the Severn.","trap":{"0":"Bạn nhỏ trả lời được câu hồ lớn nhất (\"It's Loch Ness\" – \"That's right!\").","2":"Bạn nhỏ trả lời được câu núi cao nhất (\"Is it Ben Nevis?\" – \"Yes, it is!\")."}}]},{"id":"A3","part":"A","type":"text","audio":"audio/faf3-de5/t134.mp3","title":"Listen to the zoo advert. Write one word or choose.","vi":"Nghe quảng cáo của một sở thú mới. Viết MỘT từ vào chỗ trống, hoặc chọn đáp án. Trong băng có câu lệnh của sách «Listen and write» — con không cần làm theo, chỉ trả lời câu hỏi trên màn hình.","items":[{"q":"Animal Land Zoo is opening ___.","accept":["today"],"unit":4,"level":1,"why":"\"Animal Land Zoo is opening today.\"","trap":{"tomorrow":"Băng nói \"today\" (hôm nay), không phải tomorrow."}},{"q":"Around the lake, you can watch the crocodiles and the ___.","accept":["flamingos","flamingoes"],"unit":5,"level":3,"why":"\"…our lake, where you can watch our crocodiles and flamingos.\" (flamingo = chim hồng hạc; nhiều con → flamingos).","trap":{"flamingo":"Nhiều con → thêm -s: flamingos.","penguins":"Chim cánh cụt xem lúc 3 giờ, không ở hồ. Ở hồ có crocodiles và flamingos.","zebras":"zebras được nhắc ở câu sau (\"We've got zebras and kangaroos too\"), không phải ở hồ."}},{"q":"The zoo has got zebras and ___, too.","accept":["kangaroos"],"unit":5,"level":2,"why":"\"We've got zebras and kangaroos too!\"","trap":{"kangaroo":"Nhiều con → kangaroos (thêm -s).","camels":"camels được nhắc ở câu sau (\"three friendly camels\"). Câu này: zebras and kangaroos.","crocodiles":"crocodiles ở hồ, nói ở câu trước. Câu này: zebras and kangaroos."}},{"q":"The three camels are very ___.","accept":["friendly"],"unit":12,"level":2,"why":"\"…come and meet our three friendly camels.\" (friendly = thân thiện).","trap":{"frendly":"Chính tả: f-r-i-e-n-d-l-y (có i sau r).","friendy":"Chính tả: friend + ly = friendly.","funny":"Băng nói \"friendly\" (thân thiện): friend-ly."}},{"type":"mcq","q":"What can you do with the camels?","options":["Ride on them around the park.","Watch them in the lake.","Watch them at three o'clock."],"answer":0,"unit":5,"level":2,"why":"\"They can take you for a ride around the park.\" → con có thể cưỡi lạc đà đi quanh công viên.","trap":{"1":"Ở hồ là crocodiles và flamingos, không phải lạc đà.","2":"Lúc 3 giờ là xem chim cánh cụt (penguins), không phải lạc đà."}},{"q":"At three o'clock, you can come and watch the ___.","accept":["penguins"],"unit":5,"level":1,"why":"\"…at three o'clock you can come and watch the penguins.\"","trap":{"penguin":"Băng nói \"the penguins\" (nhiều con, có -s).","camels":"Lạc đà chở khách đi quanh công viên. Lúc 3 giờ xem penguins.","flamingos":"Hồng hạc ở hồ. Lúc 3 giờ xem penguins."}}]},{"id":"A4","part":"A","type":"text","audio":"audio/faf3-de5/t138.mp3","title":"Listen and write the missing word.","vi":"Nghe 4 câu ngắn (mỗi câu có hai vế). Viết từ còn thiếu (hoặc số). Trong băng có câu lệnh của sách «Listen and tick» (chọn tranh) — con KHÔNG cần tranh, chỉ nghe và viết vào chỗ trống trên màn hình.","items":[{"q":"(1) Car B is the ___.","accept":["biggest"],"unit":9,"level":2,"why":"\"Car B is the biggest.\" big → biggest (gấp đôi chữ g).","trap":{"bigest":"big → biggest: gấp đôi chữ g.","bigger":"Băng nói \"the biggest\" (lớn nhất). bigger dùng với than.","smallest":"smallest là Car A. Car B là the biggest."}},{"q":"(1) Car A is the ___.","accept":["smallest"],"unit":9,"level":2,"why":"\"…and Car A is the smallest.\"","trap":{"smaller":"Băng nói \"the smallest\" (nhỏ nhất).","biggest":"biggest là Car B. Car A là the smallest.","smalest":"small + est = smallest (hai chữ l)."}},{"q":"(2) Hotel 1 is the ___.","accept":["oldest"],"unit":9,"level":2,"why":"\"Hotel 1 is the oldest…\" (cũ nhất).","trap":{"tallest":"tallest là Hotel 2. Hotel 1 là the oldest.","older":"Băng nói \"the oldest\"."}},{"q":"(2) Hotel 2 is the ___.","accept":["tallest"],"unit":9,"level":2,"why":"\"…and Hotel 2 is the tallest.\" (cao nhất).","trap":{"oldest":"oldest là Hotel 1. Hotel 2 là the tallest.","highest":"Băng nói \"the tallest\" với Hotel 2. highest là cánh cửa số 5.","talest":"tall + est = tallest (hai chữ l)."}},{"q":"(3) Door number 3 is the ___.","accept":["widest"],"unit":9,"level":3,"why":"\"Door number 3 is the widest…\" wide (rộng) đã có e → chỉ thêm -st: widest.","trap":{"wideest":"wide đã có e ở cuối → chỉ thêm -st: widest.","highest":"highest là cửa số 5. Cửa số 3 là the widest.","wider":"Băng nói \"the widest\"."}},{"q":"(3) Door number ___ is the highest.","accept":["5","five"],"unit":9,"level":3,"why":"\"…and door number 5 is the highest.\" (Cửa số 3 là widest.)","trap":{"3":"Cửa số 3 là the widest (rộng nhất). Cao nhất là cửa số 5.","three":"Cửa số 3 là the widest (rộng nhất). Cao nhất là cửa số 5."}},{"q":"(4) The kangaroo is the ___.","accept":["fastest"],"unit":9,"level":2,"why":"\"The kangaroo is the fastest. The penguin is the slowest.\"","trap":{"slowest":"slowest là con chim cánh cụt (penguin). Kangaroo là the fastest.","faster":"Băng nói \"the fastest\"."}}]},{"id":"B1","part":"B","type":"text","title":"Read and complete the text with the words in the box.","vi":"Đọc bài. Viết từ trong khung vào chỗ trống (1)–(7). Mỗi từ dùng một lần. Có 4 từ thừa.","passageTitle":"Saturday mornings in the park","passage":"On Saturday mornings, I go to the park near my house with my grandpa. We always (1) ________ my friend Nam there. He comes with his little dog, Bobby.\n\nFirst, we walk (2) ________ the path to the big trees. There are lots of small, pretty (3) ________ next to the path – red, yellow and pink. Grandpa loves taking photos of them.\n\nThen Nam plays with Bobby on the (4) ________. It's green and soft. Nam kicks a ball, and Bobby runs fast to (5) ________ it in his mouth.\n\nThere is a small lake in the park. Sometimes Bobby jumps into it! Grandpa isn't happy then. He (6) ________, \"Bobby! Come out of the water!\" After that, we (7) ________ the street and walk home for lunch.","bank":["meet","along","flowers","grass","catch","shouts","cross","through","between","playground","laughs"],"items":[{"q":"(1) We always ___ my friend Nam there.","accept":["meet"],"unit":10,"level":2,"why":"Gặp bạn Nam ở công viên → meet (gặp). We → meet (không -s).","trap":{"along":"along là giới từ (chỉ vị trí, hướng đi); chỗ này cần động từ (việc làm) → meet.","flowers":"flowers là danh từ (hoa); chỗ này cần động từ sau We always → meet.","grass":"grass là danh từ (tên đồ vật, nơi chốn); chỗ này cần động từ (việc làm) → meet.","catch":"catch = bắt (bắt bóng). «Bắt» bạn Nam thì không hợp nghĩa; ông và cháu GẶP Nam → meet.","shouts":"We → không thêm -s; và «hét bạn Nam» không hợp nghĩa. → meet.","cross":"cross = đi qua (đường, sông). Không «đi qua» bạn Nam. → meet.","through":"through là giới từ (chỉ vị trí, hướng đi); chỗ này cần động từ (việc làm) → meet.","between":"between là giới từ (chỉ vị trí, hướng đi); chỗ này cần động từ (việc làm) → meet.","playground":"playground là danh từ (tên đồ vật, nơi chốn); chỗ này cần động từ (việc làm) → meet.","laughs":"We → không thêm -s; laugh (cười) cũng không có người theo sau. → meet."}},{"q":"(2) First, we walk ___ the path to the big trees.","accept":["along"],"unit":11,"level":3,"why":"Đi DỌC THEO lối đi → walk along the path.","trap":{"meet":"meet là động từ (việc làm); chỗ này cần giới từ (chỉ vị trí, hướng đi) → along.","flowers":"flowers là danh từ (tên đồ vật, nơi chốn); chỗ này cần giới từ (chỉ vị trí, hướng đi) → along.","grass":"grass là danh từ (tên đồ vật, nơi chốn); chỗ này cần giới từ (chỉ vị trí, hướng đi) → along.","catch":"catch là động từ (việc làm); chỗ này cần giới từ (chỉ vị trí, hướng đi) → along.","shouts":"shouts là động từ có -s (dùng cho he/she/it); chỗ này cần giới từ (chỉ vị trí, hướng đi) → along.","cross":"cross là động từ (việc làm); chỗ này cần giới từ (chỉ vị trí, hướng đi) → along.","through":"through = đi xuyên qua (qua đường hầm, qua khu rừng). Đi dọc theo một lối đi → along.","between":"between = ở giữa HAI thứ (between the café and the library). Ở đây chỉ có một lối đi → along.","playground":"playground là danh từ (tên đồ vật, nơi chốn); chỗ này cần giới từ (chỉ vị trí, hướng đi) → along.","laughs":"laughs là động từ có -s (dùng cho he/she/it); chỗ này cần giới từ (chỉ vị trí, hướng đi) → along."}},{"q":"(3) There are lots of small, pretty ___ next to the path – red, yellow and pink.","accept":["flowers"],"unit":10,"level":1,"why":"Nhỏ, xinh, màu đỏ, vàng, hồng, mọc cạnh lối đi → flowers (hoa).","trap":{"meet":"meet là động từ (việc làm); chỗ này cần danh từ (tên đồ vật, nơi chốn) → flowers.","along":"along là giới từ (chỉ vị trí, hướng đi); chỗ này cần danh từ (tên đồ vật, nơi chốn) → flowers.","grass":"Cỏ màu xanh, không đỏ, vàng, hồng; và grass không có -s («lots of small pretty grass» không đúng). → flowers.","catch":"catch là động từ (việc làm); chỗ này cần danh từ (tên đồ vật, nơi chốn) → flowers.","shouts":"shouts là động từ có -s (dùng cho he/she/it); chỗ này cần danh từ (tên đồ vật, nơi chốn) → flowers.","cross":"cross là động từ (việc làm); chỗ này cần danh từ (tên đồ vật, nơi chốn) → flowers.","through":"through là giới từ (chỉ vị trí, hướng đi); chỗ này cần danh từ (tên đồ vật, nơi chốn) → flowers.","between":"between là giới từ (chỉ vị trí, hướng đi); chỗ này cần danh từ (tên đồ vật, nơi chốn) → flowers.","playground":"Sân chơi không «nhỏ xinh màu đỏ, vàng, hồng» mọc cạnh lối đi. → flowers.","laughs":"laughs là động từ có -s (dùng cho he/she/it); chỗ này cần danh từ (tên đồ vật, nơi chốn) → flowers."}},{"q":"(4) Then Nam plays with Bobby on the ___. It's green and soft.","accept":["grass"],"unit":10,"level":2,"why":"Đọc câu SAU: «It's green and soft» (xanh và mềm) → grass (bãi cỏ).","trap":{"meet":"meet là động từ (việc làm); chỗ này cần danh từ (tên đồ vật, nơi chốn) → grass.","along":"along là giới từ (chỉ vị trí, hướng đi); chỗ này cần danh từ (tên đồ vật, nơi chốn) → grass.","flowers":"flowers là số nhiều, nhưng câu sau nói «It's green and soft» (một thứ, màu xanh) → grass. flowers đã dùng ở chỗ (3).","catch":"catch là động từ (việc làm); chỗ này cần danh từ (tên đồ vật, nơi chốn) → grass.","shouts":"shouts là động từ có -s (dùng cho he/she/it); chỗ này cần danh từ (tên đồ vật, nơi chốn) → grass.","cross":"cross là động từ (việc làm); chỗ này cần danh từ (tên đồ vật, nơi chốn) → grass.","through":"through là giới từ (chỉ vị trí, hướng đi); chỗ này cần danh từ (tên đồ vật, nơi chốn) → grass.","between":"between là giới từ (chỉ vị trí, hướng đi); chỗ này cần danh từ (tên đồ vật, nơi chốn) → grass.","playground":"Sân chơi không «green and soft» (xanh, mềm). → grass.","laughs":"laughs là động từ có -s (dùng cho he/she/it); chỗ này cần danh từ (tên đồ vật, nơi chốn) → grass."}},{"q":"(5) Nam kicks a ball, and Bobby runs fast to ___ it in his mouth.","accept":["catch"],"unit":10,"level":2,"why":"Chó chạy nhanh để bắt (ngoạm) quả bóng bằng miệng → catch.","trap":{"meet":"meet = gặp (người). Không «gặp» quả bóng. → catch.","along":"along là giới từ (chỉ vị trí, hướng đi); chỗ này cần động từ (việc làm) → catch.","flowers":"flowers là danh từ (tên đồ vật, nơi chốn); chỗ này cần động từ (việc làm) → catch.","grass":"grass là danh từ (tên đồ vật, nơi chốn); chỗ này cần động từ (việc làm) → catch.","shouts":"Sau to dùng động từ nguyên mẫu, và «hét quả bóng» không hợp nghĩa. → catch.","cross":"cross = đi qua (đường, sông). Không «đi qua» quả bóng. → catch.","through":"through là giới từ (chỉ vị trí, hướng đi); chỗ này cần động từ (việc làm) → catch.","between":"between là giới từ (chỉ vị trí, hướng đi); chỗ này cần động từ (việc làm) → catch.","playground":"playground là danh từ (tên đồ vật, nơi chốn); chỗ này cần động từ (việc làm) → catch.","laughs":"Sau to dùng động từ nguyên mẫu, và «cười quả bóng» không hợp nghĩa. → catch."}},{"q":"(6) Grandpa isn't happy then. He ___, \"Bobby! Come out of the water!\"","accept":["shouts"],"unit":10,"level":3,"why":"Ông không vui, gọi to «Bobby! Come out of the water!» → shouts (hét, gọi to). He → thêm -s.","trap":{"meet":"He → phải có -s; và ông đang gọi to, không phải gặp ai. → shouts.","along":"along là giới từ (chỉ vị trí, hướng đi); chỗ này cần động từ có -s (dùng cho he/she/it) → shouts.","flowers":"flowers là danh từ (tên đồ vật, nơi chốn); chỗ này cần động từ có -s (dùng cho he/she/it) → shouts.","grass":"grass là danh từ (tên đồ vật, nơi chốn); chỗ này cần động từ có -s (dùng cho he/she/it) → shouts.","catch":"He → phải có -s; ông đang gọi to, không bắt gì. → shouts.","cross":"He → phải có -s; và cross = đi qua (đường, sông). Ông đang gọi to → shouts.","through":"through là giới từ (chỉ vị trí, hướng đi); chỗ này cần động từ có -s (dùng cho he/she/it) → shouts.","between":"between là giới từ (chỉ vị trí, hướng đi); chỗ này cần động từ có -s (dùng cho he/she/it) → shouts.","playground":"playground là danh từ (tên đồ vật, nơi chốn); chỗ này cần động từ có -s (dùng cho he/she/it) → shouts.","laughs":"Ông không vui (isn't happy) nên không cười. Ông đang gọi to → shouts."}},{"q":"(7) After that, we ___ the street and walk home for lunch.","accept":["cross"],"unit":10,"level":1,"why":"Đi sang bên kia đường → cross the street. We → cross (không -s).","trap":{"meet":"meet = gặp (người). Không «gặp» con phố. → cross.","along":"along là giới từ; sau we cần động từ (việc làm) → cross.","flowers":"flowers là danh từ (tên đồ vật, nơi chốn); chỗ này cần động từ (việc làm) → cross.","grass":"grass là danh từ (tên đồ vật, nơi chốn); chỗ này cần động từ (việc làm) → cross.","catch":"catch = bắt. Không bắt con phố. → cross.","shouts":"We → không thêm -s; «hét con phố» không hợp nghĩa. → cross.","through":"through là giới từ; sau we cần động từ (việc làm) → cross.","between":"between là giới từ (chỉ vị trí, hướng đi); chỗ này cần động từ (việc làm) → cross.","playground":"playground là danh từ (tên đồ vật, nơi chốn); chỗ này cần động từ (việc làm) → cross.","laughs":"We → không thêm -s; «cười con phố» không hợp nghĩa. → cross."}}]},{"id":"B2","part":"B","type":"text","title":"Read and write the word. The first letter is there to help you.","vi":"Đọc câu và viết cả từ còn thiếu (chữ cái đầu đã cho sẵn; mỗi gạch là một chữ cái).","items":[{"q":"The season after summer is a _ _ _ _ _.","accept":["autumn","utumn"],"unit":1,"level":2,"why":"Mùa sau mùa hè là mùa thu: autumn (6 chữ cái, có chữ n câm ở cuối).","trap":{"autum":"autumn có chữ n câm ở cuối: a-u-t-u-m-n.","winter":"winter là mùa SAU autumn. Sau summer là autumn.","spring":"spring là mùa TRƯỚC summer."}},{"q":"My hair is very long. I b _ _ _ _ it every morning before school.","accept":["brush","rush"],"unit":6,"level":2,"why":"Chải tóc → brush my hair (5 chữ cái: b-r-u-s-h).","trap":{"brushes":"Chủ ngữ là I → brush (không thêm -es); chỉ có 5 chữ cái.","bruch":"Chính tả: b-r-u-s-h.","wash":"Chữ cái đầu là b. Tóc dài, chải mỗi sáng → brush."}},{"q":"They are small, round and green. We eat them with meat and potatoes. They are p _ _ _.","accept":["peas","eas"],"unit":8,"level":2,"why":"Nhỏ, tròn, xanh, ăn với thịt và khoai tây → peas (đậu Hà Lan), 4 chữ cái.","trap":{"pea":"They are … (nhiều hạt) → peas, 4 chữ cái.","pease":"Chính tả: p-e-a-s (4 chữ cái).","potatoes":"potatoes đã có trong câu. Thứ nhỏ, tròn, xanh → peas."}},{"q":"It's ten o'clock at night and my brother isn't home. Mum is very w _ _ _ _ _ _.","accept":["worried","orried"],"unit":12,"level":2,"why":"Muộn rồi mà em chưa về → mẹ lo lắng: worried (w-o-r-r-i-e-d).","trap":{"worry":"Sau is very cần tính từ: worried (7 chữ cái).","woried":"worried có hai chữ r: wo-rr-ied.","worryed":"worry → worried: đổi y thành i rồi thêm -ed."}},{"q":"My aunt is an a _ _ _ _. She is in a new play at the theatre.","accept":["actor","ctor"],"unit":7,"level":2,"why":"Người đóng kịch, đóng phim → actor (diễn viên), 5 chữ cái.","trap":{"acter":"Cuối từ viết -or: act-or.","singer":"Chữ cái đầu là a. Người diễn trong vở kịch (play) → actor."}},{"q":"My little sister has got lots of s _ _ _ _ _ _ _. She puts them on her books and on her bag.","accept":["stickers","tickers"],"unit":3,"level":2,"why":"Dán lên sách và cặp → stickers (hình dán), 8 chữ cái: s-t-i-c-k-e-r-s.","trap":{"shells":"shells (vỏ sò) chỉ có 6 chữ cái và không dán lên sách được. → stickers.","stikers":"stickers có ck: s-t-i-c-k-e-r-s.","sticker":"lots of → số nhiều: stickers."}}]},{"id":"B3","part":"B","type":"mcq","title":"Phonics. Which word has a different sound?","vi":"Đọc thầm 4 từ. Ba từ có cùng một âm nguyên âm. Chọn từ có âm KHÁC.","items":[{"q":"town – cloud – soup – shout","options":["town","cloud","soup","shout"],"answer":2,"unit":7,"level":3,"why":"town (ow), cloud, shout (ou) cùng đọc /aʊ/ (như «ao» trong cow, house). soup viết ou nhưng đọc /uː/ (như spoon).","trap":{"0":"town: ow đọc /aʊ/ giống cloud, shout. soup viết ou nhưng đọc «u» dài như spoon.","1":"cloud: ou đọc /aʊ/ giống town, shout. soup đọc ou như spoon.","3":"shout: ou đọc /aʊ/ giống town, cloud. soup đọc ou như spoon."}},{"q":"hat – cake – wait – day","options":["hat","cake","wait","day"],"answer":0,"unit":10,"level":1,"why":"cake (a_e), wait (ai), day (ay) cùng âm /eɪ/. hat có a ngắn /æ/.","trap":{"1":"cake (a_e) đọc /eɪ/ giống wait, day.","2":"wait (ai) đọc /eɪ/ giống cake, day.","3":"day (ay) đọc /eɪ/ giống cake, wait."}},{"q":"fork – paw – farm – yawn","options":["fork","paw","farm","yawn"],"answer":2,"unit":5,"level":2,"why":"fork (or), paw, yawn (aw) cùng âm /ɔː/. farm (ar) đọc /ɑː/ như car, park.","trap":{"0":"fork (or) đọc /ɔː/ giống paw, yawn.","1":"paw (aw) đọc /ɔː/ giống fork — viết khác nhưng cùng âm.","3":"yawn (aw) đọc /ɔː/ giống fork, paw."}},{"q":"boy – oil – toy – cow","options":["boy","oil","toy","cow"],"answer":3,"unit":6,"level":1,"why":"boy, toy (oy) và oil (oi) cùng âm /ɔɪ/. cow (ow) đọc /aʊ/ như house.","trap":{"0":"boy (oy) đọc /ɔɪ/ giống oil, toy.","1":"oil (oi) đọc /ɔɪ/ giống boy, toy.","2":"toy (oy) đọc /ɔɪ/ giống boy, oil."}},{"q":"queen – sea – happy – bread","options":["queen","sea","happy","bread"],"answer":3,"unit":11,"level":2,"why":"queen (ee), sea (ea) và chữ y cuối happy cùng âm /iː/–/i/ (như green, jelly). Trong bread, ea đọc /e/ ngắn (như bed).","trap":{"0":"queen (ee) đọc /iː/ giống sea. Từ khác âm là bread (ea đọc /e/).","1":"sea (ea) đọc /iː/ giống queen. Chú ý: bread cũng viết ea nhưng đọc /e/ ngắn.","2":"y cuối happy đọc /i/ như jelly — cùng nhóm âm với queen, sea. bread đọc /e/."}},{"q":"face – space – bag – snake","options":["face","space","bag","snake"],"answer":2,"unit":2,"level":1,"why":"face, space, snake (a_e) cùng âm /eɪ/. bag có a ngắn /æ/.","trap":{"0":"face (a_e) đọc /eɪ/ giống space, snake.","1":"space (a_e) đọc /eɪ/ giống face, snake.","3":"snake (a_e) đọc /eɪ/ giống face, space."}},{"q":"warm – park – car – star","options":["warm","park","car","star"],"answer":0,"unit":3,"level":3,"why":"park, car, star (ar) cùng âm /ɑː/. warm viết ar nhưng đọc /ɔː/ (như fork, horse).","trap":{"1":"park (ar) đọc /ɑː/ giống car, star. warm viết ar nhưng đọc như fork.","2":"car (ar) đọc /ɑː/ giống park, star.","3":"star (ar) đọc /ɑː/ giống park, car."}}]},{"id":"C1","part":"C","type":"mcq","title":"Choose the correct answer.","vi":"Chọn đáp án đúng.","items":[{"q":"\"Are your cousins from Spain?\" \"No, ___. They're from Brazil.\"","options":["they aren't","they don't","they isn't"],"answer":0,"unit":1,"level":2,"why":"Câu hỏi dùng Are (be) → trả lời bằng be: No, they aren't.","trap":{"1":"Câu hỏi bắt đầu bằng Are → trả lời bằng are: No, they aren't. don't chỉ dùng khi câu hỏi là Do …?","2":"they (nhiều người) → aren't; isn't dùng cho he/she/it."}},{"q":"It's very late and I want to sleep. Can you ___ the TV, please?","options":["turn on","turn off","use"],"answer":1,"unit":3,"level":2,"why":"Muộn rồi, muốn đi ngủ → nhờ TẮT TV: turn off.","trap":{"0":"turn on = bật. Muốn đi ngủ thì nhờ tắt TV → turn off.","2":"«Can you use the TV» = bạn dùng TV đi — ngược ý muốn đi ngủ. → turn off."}},{"q":"Max has got a little sister. ___ name is Holly.","options":["His","Her","Their"],"answer":1,"unit":3,"level":2,"why":"Tên ở đây là tên của em gái (cô bé) → Her name is Holly.","trap":{"0":"His = của cậu ấy (Max). Nhưng Holly là tên của em gái → Her.","2":"Their = của họ (nhiều người). Đây là tên của một cô bé → Her."}},{"q":"Listen! I can hear water in the bathroom. ___","options":["Is Dad have a shower?","Is Dad having a shower?","Does Dad having a shower?"],"answer":1,"unit":5,"level":2,"why":"Listen! → việc đang xảy ra. Câu hỏi: Is + Dad + V-ing: Is Dad having a shower?","trap":{"0":"Sau Is … cần V-ing: having.","2":"Does không đi với V-ing. Đang xảy ra → Is Dad having a shower?"}},{"q":"Dad is making dinner. He needs ___.","options":["some meats and three onions","some meat and three onion","some meat and three onions"],"answer":2,"unit":8,"level":3,"why":"meat (thịt) không đếm được → some meat (không -s). onion đếm được, ba củ → three onions.","trap":{"0":"meat không đếm được → không thêm -s: some meat.","1":"three (ba) → số nhiều: three onions."}},{"q":"Look at that man ___ the mountain! He can see all the town from there.","options":["at the top of","between","inside"],"answer":0,"unit":11,"level":2,"why":"Đứng trên đỉnh núi thì nhìn thấy cả thị trấn → at the top of the mountain.","trap":{"1":"between cần HAI thứ (between the cinema and the library). Ở đây chỉ có một ngọn núi.","2":"inside = ở bên trong (inside the box). Ở trong núi thì không nhìn thấy thị trấn. → at the top of."}},{"q":"When my grandparents were young, they ___ a car. They walked to work.","options":["didn't have","weren't have","don't have"],"answer":0,"unit":12,"level":3,"why":"Ngày xưa, không có ô tô (phải đi bộ) → phủ định của had là didn't have.","trap":{"1":"have là động từ (có) → phủ định quá khứ: didn't have. Không dùng weren't với have.","2":"Chuyện ngày xưa (when … were young) → didn't have."}},{"q":"The film was very funny, so my little sister ___ scared.","options":["didn't","weren't","wasn't"],"answer":2,"unit":12,"level":3,"why":"scared là tính từ → dùng be. Quá khứ, phủ định, một người → wasn't scared.","trap":{"0":"didn't đi với động từ (didn't eat). scared là tính từ → wasn't scared.","1":"my little sister là một người → wasn't, không dùng weren't."}},{"q":"Ellie ___ her homework last night, so she can play with her friends today.","options":["finishes","didn't finish","finished"],"answer":2,"unit":13,"level":2,"why":"last night → quá khứ. Hôm nay được đi chơi vì tối qua ĐÃ làm xong bài → finished.","trap":{"0":"finishes là hiện tại; có last night → finished.","1":"Nếu không làm xong bài thì hôm nay không được đi chơi. → finished."}}]},{"id":"C2","part":"C","type":"text","title":"Write the correct form of the word in brackets.","vi":"Viết dạng đúng của từ trong ngoặc (có thể cần viết thêm từ).","items":[{"q":"My grandparents ___ (not want) to go by plane, so they took the train.","accept":["didn't want"],"unit":13,"level":3,"why":"took (quá khứ của take) → chuyện đã qua. Phủ định quá khứ: didn't + động từ nguyên mẫu → didn't want.","trap":{"didn't wanted":"Sau didn't động từ giữ nguyên: didn't want.","don't want":"took là quá khứ → didn't want.","doesn't want":"took là quá khứ; my grandparents là số nhiều → didn't want.","weren't want":"Không dùng weren't với động từ want; phủ định quá khứ là didn't want.","not wanted":"Thiếu did: didn't want.","wanted":"Trong ngoặc có not → phủ định: didn't want."}},{"q":"Yesterday our cat ___ (climb) a tall tree in the garden, and it didn't want to come down!","accept":["climbed"],"unit":13,"level":2,"why":"Yesterday → quá khứ: climb + -ed = climbed.","trap":{"climbs":"Yesterday → quá khứ: climbed.","climb":"Yesterday → quá khứ: climbed.","climbbed":"climb chỉ thêm -ed: climbed (không gấp đôi b).","didn't climb":"Trong ngoặc không có not, và con mèo không muốn xuống → nó ĐÃ trèo lên: climbed."}},{"q":"My uncle hates ___ (shop) at the weekend.","accept":["shopping","to shop"],"unit":2,"level":3,"why":"hate + V-ing. shop → shopping (gấp đôi chữ p).","trap":{"shoping":"shop → shopping: gấp đôi chữ p.","shop":"Sau hate dùng V-ing: shopping.","shops":"Sau hate dùng V-ing: shopping."}},{"q":"\"___ (there / be) any boats on the river yesterday?\" \"Yes, there were. There were lots of small boats.\"","accept":["Were there","Were there any"],"unit":11,"level":3,"why":"yesterday → quá khứ; any boats (nhiều) → câu hỏi: Were there any boats …?","trap":{"Was there":"any boats là số nhiều → Were there.","There were":"Câu hỏi phải đưa Were lên TRƯỚC there: Were there …?","Are there":"yesterday → quá khứ: Were there.","Is there":"Quá khứ, số nhiều → Were there.","Did there be":"Với there + be ở quá khứ, câu hỏi là Were there …?","Were":"Thiếu there: Were there any taxis …?"}},{"q":"Grandpa ___ (watch) the birds in the garden every morning.","accept":["watches"],"unit":6,"level":2,"why":"every morning → hiện tại đơn. Grandpa = he → watch tận cùng bằng ch → thêm -es: watches.","trap":{"watchs":"watch tận cùng bằng ch → thêm -es: watches.","watch":"Grandpa = he → thêm -es: watches.","watched":"every morning là thói quen (hiện tại) → watches.","is watching":"every morning là thói quen → hiện tại đơn: watches."}},{"q":"My brother and I ___ (not be) cold at the beach yesterday. It was very sunny.","accept":["weren't"],"unit":12,"level":3,"why":"cold là tính từ → dùng be. yesterday → quá khứ; My brother and I = we → weren't.","trap":{"wasn't":"My brother and I là hai người (we) → weren't.","didn't be":"Phủ định của be ở quá khứ là wasn't/weren't, không dùng didn't be.","aren't":"yesterday → quá khứ: weren't.","didn't":"cold là tính từ → dùng be: weren't cold.","don't":"cold là tính từ, chuyện hôm qua → weren't."}},{"q":"Amy and I cooked dinner for Mum. ___ (we) fish pie was very good!","accept":["Our"],"unit":3,"level":2,"why":"Amy and I = we → của chúng tôi: our (đứng trước danh từ fish pie).","trap":{"we":"Trước danh từ dùng tính từ sở hữu: our fish pie.","us":"Trước danh từ dùng tính từ sở hữu: our.","their":"their = của họ. Amy and I = we → our.","my":"Amy and I là hai người (we) → our."}}]},{"id":"C3","part":"C","type":"text","pts":2,"title":"Read the answer. Write the question.","vi":"Đọc câu trả lời. Viết câu hỏi, bắt đầu bằng từ trong ngoặc.","example":"Lucy is nine. (How old …?) → \u003cb>How old is Lucy?\u003c/b>","items":[{"q":"Grandma was at the shopping mall yesterday. (Where …?)","accept":["Where was Grandma yesterday","Where was Grandma","Where was your grandma yesterday","Where was your grandma","Where was she yesterday","Where was she","Where did Grandma go yesterday","Where did your grandma go yesterday","Where did she go yesterday"],"unit":12,"level":3,"why":"Câu gốc có was (quá khứ của be) → Where + was + Grandma + yesterday?","trap":{"Where Grandma was yesterday":"Câu hỏi phải đưa was lên TRƯỚC Grandma: Where was Grandma yesterday?","Where is Grandma yesterday":"yesterday → quá khứ: was, không dùng is.","Where were Grandma yesterday":"Grandma là một người → was.","Where did Grandma yesterday":"Thiếu động từ. Với be: Where was Grandma yesterday?","Where does Grandma yesterday":"Câu gốc dùng was → Where was Grandma yesterday?","*":"Câu gốc dùng was → hỏi: Where was Grandma yesterday? (was đứng trước Grandma)."}},{"q":"Ben and Kate are reading comics in the garden. (What …?)","accept":["What are Ben and Kate reading in the garden","What are Ben and Kate reading","What are Ben and Kate doing in the garden","What are Ben and Kate doing","What are they reading in the garden","What are they reading","What are they doing in the garden","What are they doing"],"unit":5,"level":3,"why":"Đang xảy ra (are reading) → What + are + Ben and Kate + reading/doing?","trap":{"What do Ben and Kate reading":"Câu gốc là are reading → What are Ben and Kate reading?","What are Ben and Kate read":"Sau are … dùng V-ing: reading.","What Ben and Kate are reading":"Câu hỏi phải đưa are lên TRƯỚC Ben and Kate.","What is Ben and Kate reading":"Ben and Kate là hai người → are.","What do Ben and Kate read":"Câu gốc là are reading (đang đọc) → What are Ben and Kate reading?","*":"Câu gốc: are + V-ing → hỏi: What are Ben and Kate reading?"}},{"q":"Lucy has dinner at half past six. (What time …?)","accept":["What time does Lucy have dinner","What time does she have dinner","What time does Lucy have her dinner","What time does she have her dinner"],"unit":6,"level":3,"why":"Hiện tại đơn, Lucy = she → What time + does + Lucy + have (nguyên mẫu) + dinner? (has → have sau does)","trap":{"What time does Lucy has dinner":"Đã có does thì động từ giữ nguyên: have (không phải has).","What time Lucy has dinner":"Câu hỏi cần does: What time does Lucy have dinner?","What time is Lucy have dinner":"have là động từ thường → dùng does, không dùng is.","What time do Lucy have dinner":"Lucy = she → does.","What time is Lucy having dinner":"Câu gốc là thói quen (has dinner) → What time does Lucy have dinner?","What time does Lucy have dinner at half past six":"Không lặp lại câu trả lời (half past six) trong câu hỏi.","*":"Câu gốc: has (thói quen) → What time does Lucy have dinner?"}},{"q":"Uncle Jack sometimes goes to the theatre on Fridays. (Where …?)","accept":["Where does Uncle Jack sometimes go on Fridays","Where does Uncle Jack sometimes go","Where does Uncle Jack go on Fridays","Where does Uncle Jack go","Where does he sometimes go on Fridays","Where does he sometimes go","Where does he go on Fridays","Where does he go"],"unit":7,"level":3,"why":"Hiện tại đơn, Uncle Jack = he → Where + does + Uncle Jack + (sometimes) + go (nguyên mẫu) + on Fridays?","trap":{"Where does Uncle Jack sometimes goes on Fridays":"Đã có does thì động từ giữ nguyên: go.","Where does Uncle Jack goes on Fridays":"Đã có does thì động từ giữ nguyên: go.","Where Uncle Jack sometimes goes on Fridays":"Câu hỏi cần does: Where does Uncle Jack go on Fridays?","Where is Uncle Jack go on Fridays":"go là động từ thường → dùng does.","Where do Uncle Jack go on Fridays":"Uncle Jack = he → does.","Where does Uncle Jack go sometimes on Fridays":"sometimes đứng TRƯỚC động từ: does Uncle Jack sometimes go.","*":"Câu gốc: goes (thói quen) → Where does Uncle Jack go on Fridays?"}}]},{"id":"C4","part":"C","type":"order","pts":2,"title":"Put the words in order. Write the sentence.","vi":"Sắp xếp các từ/cụm từ thành câu đúng. Viết cả câu (không cần đổi dạng từ).","items":[{"words":["always","breakfast","my grandparents","in the garden","have"],"accept":["My grandparents always have breakfast in the garden","In the garden my grandparents always have breakfast","In the garden, my grandparents always have breakfast"],"unit":7,"level":2,"why":"Trạng từ tần suất (always) đứng TRƯỚC động từ: My grandparents always have breakfast …","trap":{"My grandparents have always breakfast in the garden":"always phải đứng TRƯỚC have.","Always my grandparents have breakfast in the garden":"always đứng ngay trước động từ: my grandparents always have.","My grandparents always have in the garden breakfast":"breakfast đi ngay sau have: have breakfast in the garden.","My grandparents have breakfast always in the garden":"always phải đứng TRƯỚC have."}},{"words":["like","gymnastics","your little brother","Does","doing","?"],"accept":["Does your little brother like doing gymnastics"],"unit":2,"level":3,"why":"Câu hỏi: Does + your little brother + like + V-ing (doing gymnastics)?","trap":{"Does your little brother doing like gymnastics":"Thứ tự: like doing gymnastics (thích tập thể dục dụng cụ).","Your little brother does like doing gymnastics":"Câu hỏi: Does đứng đầu câu.","Does like your little brother doing gymnastics":"Sau Does là người (your little brother), rồi mới đến like."}}]},{"id":"D1","part":"D","type":"tf","title":"Read Mia's story. Choose True or False.","vi":"Đọc bài của Mia. Chọn True (đúng) hoặc False (sai).","passageTitle":"My uncle in Thailand","passage":"Hi! I'm Mia. I live in London, in the UK, with my mum, my dad and my brother Jack. My mum's brother, Uncle Sam, lives in Thailand. He is a cook at a big hotel next to the sea.\n\nUncle Sam's day is very long. He gets up at half past five and gets dressed. He doesn't have breakfast at home. He has breakfast at work with his friends. He starts work at seven o'clock and finishes at six. Then he walks home. His flat is near the hotel.\n\nLast summer, my family stayed with Uncle Sam for two weeks. It was very hot, so Uncle Sam told us, \"You must wear a hat in the sun!\"\n\nEvery morning, Dad and Jack went sailing. Jack loves sailing, but I hate it. I was scared in the boat! So I stayed on the beach with Mum and Coco, Uncle Sam's dog. Coco is small, brown and very naughty. One afternoon, she ate Dad's sandwich! Dad wasn't angry. He laughed and laughed.\n\nOne day, we visited an old town on a river. There weren't any cars in the streets, and there wasn't a bus. People went by boat! There was a big market on the water, too. We got some fruit and two funny T-shirts there.\n\nOn our last day, Mum and I cooked dinner for Uncle Sam: fish, rice and cucumber. Jack didn't help. He watched TV! Uncle Sam was very happy. He ate it all.\n\nOn the plane home, I was very miserable. I wanted to stay in Thailand!\n\nNow Uncle Sam is cooking at the hotel, and I'm writing this story. When I'm big, I'd like to be a cook too!","items":[{"q":"Mia lives in Thailand.","answer":"False","unit":1,"level":1,"why":"\"I live in London, in the UK.\" Người sống ở Thailand là Uncle Sam."},{"q":"Uncle Sam has breakfast at work, not at home.","answer":"True","unit":6,"level":2,"why":"\"He doesn't have breakfast at home. He has breakfast at work with his friends.\""},{"q":"Mia loves sailing, like her brother.","answer":"False","unit":4,"level":3,"why":"\"Jack loves sailing, but I hate it.\" — chỉ Jack thích đi thuyền buồm; Mia ghét (hate)."},{"q":"In the old town, people didn't go by car.","answer":"True","unit":11,"level":3,"why":"\"There weren't any cars in the streets … People went by boat!\" — không có ô tô → người ta không đi ô tô."},{"q":"Dad was angry with Coco.","answer":"False","unit":5,"level":2,"why":"\"Dad wasn't angry. He laughed and laughed.\""}]},{"id":"D2","part":"D","type":"text","title":"Read Mia's story again. Complete the sentences with 1, 2 or 3 words from the story.","vi":"Câu hỏi viết KHÁC bài một chút. Tìm câu cùng ý trong bài, rồi chép 1–3 từ trong bài vào chỗ trống.","items":[{"q":"Uncle Sam gets up at ___.","accept":["half past five","5:30","5.30","five thirty","half past 5"],"unit":6,"level":1,"why":"\"He gets up at half past five…\"","trap":{"seven o'clock":"Bảy giờ là giờ Uncle Sam bắt đầu làm việc (starts work). Ông dậy lúc half past five.","six":"Sáu giờ là giờ ông tan làm (finishes). Ông dậy lúc half past five."}},{"q":"In the sun, the children must wear ___.","accept":["a hat","hats","a hat in the sun"],"unit":10,"level":1,"why":"Uncle Sam told us, \"You must wear a hat in the sun!\"","trap":{"T-shirts":"T-shirts là đồ mua ở chợ. Uncle Sam dặn: \"You must wear a hat in the sun!\""}},{"q":"In the old town, the big market was ___.","accept":["on the water"],"unit":11,"level":2,"why":"\"There was a big market on the water, too.\" (chợ nổi trên sông)","trap":{"on a river":"on a river là thị trấn cổ (an old town on a river). Chợ ở «on the water».","in the streets":"Bài nói \"There was a big market on the water\"."}},{"q":"Jack didn't help with the dinner. He ___.","accept":["watched TV","watched television"],"unit":13,"level":2,"why":"\"Jack didn't help. He watched TV!\"","trap":{"watch TV":"Chuyện đã qua → chép đúng từ trong bài: watched TV.","went sailing":"Jack đi thuyền buồm vào các buổi sáng. Lúc mẹ và Mia nấu bữa tối, Jack watched TV."}},{"q":"At the market, Mia's family bought some fruit and ___.","accept":["two funny T-shirts","funny T-shirts","two T-shirts","T-shirts","two funny T shirts","funny T shirts","two T shirts","T shirts","two funny tshirts","two tshirts","tshirts"],"unit":8,"level":3,"why":"\"We got some fruit and two funny T-shirts there.\" — got = bought (mua).","trap":{"a hat":"Mũ là thứ Uncle Sam dặn phải đội. Ở chợ, cả nhà mua (got) two funny T-shirts.","fish":"Cá là món Mia và mẹ nấu ngày cuối. Ở chợ: fruit and two funny T-shirts."}}]},{"id":"D3","part":"D","type":"kw","title":"Answer the questions about Mia's story.","vi":"Trả lời câu hỏi — viết ngắn (vài từ) cũng được, không cần cả câu.","items":[{"q":"Coco ate something. What was it?","kw":[["sandwich"]],"model":"Dad's sandwich.","unit":8,"level":1,"why":"\"One afternoon, she ate Dad's sandwich!\"","trap":{"fish":"Cá là món Mia nấu cho Uncle Sam. Coco ăn bánh sandwich của bố."}},{"q":"How does Uncle Sam go home after work?","kw":[["walk","walks","walking","on foot"]],"model":"He walks home.","unit":6,"level":2,"why":"\"Then he walks home. His flat is near the hotel.\"","trap":{"By bus.":"Bài nói \"he walks home\" (đi bộ về nhà).","By boat.":"Đi thuyền là người dân ở thị trấn cổ. Uncle Sam đi bộ về nhà."}},{"q":"Mia didn't go sailing with Dad and Jack. Why?","kw":[["hate","hates","hated","scared","not like","afraid"]],"model":"Because she hates sailing. She was scared in the boat.","unit":2,"level":3,"why":"\"Jack loves sailing, but I hate it. I was scared in the boat!\"","trap":{"Because she likes the beach.":"Bài không nói vậy. Lý do: Mia ghét đi thuyền buồm (I hate it) và sợ (scared)."}},{"q":"How was Mia on the plane home? Why?","kw":[["miserable","sad","not happy","unhappy"],["stay","thailand","not want to go home"]],"model":"She was very miserable because she wanted to stay in Thailand.","unit":12,"level":3,"why":"\"On the plane home, I was very miserable. I wanted to stay in Thailand!\" — cần nói cả hai ý: buồn (miserable) và vì sao (muốn ở lại Thailand).","trap":{"She was happy.":"Mia rất buồn (very miserable), vì muốn ở lại Thailand."}},{"q":"What would Mia like to be when she is big?","kw":[["cook"]],"model":"She'd like to be a cook.","unit":8,"level":2,"why":"\"When I'm big, I'd like to be a cook too!\"","trap":{"A teacher.":"Bài nói \"I'd like to be a cook too!\" (đầu bếp, giống Uncle Sam)."}}]},{"id":"E1","part":"E","type":"text","title":"Find the mistake. Write the sentence correctl const LS = DATA.storageKey;

// ---- grading helpers (same rules as Revision 1–9: case-insensitive, contractions = full forms)
function norm(s) {
  s = String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); // café = cafe
  s = s.replace(/[’‘`´ʼ′]/g, "'").replace(/[“”«»]/g, '"').replace(/[–—‐‑]/g, '-');
  s = s.replace(/[.,!?;:"()]/g, ' ').replace(/\s*-\s*/g, '-').replace(/\s+/g, ' ').trim();
  s = s.replace(/(^|[^a-z0-9])'+|'+(?=[^a-z]|$)/g, '$1 ').replace(/\s+/g, ' ').trim(); // quotes around a word: 'gets' → gets
  // "'s got" is always "has got" (never "is got"), for pronouns AND names: Tim's got = Tim has got; "Tim is got" stays wrong.
  // iPad without apostrophe: "Tims got" / "shes got" = "… has got" (except words that end in s by themselves: has, is, this, his…)
  s = s.replace(/\b([a-z]+)'s got\b/g, '$1 has got')
       .replace(/\b([a-z]+)s got\b/g, (m, w) => /s$|^(ha|i|wa|thi|hi|u|ye|doe|goe|her|our|your|their|thu|plu|ga|bu)$/.test(w) ? m : w + ' has got');
  s = s.replace(/\bi'm\b/g, 'i am').replace(/\b([a-z]+)'re\b/g, '$1 are')
       .replace(/\b(it|he|she|that|this|there|here|what|who|where|how)'s\b/g, '$1 is')
       .replace(/\bisn't\b/g, 'is not').replace(/\baren't\b/g, 'are not')
       .replace(/\bdon't\b/g, 'do not').replace(/\bdoesn't\b/g, 'does not')
       .replace(/\bcan't\b/g, 'cannot').replace(/\bcan not\b/g, 'cannot')
       .replace(/\bhaven't\b/g, 'have not').replace(/\bhasn't\b/g, 'has not')
       .replace(/\b([a-z]+)'ve\b/g, '$1 have').replace(/\b([a-z]+)'ll\b/g, '$1 will')
       // 'd is ambiguous (he'd = he had / he would): expand only in "'d like/love/prefer", leave other 'd untouched
       .replace(/\b(i|you|we|they|he|she)'d (like|love|prefer)\b/g, '$1 would $2')
       .replace(/\b(i|you|we|they)d (like|love|prefer)\b/g, '$1 would $2') // iPad: "Id like"
       .replace(/\bdidn't\b/g, 'did not').replace(/\bwasn't\b/g, 'was not').replace(/\bweren't\b/g, 'were not')
       .replace(/\bmustn't\b/g, 'must not').replace(/\bwon't\b/g, 'will not');
  s = s.replace(/\bim\b/g, 'i am').replace(/\bdont\b/g, 'do not').replace(/\bdoesnt\b/g, 'does not')
       .replace(/\bisnt\b/g, 'is not').replace(/\barent\b/g, 'are not').replace(/\bcant\b/g, 'cannot')
       .replace(/\bhavent\b/g, 'have not').replace(/\bhasnt\b/g, 'has not').replace(/\bdidnt\b/g, 'did not')
       .replace(/\bwasnt\b/g, 'was not').replace(/\bwerent\b/g, 'were not').replace(/\bmustnt\b/g, 'must not')
       .replace(/\btheyre\b/g, 'they are').replace(/\byoure\b/g, 'you are')
       .replace(/\bthats\b/g, 'that is').replace(/\btheres\b/g, 'there is').replace(/\bwhats\b/g, 'what is')
       .replace(/\bhes\b/g, 'he is').replace(/\bshes\b/g, 'she is')
       .replace(/\b(i|we|you|they)ve\b/g, '$1 have').replace(/\bwouldnt\b/g, 'would not').replace(/\bcouldnt\b/g, 'could not');
  return s.replace(/\s+/g, ' ').trim();
}
// trap feedback: keys in data.json may be written with contractions/capitals/punctuation → compare normalised
function trapFor(trap, v) {
  if (!trap) return null; const n = norm(v);
  for (const k of Object.keys(trap)) if (k !== '*' && norm(k) === n) return trap[k];
  return null;
}
const matches = (u, acc) => { const n = norm(u); return !!n && acc.some(a => norm(a) === n); };
// kw: every group needs one alternative present as whole words
const kwOk = (u, groups) => { const s = ' ' + norm(u) + ' '; return norm(u) !== '' && groups.every(g => g.some(a => s.includes(' ' + norm(a) + ' '))); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---- state
let store = { attempts: [], draft: null };
const isObj = o => !!o && typeof o === 'object' && !Array.isArray(o);
try {
  const v = JSON.parse(localStorage.getItem(LS) || 'null');
  if (isObj(v) && Array.isArray(v.attempts)) store = {
    // drop anything malformed (old versions / hand-edited / corrupted values) instead of crashing
    attempts: v.attempts.filter(a => isObj(a) && typeof a.score === 'number' && !isNaN(new Date(a.date))),
    draft: isObj(v.draft) ? v.draft : null };
} catch (e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} };
let answers = (store.draft && isObj(store.draft.answers)) ? store.draft.answers : {};
let graded = null; let confirmOpen = false;
let speak = (store.draft && isObj(store.draft.speak)) ? store.draft.speak : {};

const items = []; DATA.exercises.forEach(ex => ex.items.forEach((it, i) => items.push({ ex, it, key: ex.id + '.' + (i + 1) })));
const TOTAL = items.reduce((s, x) => s + (x.it.pts || x.ex.pts || 1), 0);

function render() {
  const app = document.getElementById('app');
  let h = `<h1>${esc(DATA.title)}</h1><p class="muted">${esc(DATA.subtitle)}</p>`;
  h += `<div class="card small">${DATA.instructions.map(esc).join('<br>')}</div>`;
  if (graded) h += resultHtml();
  let part = null, exNo = 0;
  for (const ex of DATA.exercises) {
    if (ex.part !== part) { part = ex.part; h += `<h2 class="part">${esc(DATA.parts[part])}</h2>`; }
    exNo++;
    const exPts = ex.items.reduce((s, it) => s + (it.pts || ex.pts || 1), 0);
    const got = graded ? ex.items.reduce((s, it, i) => s + (graded.res[ex.id + '.' + (i + 1)].pts), 0) : null;
    h += `<section class="card" id="ex-${ex.id}"><div class="exh"><span class="num">${exNo}</span><div class="ttl"><b>${esc(ex.title)}</b><span class="vi">${esc(ex.vi || '')}</span></div><span class="pts ${graded ? 'done' : ''}">${graded ? got + ' / ' : ''}${exPts} điểm</span></div>`;
    if (ex.audio) h += `<div class="audio"><audio controls preload="none" src="${esc(ex.audio)}"></audio><span class="small muted">Nghe 2 lần.</span></div>`;
    if (ex.passage) h += `<div class="passage">${ex.passageTitle ? `<h4>${esc(ex.passageTitle)}</h4>` : ''}${esc(ex.passage)}</div>`;
    if (ex.bank) h += `<div class="bank">${ex.bank.map(w => `<span>${esc(w)}</span>`).join('')}</div>`;
    if (ex.example) h += `<p class="eg">Ví dụ: ${ex.example}</p>`;
    ex.items.forEach((it, i) => { h += itemHtml(ex, it, ex.id + '.' + (i + 1), i + 1); });
    h += `</section>`;
  }
  h += speakingHtml();
  if (store.attempts.length) h += historyHtml();
  app.innerHTML = h;
  bindInputs(); renderBar();
}

function itemHtml(ex, it, key, n) {
  const v = answers[key]; const r = graded && graded.res[key];
  const type = it.type || ex.type;
  let body = it.q ? `<div class="q">${fmtQ(it.q, key, type, v, r, ex, it)}</div>` : '';
  if (type === 'mcq' || type === 'tf') {
    const opts = type === 'tf' ? ['True', 'False'] : (it.options || ex.options);
    body += `<div class="opts" role="radiogroup">` + opts.map((o, k) => {
      let cls = ''; if (graded) { if (k === answerIndex(ex, it)) cls = 'ok'; else if (v === k) cls = 'bad'; }
      return `<label class="opt ${cls}"><input type="radio" name="${key}" value="${k}" ${v === k ? 'checked' : ''} ${graded ? 'disabled' : ''}><span>${esc(o)}</span></label>`;
    }).join('') + `</div>`;
  } else if (type === 'select') {
    if (!/___/.test(it.q || '')) body += selectHtml(ex, key, v, r);
  } else if (type === 'order') {
    body = `<div class="words">${it.words.map(w => `<span>${esc(w)}</span>`).join('')}</div>` + `<input class="in-t ${r ? (r.ok ? 'ok' : 'bad') : ''}" data-k="${key}" value="${esc(v || '')}" ${graded ? 'readonly' : ''} autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Viết câu hoàn chỉnh…">`;
  } else if ((type === 'text' || type === 'kw') && !/___/.test(it.q || '')) {
    body += `<input class="in-t ${r ? (r.ok ? 'ok' : 'bad') : ''}" data-k="${key}" value="${esc(v || '')}" ${graded ? 'readonly' : ''} autocomplete="off" autocapitalize="off" spellcheck="false">`;
  }
  if (r && !r.ok) body += fbHtml(ex, it, v);
  return `<div class="item"><span class="n">${n}.</span><div>${body}</div></div>`;
}
function selectHtml(ex, key, v, r) {
  const opts = ex.options;
  return `<select class="in-t ${r ? (r.ok ? 'ok' : 'bad') : ''}" data-k="${key}" ${graded ? 'disabled' : ''}><option value="">— chọn —</option>${opts.map(o => `<option ${v === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
}
function fmtQ(q, key, type, v, r, ex, it) {
  const parts = esc(q).split('___');
  if (parts.length === 1) return parts[0];
  // mcq/tf: the gap is NOT an input (answer = the radio); it shows the chosen option
  if (type === 'mcq' || type === 'tf') {
    const opts = type === 'tf' ? ['True', 'False'] : (it.options || ex.options);
    return parts[0] + `<span class="blank" data-b="${key}">${typeof v === 'number' && opts[v] != null ? esc(opts[v]) : '&nbsp;'}</span>` + parts.slice(1).join('___');
  }
  const field = type === 'select' ? selectHtml(ex, key, v, r)
    : `<input class="in-t gap ${r ? (r.ok ? 'ok' : 'bad') : ''}" data-k="${key}" value="${esc(v || '')}" ${graded ? 'readonly' : ''} autocomplete="off" autocapitalize="off" spellcheck="false">`;
  return parts[0] + field + parts.slice(1).join('___');
}
function answerIndex(ex, it) { return typeof it.answer === 'number' ? it.answer : (it.answer === 'True' ? 0 : it.answer === 'False' ? 1 : -1); }
function modelAnswer(ex, it) {
  const type = it.type || ex.type;
  if (type === 'mcq') return (it.options || ex.options)[it.answer];
  if (type === 'tf') return it.answer;
  if (type === 'select') return it.answer;
  if (type === 'kw') return it.model;
  return it.accept[0];
}
function fbHtml(ex, it, v) {
  const type = it.type || ex.type;
  let wrongWhy = '';
  if (it.trap && v != null && v !== '') {
    // mcq/tf: key = option index ("0","1"…; tf also accepts "True"/"False"); text/select/kw: key = typed text (normalised)
    const t = (type === 'mcq' || type === 'tf') ? (it.trap[String(v)] || (type === 'tf' && it.trap[['True', 'False'][v]]) || it.trap['*'])
      : trapFor(it.trap, v) || it.trap['*'];
    if (t) wrongWhy = `<br><span class="x">Vì sao sai:</span> ${esc(t)}`;
  }
  return `<div class="fb">Đáp án: <span class="a">${esc(modelAnswer(ex, it))}</span>${it.why ? `<br>${esc(it.why)}` : ''}${wrongWhy}</div>`;
}

function speakingHtml() {
  const s = DATA.speaking; if (!s) return '';
  let h = `<h2 class="part">${esc(s.title)}</h2><div class="card"><p class="small muted">${esc(s.note)}</p><ol class="speak">${s.prompts.map(p => `<li>${esc(p)}</li>`).join('')}</ol>`;
  h += `<p class="small"><b>Phụ huynh chấm (0–${s.max}):</b></p><div class="rub" role="radiogroup" aria-label="Điểm Speaking">`;
  for (let k = 0; k <= s.max; k++) h += `<label class="opt"><input type="radio" name="speak" value="${k}" ${speak.score === k ? 'checked' : ''}><span>${k}</span></label>`;
  h += `</div><p class="small muted">${s.rubric.map(esc).join('<br>')}</p></div>`;
  return h;
}

function bindInputs() {
  // accessible names: "Bài 3, câu 2" for every input / select / radiogroup
  document.querySelectorAll('section[id^="ex-"]').forEach(sec => {
    const exn = sec.querySelector('.num').textContent;
    sec.querySelectorAll('.item').forEach(row => {
      const lab = `Bài ${exn}, câu ${row.querySelector('.n').textContent.replace('.', '')}`;
      row.querySelectorAll('[data-k], [role=radiogroup]').forEach(el => el.setAttribute('aria-label', lab));
    });
  });
  document.querySelectorAll('[data-k]').forEach(el => {
    const on = () => { answers[el.dataset.k] = el.value; draft(); renderBar(); };
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', on);
  });
  document.querySelectorAll('input[type=radio]').forEach(el => el.addEventListener('change', () => {
    if (el.name === 'speak') { speak.score = +el.value; draft(); if (graded) { graded.speaking = speak.score; persistSpeak(); } return; }
    answers[el.name] = +el.value; draft(); renderBar();
    const b = document.querySelector(`.blank[data-b="${CSS.escape(el.name)}"]`); if (b) b.textContent = el.nextElementSibling.textContent;
  }));
}
function draft() { if (!graded) { store.draft = { answers, speak }; save(); } else save(); }
function persistSpeak() { const a = store.attempts[store.attempts.length - 1]; if (a && a.id === graded.id) { a.speaking = speak.score; save(); } }
function answeredCount() { return items.filter(x => answers[x.key] !== undefined && answers[x.key] !== '').length; }

// keep the last content clear of the fixed bottom bar (bar grows to 2–3 lines on phones in the confirm state)
function fitBar() { document.getElementById('app').style.paddingBottom = (document.getElementById('bar').offsetHeight + 28) + 'px'; }
addEventListener('resize', fitBar);
function renderBar() { renderBarInner(); fitBar(); }
function renderBarInner() {
  const prog = document.getElementById('prog'), btns = document.getElementById('barBtns');
  if (graded) {
    prog.innerHTML = `Điểm: <b>${graded.score} / ${TOTAL}</b>`;
    btns.innerHTML = `<button class="btn" id="bTop">Xem kết quả</button> <button class="btn primary" id="bNew">Làm lại từ đầu</button>`;
    document.getElementById('bTop').onclick = () => document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
    document.getElementById('bNew').onclick = () => { if (confirm('Xoá bài đang xem và làm lại từ đầu?')) { answers = {}; speak = {}; graded = null; store.draft = null; save(); render(); scrollTo(0, 0); } };
    return;
  }
  const n = answeredCount();
  prog.innerHTML = `Đã làm <b>${n}</b> / ${items.length} câu`;
  if (confirmOpen) {
    btns.innerHTML = `<span class="confirm">Còn ${items.length - n} câu chưa làm. Vẫn nộp bài? <button class="btn" id="bNo">Làm tiếp</button> <button class="btn primary" id="bYes">Nộp</button></span>`;
    document.getElementById('bNo').onclick = () => { confirmOpen = false; renderBar(); };
    document.getElementById('bYes').onclick = () => { confirmOpen = false; grade(); };
  } else {
    btns.innerHTML = `<button class="btn primary" id="bGrade">Nộp bài</button>`;
    document.getElementById('bGrade').onclick = () => { if (answeredCount() < items.length) { confirmOpen = true; renderBar(); } else grade(); };
  }
}

function grade() {
  const res = {}; let score = 0;
  for (const { ex, it, key } of items) {
    const type = it.type || ex.type, v = answers[key], pts = it.pts || ex.pts || 1;
    let ok = false;
    if (type === 'mcq' || type === 'tf') ok = v === answerIndex(ex, it);
    else if (type === 'select') ok = v === it.answer;
    else if (type === 'kw') ok = kwOk(v, it.kw);
    else ok = matches(v, it.accept);
    res[key] = { ok, pts: ok ? pts : 0, max: pts };
    score += res[key].pts;
  }
  graded = { id: Date.now(), date: new Date().toISOString(), score, res, speaking: speak.score };
  store.attempts.push({ id: graded.id, date: graded.date, score, total: TOTAL, speaking: speak.score ?? null,
    answers: { ...answers }, wrong: items.filter(x => !res[x.key].ok).map(x => x.key),
    byPart: breakdown('part'), byUnit: breakdown('unit'), byLevel: breakdown('level') });
  store.draft = null; save();
  render(); document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
}
function breakdown(dim) {
  const m = {};
  for (const { ex, it, key } of items) {
    const k = dim === 'part' ? ex.part : dim === 'unit' ? String(it.unit ?? ex.unit) : String(it.level || 2);
    m[k] = m[k] || { got: 0, max: 0 }; m[k].max += graded.res[key].max; m[k].got += graded.res[key].pts;
  }
  return m;
}
function band(p) { return DATA.bands.find(b => p >= b.min); }
function barCell(got, max) { const p = max ? got / max : 0; return `<div class="pbar"><i class="${p < .5 ? 'low' : p < .75 ? 'mid' : ''}" style="width:${Math.round(p * 100)}%"></i></div>`; }
function resultHtml() {
  const pct = Math.round(graded.score * 100 / TOTAL), b = band(pct);
  const bp = breakdown('part'), bu = breakdown('unit');
  let h = `<section class="card" id="result" style="border:2px solid var(--accent)"><div class="score"><span class="big">${graded.score}</span><span class="muted">/ ${TOTAL} điểm</span><span class="band">${esc(b.label)}</span></div><p>${esc(b.advice)}</p>`;
  h += `<h3>Theo kỹ năng</h3><table class="t"><tr><th>Phần</th><th class="r">Điểm</th><th style="width:40%"></th></tr>` +
    Object.keys(DATA.parts).filter(k => bp[k]).map(k => `<tr><td>${esc(DATA.parts[k])}</td><td class="r">${bp[k].got} / ${bp[k].max}</td><td>${barCell(bp[k].got, bp[k].max)}</td></tr>`).join('') + `</table>`;
  const unitKeys = Object.keys(bu).sort((a, b) => (+a || 0) - (+b || 0));
  h += `<h3>Theo unit</h3><table class="t"><tr><th>Unit</th><th class="r">Điểm</th><th style="width:40%"></th></tr>` +
    unitKeys.map(k => `<tr><td>${k === 'mix' ? 'Tổng hợp' : /^[0-9]+$/.test(k) ? 'Unit ' + esc(k) : esc(k)} <span class="small muted">${esc(DATA.unitTitles[k] || '')}</span></td><td class="r">${bu[k].got} / ${bu[k].max}</td><td>${barCell(bu[k].got, bu[k].max)}</td></tr>`).join('') + `</table>`;
  const weak = unitKeys.filter(k => bu[k].max >= 3 && bu[k].got / bu[k].max < .6);
  if (weak.length) h += `<p><b>Cần ôn lại:</b> ${weak.map(k => (k === 'mix' ? 'phần tổng hợp' : (/^[0-9]+$/.test(k) ? 'Unit ' : '') + k + ' (' + (DATA.unitTitles[k] || '') + ')')).map(esc).join(', ')}.</p>`;
  h += `<p class="small muted">Các câu sai được tô đỏ bên dưới, kèm đáp án và giải thích.</p></section>`;
  return h;
}
function historyHtml() {
  return `<h2 class="part">Các lần làm trước</h2><div class="card"><ul class="hist">${store.attempts.slice().reverse().map(a => `<li>${new Date(a.date).toLocaleString('vi-VN')}: <b>${a.score} / ${a.total}</b>${a.speaking != null ? ` · Speaking ${a.speaking}/${DATA.speaking.max}` : ''}</li>`).join('')}</ul>
  <button class="btn" id="bExport">Tải kết quả (JSON)</button></div>`;
}
document.addEventListener('click', e => {
  if (e.target.id === 'bExport') {
    const blob = new Blob([JSON.stringify(store.attempts, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = DATA.exportName; a.click();
  }
});
render();
</script>
</body>
</html>
