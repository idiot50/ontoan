<!doctype html>
<html lang="vi">
<head>

<title>Kiểm tra FaF3 Units 1–12</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E📝%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root {
  --bg: #f4f6f3; --surface: #fff; --fg: #1d2924; --muted: #5d6c65; --line: #d7ded8; --line2: #b9c4bd;
  --accent: #1f6f5c; --accent-ink: #fff; --accent-soft: #e2f1ea;
  --ok: #2c7a39; --ok-soft: #e4f4e6; --bad: #b9312f; --bad-soft: #fbe7e5; --warn: #9a5b00; --warn-soft: #fff1d6;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131916; --surface: #1b2420; --fg: #e5ebe6; --muted: #9db0a5; --line: #2c3a33; --line2: #41534a;
  --accent: #6fcfb0; --accent-ink: #0f1f19; --accent-soft: #1d3a31;
  --ok: #7bd389; --ok-soft: #1e3525; --bad: #ff8f85; --bad-soft: #3d2321; --warn: #ffc46b; --warn-soft: #3a2c14; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #131916; --surface: #1b2420; --fg: #e5ebe6; --muted: #9db0a5; --line: #2c3a33; --line2: #41534a;
  --accent: #6fcfb0; --accent-ink: #0f1f19; --accent-soft: #1d3a31;
  --ok: #7bd389; --ok-soft: #1e3525; --bad: #ff8f85; --bad-soft: #3d2321; --warn: #ffc46b; --warn-soft: #3a2c14; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: "Nunito", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
[hidden] { display: none !important; }
button, input, select { font: inherit; }
.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .in { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { white-space: nowrap; }
.back { margin-left: auto; font-size: .88rem; font-weight: 700; color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; }
.wrap { max-width: 860px; margin: 0 auto; padding: 16px 16px 120px; }
h1 { font-size: 1.45rem; margin: 6px 0 4px; line-height: 1.25; }
h2.part { font-size: 1.15rem; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--accent); }
.muted { color: var(--muted); } .small { font-size: .88rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
.btn { border: 1px solid var(--line2); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:focus-visible, .in-t:focus-visible, select:focus-visible, .opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.exh { display: flex; gap: 10px; align-items: flex-start; }
.num { flex: 0 0 auto; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 15px; background: var(--accent); color: var(--accent-ink); font-weight: 800; display: flex; align-items: center; justify-content: center; }
.ttl { flex: 1; min-width: 0; } .ttl b { font-size: 1.02rem; } .ttl .vi { display: block; color: var(--muted); font-size: .9rem; }
.pts { flex: 0 0 auto; font-size: .8rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.pts.done { color: var(--fg); font-weight: 800; }
.audio { margin: 10px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.audio audio { width: 100%; max-width: 420px; }
.bank { display: flex; flex-wrap: wrap; gap: 6px 14px; background: var(--accent-soft); padding: 8px 12px; border-radius: 10px; margin: 10px 0; font-weight: 700; }
.eg { margin: 8px 0 2px; color: var(--muted); font-size: .95rem; }
.eg b { color: var(--accent); }
.passage { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 10px 0; white-space: pre-line; line-height: 1.7; }
.passage h4 { margin: 0 0 4px; }
.item { display: grid; grid-template-columns: 1.8em minmax(0, 1fr); gap: 4px 6px; padding: 10px 0; border-top: 1px dashed var(--line); }
.item .n { font-weight: 800; color: var(--muted); padding-top: 2px; }
.q { margin-bottom: 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.opt { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line2); border-radius: 10px; padding: 6px 12px; cursor: pointer; background: var(--surface); }
.opt input { accent-color: var(--accent); margin: 0; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); } .opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.in-t { padding: 8px 10px; border: 1.5px solid var(--line2); border-radius: 8px; background: var(--surface); color: var(--fg); width: 100%; font-size: 1rem; }
.in-t.gap { width: 9em; display: inline-block; padding: 4px 8px; margin: 2px; }
select.in-t { width: auto; max-width: 100%; }
.in-t.ok { border-color: var(--ok); background: var(--ok-soft); } .in-t.bad { border-color: var(--bad); background: var(--bad-soft); }
.words { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--line2); padding: 0 4px; margin: 0 2px; font-weight: 700; color: var(--accent); text-align: center; }
.words span { border: 1px dashed var(--line2); border-radius: 6px; padding: 2px 8px; font-weight: 700; }
.fb { font-size: .9rem; color: var(--muted); margin-top: 6px; border-left: 3px solid var(--line2); padding-left: 8px; }
.fb .a { color: var(--ok); font-weight: 800; } .fb .x { color: var(--bad); font-weight: 800; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.bar .in { max-width: 860px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.confirm { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 10px; padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score .big { font-size: 2.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.band { font-weight: 800; font-size: 1.1rem; }
table.t { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: .93rem; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; }
table.t td.r, table.t th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pbar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; min-width: 60px; }
.pbar i { display: block; height: 100%; background: var(--accent); }
.pbar i.low { background: var(--bad); } .pbar i.mid { background: var(--warn); }
.speak li { margin: 4px 0; }
.rub { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
.hist li { margin: 3px 0; }
@media (max-width: 480px) { .in-t.gap { width: 7.5em; } .brand { font-size: .9rem; } .back { font-size: .8rem; padding: 3px 9px; } .top .in { padding: 8px 12px; gap: 6px; } }
</style>
</head>

<script>
const DATA = {"pageTitle":"Kiểm tra FaF3 Units 1–12","brand":"Family and Friends 3 · Units 1–12","storageKey":"faf3-test-u1-12-v1","exportName":"ket-qua-faf3-u1-12.json","audioDir":"faf3","outFile":"faf3-kiem-tra-u1-12.html","title":"Bài kiểm tra Family and Friends 3 · Units 1–12","subtitle":"Listening · Vocabulary & Phonics · Grammar · Reading · Writing — 100 điểm, khoảng 60 phút","instructions":["Làm lần lượt từ trên xuống. Phần nghe: bấm ▶ để nghe, mỗi bài nghe 2 lần.","Bài viết: chữ hoa hay chữ thường đều được; viết tắt (doesn't) hay viết đầy đủ (does not) đều được.","Làm xong bấm «Nộp bài» ở dưới cùng. Bài đang làm được tự lưu trên máy này."],"parts":{"A":"Part A · Listening (25 điểm)","B":"Part B · Vocabulary & Phonics (20 điểm)","C":"Part C · Grammar (28 điểm)","D":"Part D · Reading (15 điểm)","E":"Part E · Writing (12 điểm)"},"unitTitles":{"1":"They're from Australia!","2":"My weekend","3":"My things","4":"We're having fun at the beach!","5":"A naughty monkey!","6":"Jim's day","7":"Places to go!","8":"I'd like a melon!","9":"What's the fastest animal in the world?","10":"In the park!","11":"In the museum","12":"A clever baby!"},"bands":[{"min":85,"label":"Giỏi","advice":"Nắm vững kiến thức Units 1–12. Có thể học tiếp Units 13–15."},{"min":70,"label":"Khá","advice":"Nắm được phần lớn kiến thức. Ôn lại các unit có thanh màu cam/đỏ trước khi học tiếp."},{"min":50,"label":"Trung bình","advice":"Còn hổng một số mảng. Ôn lại từng unit yếu (bảng dưới), làm lại bài sau 1 tuần."},{"min":0,"label":"Cần ôn lại","advice":"Cần ôn lại từ vựng và ngữ pháp cơ bản theo từng unit trước khi học tiếp."}],"audioSources":{"t130.mp3":"../../faf/audio/Family and Friends 3 Class CD3/Track 43.mp3","t137.mp3":"../../faf/audio/Family and Friends 3 Class CD3/Track 50.mp3","t139.mp3":"../../faf/audio/Family and Friends 3 Class CD3/Track 52.mp3","t140.mp3":"../../faf/audio/Family and Friends 3 Class CD3/Track 53.mp3"},"exercises":[{"id":"A1","part":"A","type":"mcq","audio":"audio/faf3/t130.mp3","title":"Listen and choose the correct answer.","vi":"Nghe bạn Jane nói về mình. Chọn câu trả lời đúng.","items":[{"q":"How old is Jane?","options":["ten","eleven","twelve"],"answer":1,"unit":1,"level":1,"why":"Jane nói: \"I'm 11.\""},{"q":"Where is Jane from?","options":["the UK","the USA","Australia"],"answer":1,"unit":1,"level":1,"why":"Jane nói: \"I'm from the USA.\""},{"q":"What is Jane's favourite season?","options":["spring","summer","winter"],"answer":1,"unit":1,"level":1,"why":"\"Summer, because I love the sun.\""},{"q":"Jane is in the school ___ team.","options":["basketball","volleyball","football"],"answer":1,"unit":2,"level":2,"why":"\"Yes, I like playing volleyball. I'm in the school team.\""},{"q":"Does Jane like playing the piano?","options":["Yes, she does.","No, she doesn't.","She can't play it."],"answer":1,"unit":2,"level":3,"why":"\"Can you play the piano? Yes, I can. But I don't like it.\" — biết chơi nhưng KHÔNG thích.","trap":{"0":"Jane có nói \"Yes, I can\" — đó là trả lời cho câu «có chơi được không», chưa phải «có thích không». Ngay sau đó Jane nói \"But I don't like it\".","2":"Jane chơi được piano (\"Yes, I can\"), chỉ là không thích. Câu này đúng khi bạn ấy nói \"No, I can't\"."}}]},{"id":"A2","part":"A","type":"select","audio":"audio/faf3/t137.mp3","title":"Listen. What does she do every week? Choose.","vi":"Nghe một người mẹ kể lịch trong tuần. Chọn việc cô ấy làm vào mỗi ngày (có 2 phương án thừa).","options":["go to the supermarket and the shopping mall","take a book back to the library","play tennis at the sports centre","meet a friend in a café","go to the cinema","take the children to the swimming pool","have a picnic in the park","go to the museum","go to the theatre"],"items":[{"q":"Monday","answer":"go to the supermarket and the shopping mall","unit":7,"level":1,"why":"\"Every Monday, I do all the shopping … I go to the supermarket and the shopping mall.\""},{"q":"Tuesday","answer":"take a book back to the library","unit":7,"level":2,"why":"\"On Tuesdays, I usually take my book back to the library.\""},{"q":"Wednesday","answer":"play tennis at the sports centre","unit":7,"level":2,"why":"\"On Wednesday afternoons, I play tennis with my friend Maxine at the Sports Centre.\""},{"q":"Thursday","answer":"meet a friend in a café","unit":7,"level":3,"why":"\"On Thursdays, I do lots of housework and I meet my friend Maxine in a café.\" Maxine xuất hiện 2 lần: thứ Tư chơi tennis, thứ Năm gặp ở café."},{"q":"Friday","answer":"go to the cinema","unit":7,"level":2,"why":"\"On Fridays … I often go to the cinema.\""},{"q":"Saturday","answer":"take the children to the swimming pool","unit":7,"level":2,"why":"\"Every Saturday I take them to the swimming pool.\""},{"q":"Sunday (if it's nice weather)","answer":"have a picnic in the park","unit":7,"level":2,"why":"\"If it's nice weather on Sunday, we have a picnic in the park.\""}]},{"id":"A3","part":"A","type":"tf","audio":"audio/faf3/t139.mp3","title":"Listen and choose True or False.","vi":"Nghe kể về một buổi ở quán café. Chọn True (đúng) hoặc False (sai).","items":[{"q":"It was a hot day.","answer":"True","unit":12,"level":1,"why":"\"It was a hot day.\""},{"q":"The first drink was an orange juice.","answer":"False","unit":8,"level":2,"why":"Đầu tiên là \"a coffee and an ice cream\"; nước cam là lần sau, khi khát lại (\"This time, I had an orange juice\")."},{"q":"There were photos on the walls of the café.","answer":"True","unit":11,"level":1,"why":"\"On the walls of the café, there were photos of the café owner … and his family.\""},{"q":"Demetri had a small family.","answer":"False","unit":12,"level":2,"why":"\"He had a big family, so there were lots of photos.\""},{"q":"Forty years ago, Demetri had black hair.","answer":"True","unit":12,"level":3,"why":"\"Some of them were from forty years ago, when Demetri was young. He had black hair then.\""}]},{"id":"A4","part":"A","type":"text","audio":"audio/faf3/t140.mp3","title":"Listen and write the missing words.","vi":"Nghe và viết từ còn thiếu vào mỗi chỗ trống (1 từ).","items":[{"q":"My grandma was ___ and had long hair.","accept":["tall"],"unit":12,"level":1,"why":"\"My grandma was tall and had long hair.\""},{"q":"My grandma was tall and had long ___.","accept":["hair"],"unit":12,"level":1,"why":"\"… and had long hair.\""},{"q":"In the transport museum, there was a ___ and a tram.","accept":["helicopter"],"unit":11,"level":3,"why":"\"there was a helicopter and a tram\" — chú ý chính tả h-e-l-i-c-o-p-t-e-r."},{"q":"In the transport museum, there was a helicopter and a ___.","accept":["tram"],"unit":11,"level":2,"why":"\"… and a tram.\""},{"q":"The park was very ___.","accept":["dirty"],"unit":10,"level":2,"why":"\"The park was very dirty.\""},{"q":"There was ___ on the grass.","accept":["litter"],"unit":10,"level":3,"why":"\"There was litter on the grass.\" (litter = rác vứt bừa bãi)"},{"q":"She's always so ___ and relaxed.","accept":["cheerful"],"unit":12,"level":3,"why":"\"She's always so cheerful and relaxed.\" (cheerful = vui vẻ)"},{"q":"She's always so cheerful and ___.","accept":["relaxed"],"unit":12,"level":2,"why":"\"… cheerful and relaxed.\" (relaxed = thoải mái, thư thái)"}]},{"id":"B1","part":"B","type":"mcq","title":"Odd one out. Choose the word that is different.","vi":"Chọn từ KHÁC NHÓM với ba từ còn lại.","items":[{"options":["Egypt","Spain","Thailand","summer"],"answer":3,"unit":1,"level":1,"why":"Egypt, Spain, Thailand là tên nước; summer là mùa.","trap":{"0":"Egypt (Ai Cập) là tên một nước, cùng nhóm với Spain, Thailand.","1":"Spain (Tây Ban Nha) là tên một nước.","2":"Thailand (Thái Lan) là tên một nước."}},{"options":["penguin","lizard","onion","camel"],"answer":2,"unit":5,"level":1,"why":"onion (củ hành) là thức ăn; penguin, lizard, camel là con vật ở sở thú.","trap":{"0":"penguin (chim cánh cụt) là con vật.","1":"lizard (thằn lằn) là con vật.","3":"camel (lạc đà) là con vật."}},{"options":["windsurf","snorkel","kayak","skateboard"],"answer":3,"unit":4,"level":2,"why":"windsurf, snorkel, kayak là hoạt động dưới nước ở bãi biển; skateboard (trượt ván) chơi trên đường, không cần nước.","trap":{"0":"windsurf = lướt ván buồm — chơi trên mặt nước.","1":"snorkel = lặn với ống thở — chơi dưới nước.","2":"kayak = chèo thuyền kayak — chơi trên nước."}},{"options":["computer","camera","DVD player","postcards"],"answer":3,"unit":3,"level":2,"why":"computer, camera, DVD player là đồ điện (bật/tắt được: turn on / turn off); postcards (bưu thiếp) là đồ sưu tầm bằng giấy.","trap":{"0":"computer là đồ điện, turn on/turn off được.","1":"camera là đồ điện, turn on/turn off được.","2":"DVD player là đồ điện, turn on/turn off được."}},{"options":["lake","river","ocean","mountain"],"answer":3,"unit":9,"level":2,"why":"lake (hồ), river (sông), ocean (đại dương) đều là nơi có nước; mountain (núi) thì không.","trap":{"0":"lake (hồ) có nước — cùng nhóm với river, ocean.","1":"river (sông) có nước.","2":"ocean (đại dương) có nước."}},{"options":["potato","onion","cucumber","cheese"],"answer":3,"unit":8,"level":3,"why":"potato (khoai tây), onion (hành), cucumber (dưa chuột) là rau củ; cheese (phô mai) làm từ sữa.","trap":{"0":"potato (khoai tây) là rau củ.","1":"onion (củ hành) là rau củ.","2":"cucumber (dưa chuột) là rau củ."}}]},{"id":"B2","part":"B","type":"text","title":"Complete the sentences with words from the box.","vi":"Điền từ trong khung vào chỗ trống. Có 2 từ thừa.","bank":["season","comics","bin","kind","catch","ferry","cooking","scared","path"],"items":[{"q":"Autumn is my favourite ___.","accept":["season"],"unit":1,"level":1,"why":"Autumn (mùa thu) là một season (mùa)."},{"q":"Mark has got 100 ___. He loves reading them.","accept":["comics"],"unit":3,"level":2,"why":"Thứ để đọc và sưu tầm: comics (truyện tranh)."},{"q":"Please put your litter in the ___.","accept":["bin"],"unit":10,"level":1,"why":"litter (rác) bỏ vào bin (thùng rác).","trap":{"path":"path = lối đi. Rác phải bỏ vào bin, không bỏ ra lối đi. Dùng path trong câu: Walk on the path."}},{"q":"The little mouse helps the lion. It is very ___.","accept":["kind"],"unit":5,"level":2,"why":"Giúp đỡ người khác → kind (tốt bụng). (Câu chuyện The Lion and the Mouse: \"You are little, but you are kind.\")","trap":{"scared":"scared = sợ hãi. Lúc đầu chuột có sợ, nhưng câu này nói chuột GIÚP sư tử → kind. Dùng scared khi: The mouse is scared of the lion."}},{"q":"I ___ the bus to school at eight o'clock.","accept":["catch"],"unit":6,"level":2,"why":"catch the bus = đi xe buýt (bắt xe buýt)."},{"q":"The ___ takes people and cars over the river.","accept":["ferry"],"unit":11,"level":3,"why":"ferry = phà, chở người và ô tô qua sông.","trap":{"path":"path là lối đi bộ trong công viên, không chở được người và ô tô."}},{"q":"My mum likes ___. She makes lunch for us every Sunday.","accept":["cooking"],"unit":2,"level":2,"why":"Làm bữa trưa → cooking (nấu ăn). like + V-ing."}]},{"id":"B3","part":"B","type":"mcq","title":"Phonics. Choose the correct letters or word.","vi":"Chọn chữ cái đúng để hoàn thành từ, hoặc chọn từ có cùng âm.","items":[{"q":"_ _ ink (you do this with water or juice)","options":["dr","tr","cr"],"answer":0,"unit":1,"level":1,"why":"drink (uống) — dr như draw.","trap":{"1":"tr có trong train, tree — nhưng uống là drink.","2":"cr có trong crayon — nhưng uống là drink."}},{"q":"sh _ _ k (a big fish with sharp teeth)","options":["ar","or","aw"],"answer":0,"unit":3,"level":1,"why":"shark — vần ar như car, park, star.","trap":{"1":"or có trong fork, horse — đọc khác với shark.","2":"aw có trong paw, straw — đọc khác với shark."}},{"q":"Which word has the same sound as 'ball'?","options":["tall","bell","doll"],"answer":0,"unit":4,"level":1,"why":"ball và tall cùng vần -all (như wall, small, mall).","trap":{"1":"bell có vần -ell, đọc khác -all.","2":"doll có vần -oll, đọc khác -all."}},{"q":"y _ _ n (you do this when you are tired)","options":["or","aw","ar"],"answer":1,"unit":5,"level":3,"why":"yawn (ngáp) — vần aw như straw, paw.","trap":{"0":"or đọc giống aw, nhưng yawn viết bằng aw. or có trong fork, horse, corn.","2":"ar có trong car, park — đọc khác."}},{"q":"chi _ _ (a boy or a girl)","options":["lt","ld","nd"],"answer":1,"unit":8,"level":2,"why":"child — ld như shield, field.","trap":{"0":"lt có trong belt, quilt, adult — nhưng child viết ld.","2":"nd có trong sand, pond — nhưng child viết ld."}},{"q":"There is a la _ _ on the table next to my bed.","options":["mp","nd","nt"],"answer":0,"unit":9,"level":2,"why":"lamp (đèn bàn) — mp như camp.","trap":{"1":"land là một từ khác, không đặt được lên bàn. nd có trong sand, pond.","2":"nt có trong tent, plant — «lant» không phải là từ."}},{"q":"Which word has the same sound as 'rain'?","options":["bag","train","cat"],"answer":1,"unit":10,"level":2,"why":"rain và train cùng âm a dài /eɪ/ (ai, ay, a_e: Monday, case); bag, cat là a ngắn.","trap":{"0":"bag có a ngắn /æ/, khác âm a dài trong rain.","2":"cat có a ngắn /æ/, khác âm a dài trong rain."}}]},{"id":"C1","part":"C","type":"mcq","title":"Choose the correct answer.","vi":"Chọn đáp án đúng.","items":[{"q":"Where ___ Amy and Leo from?","options":["is","are","do"],"answer":1,"unit":1,"level":1,"why":"Amy and Leo = they (số nhiều) → are.","trap":{"0":"is dùng cho một người (he/she/it): Where is Amy from?","2":"be from không cần do: Where are you from? (do dùng với động từ thường: Where do you live?)"}},{"q":"My brother ___ playing chess. It's his favourite game.","options":["like","likes","doesn't like"],"answer":1,"unit":2,"level":1,"why":"My brother = he → động từ thêm -s: likes. Trò chơi yêu thích → thích.","trap":{"0":"like (không -s) dùng với I/you/we/they: My brothers like …","2":"doesn't like đúng ngữ pháp nhưng sai nghĩa: đó là trò chơi yêu thích của anh ấy."}},{"q":"\"Does your dad walk to work?\" \"No, he ___. He catches the bus.\"","options":["doesn't","isn't","don't"],"answer":0,"unit":6,"level":2,"why":"Hỏi bằng Does → trả lời ngắn bằng doesn't: No, he doesn't.","trap":{"1":"isn't trả lời câu hỏi bắt đầu bằng Is: Is he walking? — No, he isn't.","2":"don't dùng cho I/you/we/they: Do you walk? — No, I don't."}},{"q":"This is Tom and Lucy's house. That's ___ car, too.","options":["our","their","your"],"answer":1,"unit":3,"level":2,"why":"Tom and Lucy = they → their (của họ).","trap":{"0":"our = của chúng tôi — chỉ dùng khi người nói là chủ.","2":"your = của bạn — dùng khi nói chuyện trực tiếp với người chủ."}},{"q":"\"___ I use your camera, please?\" \"Yes, you can.\"","options":["Can","Do","Does"],"answer":0,"unit":3,"level":1,"why":"Xin phép: Can I …? — trả lời Yes, you can.","trap":{"1":"Câu trả lời là «you can» nên câu hỏi phải dùng Can. Do dùng khi trả lời Yes, I do.","2":"Does dùng cho he/she/it, không đi với I."}},{"q":"Look! The children ___ in the sea.","options":["swim","are swimming","swims"],"answer":1,"unit":4,"level":2,"why":"Look! → việc đang xảy ra ngay lúc này → hiện tại tiếp diễn: are swimming.","trap":{"0":"swim (hiện tại đơn) dùng cho thói quen: They swim every Sunday.","2":"swims dùng cho he/she/it, và vẫn là thói quen chứ không phải việc đang xảy ra."}},{"q":"\"Is the monkey eating a banana?\" \"No, it ___. It's climbing a tree.\"","options":["isn't","doesn't","aren't"],"answer":0,"unit":5,"level":2,"why":"Hỏi bằng Is → trả lời bằng isn't.","trap":{"1":"doesn't trả lời câu hỏi bắt đầu bằng Does: Does it eat bananas? — No, it doesn't.","2":"aren't dùng cho they/we/you; the monkey = it."}},{"q":"\"___ the flamingos flying?\" \"Yes, they are.\"","options":["Is","Are","Do"],"answer":1,"unit":5,"level":1,"why":"the flamingos (số nhiều) + V-ing → Are …?","trap":{"0":"Is dùng cho một con: Is the flamingo flying?","2":"Do không đi với V-ing; Do the flamingos fly? (hỏi về khả năng/thói quen) — trả lời Yes, they do."}},{"q":"What time ___ your dad start work?","options":["do","does","is"],"answer":1,"unit":6,"level":2,"why":"your dad = he → câu hỏi hiện tại đơn dùng does.","trap":{"0":"do dùng cho I/you/we/they: What time do you start school?","2":"is đi với V-ing (Is your dad working?), không đi với động từ nguyên mẫu start."}},{"q":"My birthday is ___ May.","options":["in","on","at"],"answer":0,"unit":7,"level":1,"why":"Tháng → in: in May.","trap":{"1":"on dùng cho thứ: on Monday, on Saturdays.","2":"at dùng cho giờ: at eight o'clock."}},{"q":"Would you like ___ cereal?","options":["a","an","some"],"answer":2,"unit":8,"level":2,"why":"cereal không đếm được → some.","trap":{"0":"a chỉ dùng với danh từ đếm được số ít: a melon.","1":"an dùng trước danh từ đếm được bắt đầu bằng nguyên âm: an onion."}},{"q":"The Pacific Ocean is ___ ocean in the world.","options":["wider","the widest","wide"],"answer":1,"unit":9,"level":2,"why":"«… in the world» → so sánh nhất: the widest.","trap":{"0":"wider dùng để so sánh 2 thứ với than: wider than the Atlantic Ocean.","2":"wide là tính từ thường: The ocean is wide. Có «in the world» thì phải là the widest."}},{"q":"We're in the library. You ___ shout. You must be quiet.","options":["must","mustn't","can"],"answer":1,"unit":10,"level":2,"why":"Trong thư viện phải im lặng → không được hét: mustn't shout.","trap":{"0":"must = phải làm; không ai bắt phải hét trong thư viện.","2":"can = được phép; câu sau «You must be quiet» cho thấy không được hét."}},{"q":"There ___ any planes two hundred years ago.","options":["wasn't","weren't","were"],"answer":1,"unit":11,"level":3,"why":"planes số nhiều + any (phủ định) + ago → weren't.","trap":{"0":"wasn't dùng với danh từ số ít: There wasn't a plane.","2":"were là khẳng định (There were some trains); có any thì phải là phủ định: weren't."}},{"q":"When I was five, I ___ a red bike.","options":["had","have","was"],"answer":0,"unit":12,"level":2,"why":"«When I was five» → quá khứ của have là had.","trap":{"1":"have là hiện tại: Now I have a blue bike. Câu này nói về lúc 5 tuổi.","2":"was đi với tính từ: I was short. «I was a red bike» = Tôi là chiếc xe đạp — sai nghĩa."}}]},{"id":"C2","part":"C","type":"text","title":"Write the correct form of the verb.","vi":"Viết dạng đúng của từ trong ngoặc.","items":[{"q":"Jim ___ (get) up at six o'clock every day.","accept":["gets"],"unit":6,"level":2,"why":"Jim = he, every day → hiện tại đơn thêm -s: gets.","trap":{"get":"Thiếu -s: với he/she/it phải là gets.","is getting":"every day là thói quen → hiện tại đơn."}},{"q":"My sister ___ (not like) fishing.","accept":["doesn't like","does not like"],"unit":2,"level":2,"why":"My sister = she → doesn't like.","trap":{"do not like":"don't dùng cho I/you/we/they; she phải đi với doesn't.","does not likes":"sau doesn't động từ giữ nguyên: doesn't like.","not like":"cần trợ động từ: doesn't like.","is not like":"like là động từ thường, phủ định bằng doesn't, không dùng isn't."}},{"q":"Listen! Holly ___ (sing) in her room.","accept":["is singing"],"unit":4,"level":2,"why":"Listen! → đang xảy ra → is singing.","trap":{"sings":"sings là thói quen (Holly sings every day); «Listen!» báo hiệu việc đang xảy ra.","singing":"thiếu is: Holly is singing.","are singing":"Holly là một người → is."}},{"q":"___ (you / like) taking photos?","accept":["do you like","Do you like taking photos?"],"unit":2,"level":3,"why":"Câu hỏi hiện tại đơn với you → Do you like …?","trap":{"you like":"Câu hỏi phải có Do ở đầu.","are you like":"like là động từ thường, câu hỏi dùng Do, không dùng Are.","does you like":"Does dùng cho he/she/it; you đi với Do."}},{"q":"An elephant is ___ (big) than a horse.","accept":["bigger"],"unit":9,"level":2,"why":"Có than → so sánh hơn; big → bigger (gấp đôi g).","trap":{"biger":"big kết thúc bằng 1 nguyên âm + 1 phụ âm → gấp đôi g: bigger.","biggest":"biggest là so sánh nhất (the biggest … in the world); có than thì dùng bigger.","more big":"Tính từ ngắn thêm -er: bigger."}},{"q":"There ___ (be) a cinema in our town fifty years ago.","accept":["was"],"unit":11,"level":2,"why":"a cinema số ít + ago → was.","trap":{"were":"were dùng với danh từ số nhiều; a cinema là số ít.","is":"fifty years ago là quá khứ."}},{"q":"Max ___ (not have) a computer when he was six.","accept":["didn't have","did not have"],"unit":12,"level":3,"why":"Quá khứ phủ định của have: didn't have.","trap":{"has not":"hiện tại; câu nói về lúc 6 tuổi.","does not have":"hiện tại; cần quá khứ: didn't have.","did not had":"sau didn't động từ giữ nguyên: didn't have.","was not have":"không dùng wasn't với have.","had not":"Lớp 3 học phủ định của had là didn't have."}},{"q":"My mum ___ (never / drink) coffee.","accept":["never drinks"],"unit":7,"level":3,"why":"Trạng từ tần suất đứng trước động từ thường; my mum = she → drinks.","trap":{"never drink":"Thiếu -s: she never drinks.","drinks never":"never phải đứng TRƯỚC động từ thường.","does not never drink":"never đã mang nghĩa phủ định, không dùng thêm doesn't."}}]},{"id":"C3","part":"C","type":"order","title":"Put the words in order. Write the sentence.","vi":"Sắp xếp từ thành câu đúng rồi viết lại cả câu.","items":[{"words":["climbing","Are","monkeys","the","?"],"accept":["Are the monkeys climbing"],"unit":5,"level":2,"why":"Câu hỏi hiện tại tiếp diễn: Are + chủ ngữ + V-ing?"},{"words":["get up","does","What time","Tom","?"],"accept":["What time does Tom get up"],"unit":6,"level":3,"why":"Câu hỏi hiện tại đơn: What time + does + Tom + động từ nguyên mẫu? (không viết Tom does get up)."},{"words":["like","Would","some","you","pasta","?"],"accept":["Would you like some pasta"],"unit":8,"level":2,"why":"Lời mời: Would you like some …?"},{"words":["must","You","your","turn off","mobile phone"],"accept":["You must turn off your mobile phone","You must turn your mobile phone off"],"unit":10,"level":2,"why":"You must + động từ nguyên mẫu."},{"words":["is","the","mountain","highest","What","in","world","the","?"],"accept":["What is the highest mountain in the world"],"unit":9,"level":3,"why":"Câu hỏi: What is + the + tính từ so sánh nhất + danh từ + in the world?"}]},{"id":"D1","part":"D","type":"tf","title":"Read the email. Choose True or False.","vi":"Đọc thư của Sofia. Chọn True (đúng) hoặc False (sai).","passageTitle":"An email from Sofia","passage":"Hi Jenny,\n\nMy name is Sofia. I'm ten and I'm from Spain. I live in a small town near the sea with my mum, my dad and my grandpa.\n\nI get up at seven o'clock every day. I have breakfast, and then I walk to school with my cousin Pablo.\n\nOn Saturdays, we go to the beach. Pablo likes swimming and snorkelling, but he doesn't like diving. I like collecting shells. I've got eighty shells in a box in my bedroom! At our beach there is a sign: \"You mustn't play ball games here. You must put your litter in the bin.\"\n\nThere are three bridges over the river in our town. The Red Bridge is the oldest, and the Green Bridge is the longest.\n\nOn Friday evenings, Grandpa cooks pasta with cheese for dinner. He always says, \"Would you like some pasta, Sofia?\" And I always say, \"Yes, please!\"\n\nGrandpa is seventy-five. He's very cheerful. When he was young, he had black hair and a small boat.\n\nToday is Sunday and I'm at the zoo with Grandpa. The monkeys are eating bananas and the penguins are swimming. Grandpa is taking photos!\n\nLove,\nSofia","items":[{"q":"Sofia lives in a big city.","answer":"False","unit":1,"level":1,"why":"\"I live in a small town near the sea.\""},{"q":"Sofia walks to school with her cousin.","answer":"True","unit":6,"level":1,"why":"\"I walk to school with my cousin Pablo.\""},{"q":"Pablo likes diving.","answer":"False","unit":4,"level":2,"why":"\"Pablo likes swimming and snorkelling, but he doesn't like diving.\" — chú ý chữ but."},{"q":"Grandpa is swimming now.","answer":"False","unit":4,"level":2,"why":"Bây giờ ông đang chụp ảnh: \"Grandpa is taking photos!\" Đang bơi là những chú chim cánh cụt (the penguins are swimming)."},{"q":"Grandpa had a big boat when he was young.","answer":"False","unit":12,"level":2,"why":"\"When he was young, he had black hair and a small boat.\" — thuyền nhỏ, không phải to."}]},{"id":"D2","part":"D","type":"kw","pts":2,"title":"Read the email again. Answer the questions.","vi":"Đọc lại thư của Sofia ở trên. Trả lời câu hỏi (viết ngắn hoặc cả câu đều được).","items":[{"q":"What does Sofia collect? How many has she got?","kw":[["shells","shell"],["eighty","80"]],"model":"She collects shells. She's got eighty shells.","unit":3,"level":2,"why":"\"I like collecting shells. I've got eighty shells …\" Cần viết đủ hai ý: shells và eighty."},{"q":"What are the monkeys doing?","kw":[["eating","eat","eats"],["banana","bananas"]],"model":"They're eating bananas.","unit":5,"level":2,"why":"\"The monkeys are eating bananas.\" (Đang bơi là the penguins.)"},{"q":"What does Grandpa cook on Friday evenings?","kw":[["pasta"]],"model":"He cooks pasta with cheese.","unit":8,"level":1,"why":"\"On Friday evenings, Grandpa cooks pasta with cheese for dinner.\""},{"q":"Which bridge is the longest?","kw":[["green"]],"model":"The Green Bridge is the longest.","unit":9,"level":3,"why":"\"The Red Bridge is the oldest, and the Green Bridge is the longest.\" — Red Bridge là cầu cổ nhất (oldest), không phải dài nhất."},{"q":"What mustn't you do at Sofia's beach?","kw":[["ball","balls","football"]],"model":"You mustn't play ball games.","unit":10,"level":3,"why":"Tấm biển: \"You mustn't play ball games here.\" (\"You must put your litter in the bin\" là việc PHẢI làm, không phải việc cấm.)"}]},{"id":"E1","part":"E","type":"text","title":"Find the mistake. Write the sentence correctly.","vi":"Mỗi câu có MỘT lỗi sai. Viết lại cả câu cho đúng.","items":[{"q":"He always watch TV after school.","accept":["He always watches TV after school"],"unit":6,"level":2,"why":"He → watches (động từ tận cùng bằng ch thêm -es).","trap":{"he always watchs tv after school":"Động từ tận cùng bằng ch thêm -es: watches.","he watches always tv after school":"always phải đứng trước động từ thường: He always watches …","He always watch TV after school.":"Câu này chép lại y nguyên, chưa sửa lỗi. He → watches."}},{"q":"Where you live?","accept":["Where do you live"],"unit":6,"level":3,"why":"Câu hỏi hiện tại đơn cần do: Where do you live?","trap":{"where does you live":"you đi với do, không đi với does.","where are you live":"Không dùng are với động từ thường live.","where do you lives":"Sau do động từ giữ nguyên: live.","Where you live?":"Câu này chép lại y nguyên, chưa sửa lỗi. Câu hỏi cần do: Where do you live?"}},{"q":"Can you turns on the TV, please?","accept":["Can you turn on the TV, please?","Can you turn on the TV?","Can you turn the TV on, please?","Can you turn the TV on?","Can you please turn on the TV?"],"unit":3,"level":2,"why":"Sau can động từ giữ nguyên: Can you turn on …?","trap":{"can you turning on the tv please":"Sau can dùng động từ nguyên mẫu: turn, không dùng turning.","Can you turns on the TV, please?":"Câu này chép lại y nguyên, chưa sửa lỗi. Sau can động từ giữ nguyên: turn."}},{"q":"There was some trains a hundred years ago.","accept":["There were some trains a hundred years ago","There were some trains one hundred years ago","There were some trains 100 years ago","There were trains a hundred years ago","There were trains one hundred years ago","There were trains 100 years ago"],"unit":11,"level":2,"why":"trains số nhiều → There were.","trap":{"there was a train a hundred years ago":"Chỉ cần sửa was → were; không đổi trains thành a train.","There was some trains a hundred years ago.":"Câu này chép lại y nguyên, chưa sửa lỗi. trains số nhiều → were."}},{"q":"Russia is the bigger country in the world.","accept":["Russia is the biggest country in the world"],"unit":9,"level":3,"why":"«in the world» → so sánh nhất: the biggest (gấp đôi g).","trap":{"russia is the bigest country in the world":"big → biggest: gấp đôi chữ g.","russia is the most big country in the world":"Tính từ ngắn thêm -est: the biggest.","Russia is the bigger country in the world.":"Câu này chép lại y nguyên, chưa sửa lỗi. in the world → the biggest.","Russia is bigger country in the world const LS = DATA.storageKey;

// ---- grading helpers (same rules as Revision 1–9: case-insensitive, contractions = full forms)
function norm(s) {
  s = String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); // café = cafe
  s = s.replace(/[’‘`´ʼ′]/g, "'").replace(/[“”«»]/g, '"').replace(/[–—‐‑]/g, '-');
  s = s.replace(/[.,!?;:"()]/g, ' ').replace(/\s*-\s*/g, '-').replace(/\s+/g, ' ').trim();
  s = s.replace(/(^|[^a-z0-9])'+|'+(?=[^a-z]|$)/g, '$1 ').replace(/\s+/g, ' ').trim(); // quotes around a word: 'gets' → gets
  // "'s got" is always "has got" (never "is got"), for pronouns AND names: Tim's got = Tim has got; "Tim is got" stays wrong.
  // iPad without apostrophe: "Tims got" / "shes got" = "… has got" (except words that end in s by themselves: has, is, this, his…)
  s = s.replace(/\b([a-z]+)'s got\b/g, '$1 has got')
       .replace(/\b([a-z]+)s got\b/g, (m, w) => /s$|^(ha|i|wa|thi|hi|u|ye|doe|goe|her|our|your|their|thu|plu|ga|bu)$/.test(w) ? m : w + ' has got');
  s = s.replace(/\bi'm\b/g, 'i am').replace(/\b([a-z]+)'re\b/g, '$1 are')
       .replace(/\b(it|he|she|that|this|there|here|what|who|where|how)'s\b/g, '$1 is')
       .replace(/\bisn't\b/g, 'is not').replace(/\baren't\b/g, 'are not')
       .replace(/\bdon't\b/g, 'do not').replace(/\bdoesn't\b/g, 'does not')
       .replace(/\bcan't\b/g, 'cannot').replace(/\bcan not\b/g, 'cannot')
       .replace(/\bhaven't\b/g, 'have not').replace(/\bhasn't\b/g, 'has not')
       .replace(/\b([a-z]+)'ve\b/g, '$1 have').replace(/\b([a-z]+)'ll\b/g, '$1 will')
       // 'd is ambiguous (he'd = he had / he would): expand only in "'d like/love/prefer", leave other 'd untouched
       .replace(/\b(i|you|we|they|he|she)'d (like|love|prefer)\b/g, '$1 would $2')
       .replace(/\b(i|you|we|they)d (like|love|prefer)\b/g, '$1 would $2') // iPad: "Id like"
       .replace(/\bdidn't\b/g, 'did not').replace(/\bwasn't\b/g, 'was not').replace(/\bweren't\b/g, 'were not')
       .replace(/\bmustn't\b/g, 'must not').replace(/\bwon't\b/g, 'will not');
  s = s.replace(/\bim\b/g, 'i am').replace(/\bdont\b/g, 'do not').replace(/\bdoesnt\b/g, 'does not')
       .replace(/\bisnt\b/g, 'is not').replace(/\barent\b/g, 'are not').replace(/\bcant\b/g, 'cannot')
       .replace(/\bhavent\b/g, 'have not').replace(/\bhasnt\b/g, 'has not').replace(/\bdidnt\b/g, 'did not')
       .replace(/\bwasnt\b/g, 'was not').replace(/\bwerent\b/g, 'were not').replace(/\bmustnt\b/g, 'must not')
       .replace(/\btheyre\b/g, 'they are').replace(/\byoure\b/g, 'you are')
       .replace(/\bthats\b/g, 'that is').replace(/\btheres\b/g, 'there is').replace(/\bwhats\b/g, 'what is')
       .replace(/\bhes\b/g, 'he is').replace(/\bshes\b/g, 'she is')
       .replace(/\b(i|we|you|they)ve\b/g, '$1 have').replace(/\bwouldnt\b/g, 'would not').replace(/\bcouldnt\b/g, 'could not');
  return s.replace(/\s+/g, ' ').trim();
}
// trap feedback: keys in data.json may be written with contractions/capitals/punctuation → compare normalised
function trapFor(trap, v) {
  if (!trap) return null; const n = norm(v);
  for (const k of Object.keys(trap)) if (k !== '*' && norm(k) === n) return trap[k];
  return null;
}
const matches = (u, acc) => { const n = norm(u); return !!n && acc.some(a => norm(a) === n); };
// kw: every group needs one alternative present as whole words
const kwOk = (u, groups) => { const s = ' ' + norm(u) + ' '; return norm(u) !== '' && groups.every(g => g.some(a => s.includes(' ' + norm(a) + ' '))); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---- state
let store = { attempts: [], draft: null };
const isObj = o => !!o && typeof o === 'object' && !Array.isArray(o);
try {
  const v = JSON.parse(localStorage.getItem(LS) || 'null');
  if (isObj(v) && Array.isArray(v.attempts)) store = {
    // drop anything malformed (old versions / hand-edited / corrupted values) instead of crashing
    attempts: v.attempts.filter(a => isObj(a) && typeof a.score === 'number' && !isNaN(new Date(a.date))),
    draft: isObj(v.draft) ? v.draft : null };
} catch (e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} };
let answers = (store.draft && isObj(store.draft.answers)) ? store.draft.answers : {};
let graded = null; let confirmOpen = false;
let speak = (store.draft && isObj(store.draft.speak)) ? store.draft.speak : {};

const items = []; DATA.exercises.forEach(ex => ex.items.forEach((it, i) => items.push({ ex, it, key: ex.id + '.' + (i + 1) })));
const TOTAL = items.reduce((s, x) => s + (x.it.pts || x.ex.pts || 1), 0);

function render() {
  const app = document.getElementById('app');
  let h = `<h1>${esc(DATA.title)}</h1><p class="muted">${esc(DATA.subtitle)}</p>`;
  h += `<div class="card small">${DATA.instructions.map(esc).join('<br>')}</div>`;
  if (graded) h += resultHtml();
  let part = null, exNo = 0;
  for (const ex of DATA.exercises) {
    if (ex.part !== part) { part = ex.part; h += `<h2 class="part">${esc(DATA.parts[part])}</h2>`; }
    exNo++;
    const exPts = ex.items.reduce((s, it) => s + (it.pts || ex.pts || 1), 0);
    const got = graded ? ex.items.reduce((s, it, i) => s + (graded.res[ex.id + '.' + (i + 1)].pts), 0) : null;
    h += `<section class="card" id="ex-${ex.id}"><div class="exh"><span class="num">${exNo}</span><div class="ttl"><b>${esc(ex.title)}</b><span class="vi">${esc(ex.vi || '')}</span></div><span class="pts ${graded ? 'done' : ''}">${graded ? got + ' / ' : ''}${exPts} điểm</span></div>`;
    if (ex.audio) h += `<div class="audio"><audio controls preload="none" src="${esc(ex.audio)}"></audio><span class="small muted">Nghe 2 lần.</span></div>`;
    if (ex.passage) h += `<div class="passage">${ex.passageTitle ? `<h4>${esc(ex.passageTitle)}</h4>` : ''}${esc(ex.passage)}</div>`;
    if (ex.bank) h += `<div class="bank">${ex.bank.map(w => `<span>${esc(w)}</span>`).join('')}</div>`;
    if (ex.example) h += `<p class="eg">Ví dụ: ${ex.example}</p>`;
    ex.items.forEach((it, i) => { h += itemHtml(ex, it, ex.id + '.' + (i + 1), i + 1); });
    h += `</section>`;
  }
  h += speakingHtml();
  if (store.attempts.length) h += historyHtml();
  app.innerHTML = h;
  bindInputs(); renderBar();
}

function itemHtml(ex, it, key, n) {
  const v = answers[key]; const r = graded && graded.res[key];
  const type = it.type || ex.type;
  let body = it.q ? `<div class="q">${fmtQ(it.q, key, type, v, r, ex, it)}</div>` : '';
  if (type === 'mcq' || type === 'tf') {
    const opts = type === 'tf' ? ['True', 'False'] : (it.options || ex.options);
    body += `<div class="opts" role="radiogroup">` + opts.map((o, k) => {
      let cls = ''; if (graded) { if (k === answerIndex(ex, it)) cls = 'ok'; else if (v === k) cls = 'bad'; }
      return `<label class="opt ${cls}"><input type="radio" name="${key}" value="${k}" ${v === k ? 'checked' : ''} ${graded ? 'disabled' : ''}><span>${esc(o)}</span></label>`;
    }).join('') + `</div>`;
  } else if (type === 'select') {
    if (!/___/.test(it.q || '')) body += selectHtml(ex, key, v, r);
  } else if (type === 'order') {
    body = `<div class="words">${it.words.map(w => `<span>${esc(w)}</span>`).join('')}</div>` + `<input class="in-t ${r ? (r.ok ? 'ok' : 'bad') : ''}" data-k="${key}" value="${esc(v || '')}" ${graded ? 'readonly' : ''} autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Viết câu hoàn chỉnh…">`;
  } else if ((type === 'text' || type === 'kw') && !/___/.test(it.q || '')) {
    body += `<input class="in-t ${r ? (r.ok ? 'ok' : 'bad') : ''}" data-k="${key}" value="${esc(v || '')}" ${graded ? 'readonly' : ''} autocomplete="off" autocapitalize="off" spellcheck="false">`;
  }
  if (r && !r.ok) body += fbHtml(ex, it, v);
  return `<div class="item"><span class="n">${n}.</span><div>${body}</div></div>`;
}
function selectHtml(ex, key, v, r) {
  const opts = ex.options;
  return `<select class="in-t ${r ? (r.ok ? 'ok' : 'bad') : ''}" data-k="${key}" ${graded ? 'disabled' : ''}><option value="">— chọn —</option>${opts.map(o => `<option ${v === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
}
function fmtQ(q, key, type, v, r, ex, it) {
  const parts = esc(q).split('___');
  if (parts.length === 1) return parts[0];
  // mcq/tf: the gap is NOT an input (answer = the radio); it shows the chosen option
  if (type === 'mcq' || type === 'tf') {
    const opts = type === 'tf' ? ['True', 'False'] : (it.options || ex.options);
    return parts[0] + `<span class="blank" data-b="${key}">${typeof v === 'number' && opts[v] != null ? esc(opts[v]) : '&nbsp;'}</span>` + parts.slice(1).join('___');
  }
  const field = type === 'select' ? selectHtml(ex, key, v, r)
    : `<input class="in-t gap ${r ? (r.ok ? 'ok' : 'bad') : ''}" data-k="${key}" value="${esc(v || '')}" ${graded ? 'readonly' : ''} autocomplete="off" autocapitalize="off" spellcheck="false">`;
  return parts[0] + field + parts.slice(1).join('___');
}
function answerIndex(ex, it) { return typeof it.answer === 'number' ? it.answer : (it.answer === 'True' ? 0 : it.answer === 'False' ? 1 : -1); }
function modelAnswer(ex, it) {
  const type = it.type || ex.type;
  if (type === 'mcq') return (it.options || ex.options)[it.answer];
  if (type === 'tf') return it.answer;
  if (type === 'select') return it.answer;
  if (type === 'kw') return it.model;
  return it.accept[0];
}
function fbHtml(ex, it, v) {
  const type = it.type || ex.type;
  let wrongWhy = '';
  if (it.trap && v != null && v !== '') {
    // mcq/tf: key = option index ("0","1"…; tf also accepts "True"/"False"); text/select/kw: key = typed text (normalised)
    const t = (type === 'mcq' || type === 'tf') ? (it.trap[String(v)] || (type === 'tf' && it.trap[['True', 'False'][v]]) || it.trap['*'])
      : trapFor(it.trap, v) || it.trap['*'];
    if (t) wrongWhy = `<br><span class="x">Vì sao sai:</span> ${esc(t)}`;
  }
  return `<div class="fb">Đáp án: <span class="a">${esc(modelAnswer(ex, it))}</span>${it.why ? `<br>${esc(it.why)}` : ''}${wrongWhy}</div>`;
}

function speakingHtml() {
  const s = DATA.speaking; if (!s) return '';
  let h = `<h2 class="part">${esc(s.title)}</h2><div class="card"><p class="small muted">${esc(s.note)}</p><ol class="speak">${s.prompts.map(p => `<li>${esc(p)}</li>`).join('')}</ol>`;
  h += `<p class="small"><b>Phụ huynh chấm (0–${s.max}):</b></p><div class="rub" role="radiogroup" aria-label="Điểm Speaking">`;
  for (let k = 0; k <= s.max; k++) h += `<label class="opt"><input type="radio" name="speak" value="${k}" ${speak.score === k ? 'checked' : ''}><span>${k}</span></label>`;
  h += `</div><p class="small muted">${s.rubric.map(esc).join('<br>')}</p></div>`;
  return h;
}

function bindInputs() {
  // accessible names: "Bài 3, câu 2" for every input / select / radiogroup
  document.querySelectorAll('section[id^="ex-"]').forEach(sec => {
    const exn = sec.querySelector('.num').textContent;
    sec.querySelectorAll('.item').forEach(row => {
      const lab = `Bài ${exn}, câu ${row.querySelector('.n').textContent.replace('.', '')}`;
      row.querySelectorAll('[data-k], [role=radiogroup]').forEach(el => el.setAttribute('aria-label', lab));
    });
  });
  document.querySelectorAll('[data-k]').forEach(el => {
    const on = () => { answers[el.dataset.k] = el.value; draft(); renderBar(); };
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', on);
  });
  document.querySelectorAll('input[type=radio]').forEach(el => el.addEventListener('change', () => {
    if (el.name === 'speak') { speak.score = +el.value; draft(); if (graded) { graded.speaking = speak.score; persistSpeak(); } return; }
    answers[el.name] = +el.value; draft(); renderBar();
    const b = document.querySelector(`.blank[data-b="${CSS.escape(el.name)}"]`); if (b) b.textContent = el.nextElementSibling.textContent;
  }));
}
function draft() { if (!graded) { store.draft = { answers, speak }; save(); } else save(); }
function persistSpeak() { const a = store.attempts[store.attempts.length - 1]; if (a && a.id === graded.id) { a.speaking = speak.score; save(); } }
function answeredCount() { return items.filter(x => answers[x.key] !== undefined && answers[x.key] !== '').length; }

// keep the last content clear of the fixed bottom bar (bar grows to 2–3 lines on phones in the confirm state)
function fitBar() { document.getElementById('app').style.paddingBottom = (document.getElementById('bar').offsetHeight + 28) + 'px'; }
addEventListener('resize', fitBar);
function renderBar() { renderBarInner(); fitBar(); }
function renderBarInner() {
  const prog = document.getElementById('prog'), btns = document.getElementById('barBtns');
  if (graded) {
    prog.innerHTML = `Điểm: <b>${graded.score} / ${TOTAL}</b>`;
    btns.innerHTML = `<button class="btn" id="bTop">Xem kết quả</button> <button class="btn primary" id="bNew">Làm lại từ đầu</button>`;
    document.getElementById('bTop').onclick = () => document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
    document.getElementById('bNew').onclick = () => { if (confirm('Xoá bài đang xem và làm lại từ đầu?')) { answers = {}; speak = {}; graded = null; store.draft = null; save(); render(); scrollTo(0, 0); } };
    return;
  }
  const n = answeredCount();
  prog.innerHTML = `Đã làm <b>${n}</b> / ${items.length} câu`;
  if (confirmOpen) {
    btns.innerHTML = `<span class="confirm">Còn ${items.length - n} câu chưa làm. Vẫn nộp bài? <button class="btn" id="bNo">Làm tiếp</button> <button class="btn primary" id="bYes">Nộp</button></span>`;
    document.getElementById('bNo').onclick = () => { confirmOpen = false; renderBar(); };
    document.getElementById('bYes').onclick = () => { confirmOpen = false; grade(); };
  } else {
    btns.innerHTML = `<button class="btn primary" id="bGrade">Nộp bài</button>`;
    document.getElementById('bGrade').onclick = () => { if (answeredCount() < items.length) { confirmOpen = true; renderBar(); } else grade(); };
  }
}

function grade() {
  const res = {}; let score = 0;
  for (const { ex, it, key } of items) {
    const type = it.type || ex.type, v = answers[key], pts = it.pts || ex.pts || 1;
    let ok = false;
    if (type === 'mcq' || type === 'tf') ok = v === answerIndex(ex, it);
    else if (type === 'select') ok = v === it.answer;
    else if (type === 'kw') ok = kwOk(v, it.kw);
    else ok = matches(v, it.accept);
    res[key] = { ok, pts: ok ? pts : 0, max: pts };
    score += res[key].pts;
  }
  graded = { id: Date.now(), date: new Date().toISOString(), score, res, speaking: speak.score };
  store.attempts.push({ id: graded.id, date: graded.date, score, total: TOTAL, speaking: speak.score ?? null,
    answers: { ...answers }, wrong: items.filter(x => !res[x.key].ok).map(x => x.key),
    byPart: breakdown('part'), byUnit: breakdown('unit'), byLevel: breakdown('level') });
  store.draft = null; save();
  render(); document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
}
function breakdown(dim) {
  const m = {};
  for (const { ex, it, key } of items) {
    const k = dim === 'part' ? ex.part : dim === 'unit' ? String(it.unit ?? ex.unit) : String(it.level || 2);
    m[k] = m[k] || { got: 0, max: 0 }; m[k].max += graded.res[key].max; m[k].got += graded.res[key].pts;
  }
  return m;
}
function band(p) { return DATA.bands.find(b => p >= b.min); }
function barCell(got, max) { const p = max ? got / max : 0; return `<div class="pbar"><i class="${p < .5 ? 'low' : p < .75 ? 'mid' : ''}" style="width:${Math.round(p * 100)}%"></i></div>`; }
function resultHtml() {
  const pct = Math.round(graded.score * 100 / TOTAL), b = band(pct);
  const bp = breakdown('part'), bu = breakdown('unit');
  let h = `<section class="card" id="result" style="border:2px solid var(--accent)"><div class="score"><span class="big">${graded.score}</span><span class="muted">/ ${TOTAL} điểm</span><span class="band">${esc(b.label)}</span></div><p>${esc(b.advice)}</p>`;
  h += `<h3>Theo kỹ năng</h3><table class="t"><tr><th>Phần</th><th class="r">Điểm</th><th style="width:40%"></th></tr>` +
    Object.keys(DATA.parts).filter(k => bp[k]).map(k => `<tr><td>${esc(DATA.parts[k])}</td><td class="r">${bp[k].got} / ${bp[k].max}</td><td>${barCell(bp[k].got, bp[k].max)}</td></tr>`).join('') + `</table>`;
  const unitKeys = Object.keys(bu).sort((a, b) => (+a || 0) - (+b || 0));
  h += `<h3>Theo unit</h3><table class="t"><tr><th>Unit</th><th class="r">Điểm</th><th style="width:40%"></th></tr>` +
    unitKeys.map(k => `<tr><td>${k === 'mix' ? 'Tổng hợp' : /^[0-9]+$/.test(k) ? 'Unit ' + esc(k) : esc(k)} <span class="small muted">${esc(DATA.unitTitles[k] || '')}</span></td><td class="r">${bu[k].got} / ${bu[k].max}</td><td>${barCell(bu[k].got, bu[k].max)}</td></tr>`).join('') + `</table>`;
  const weak = unitKeys.filter(k => bu[k].max >= 3 && bu[k].got / bu[k].max < .6);
  if (weak.length) h += `<p><b>Cần ôn lại:</b> ${weak.map(k => (k === 'mix' ? 'phần tổng hợp' : (/^[0-9]+$/.test(k) ? 'Unit ' : '') + k + ' (' + (DATA.unitTitles[k] || '') + ')')).map(esc).join(', ')}.</p>`;
  h += `<p class="small muted">Các câu sai được tô đỏ bên dưới, kèm đáp án và giải thích.</p></section>`;
  return h;
}
function historyHtml() {
  return `<h2 class="part">Các lần làm trước</h2><div class="card"><ul class="hist">${store.attempts.slice().reverse().map(a => `<li>${new Date(a.date).toLocaleString('vi-VN')}: <b>${a.score} / ${a.total}</b>${a.speaking != null ? ` · Speaking ${a.speaking}/${DATA.speaking.max}` : ''}</li>`).join('')}</ul>
  <button class="btn" id="bExport">Tải kết quả (JSON)</button></div>`;
}
document.addEventListener('click', e => {
  if (e.target.id === 'bExport') {
    const blob = new Blob([JSON.stringify(store.attempts, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = DATA.exportName; a.click();
  }
});
render();
</script>
</body>
</html>
