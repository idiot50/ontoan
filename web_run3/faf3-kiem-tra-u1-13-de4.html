<style>
:root {
  --bg: #f4f6f3; --surface: #fff; --fg: #1d2924; --muted: #5d6c65; --line: #d7ded8; --line2: #b9c4bd;
  --accent: #1f6f5c; --accent-ink: #fff; --accent-soft: #e2f1ea;
  --ok: #2c7a39; --ok-soft: #e4f4e6; --bad: #b9312f; --bad-soft: #fbe7e5; --warn: #9a5b00; --warn-soft: #fff1d6;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131916; --surface: #1b2420; --fg: #e5ebe6; --muted: #9db0a5; --line: #2c3a33; --line2: #41534a;
  --accent: #6fcfb0; --accent-ink: #0f1f19; --accent-soft: #1d3a31;
  --ok: #7bd389; --ok-soft: #1e3525; --bad: #ff8f85; --bad-soft: #3d2321; --warn: #ffc46b; --warn-soft: #3a2c14; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #131916; --surface: #1b2420; --fg: #e5ebe6; --muted: #9db0a5; --line: #2c3a33; --line2: #41534a;
  --accent: #6fcfb0; --accent-ink: #0f1f19; --accent-soft: #1d3a31;
  --ok: #7bd389; --ok-soft: #1e3525; --bad: #ff8f85; --bad-soft: #3d2321; --warn: #ffc46b; --warn-soft: #3a2c14; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: "Nunito", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
[hidden] { display: none !important; }
button, input, select { font: inherit; }
.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .in { max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { white-space: nowrap; }
.back { margin-left: auto; font-size: .88rem; font-weight: 700; color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; }
.wrap { max-width: 860px; margin: 0 auto; padding: 16px 16px 120px; }
h1 { font-size: 1.45rem; margin: 6px 0 4px; line-height: 1.25; }
h2.part { font-size: 1.15rem; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--accent); }
.muted { color: var(--muted); } .small { font-size: .88rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
.btn { border: 1px solid var(--line2); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:focus-visible, .in-t:focus-visible, select:focus-visible, .opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.exh { display: flex; gap: 10px; align-items: flex-start; }
.num { flex: 0 0 auto; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 15px; background: var(--accent); color: var(--accent-ink); font-weight: 800; display: flex; align-items: center; justify-content: center; }
.ttl { flex: 1; min-width: 0; } .ttl b { font-size: 1.02rem; } .ttl .vi { display: block; color: var(--muted); font-size: .9rem; }
.pts { flex: 0 0 auto; font-size: .8rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.pts.done { color: var(--fg); font-weight: 800; }
.audio { margin: 10px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.audio audio { width: 100%; max-width: 420px; }
.bank { display: flex; flex-wrap: wrap; gap: 6px 14px; background: var(--accent-soft); padding: 8px 12px; border-radius: 10px; margin: 10px 0; font-weight: 700; }
.eg { margin: 8px 0 2px; color: var(--muted); font-size: .95rem; }
.eg b { color: var(--accent); }
.passage { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 10px 0; white-space: pre-line; line-height: 1.7; }
.passage h4 { margin: 0 0 4px; }
.item { display: grid; grid-template-columns: 1.8em minmax(0, 1fr); gap: 4px 6px; padding: 10px 0; border-top: 1px dashed var(--line); }
.item .n { font-weight: 800; color: var(--muted); padding-top: 2px; }
.q { margin-bottom: 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.opt { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line2); border-radius: 10px; padding: 6px 12px; cursor: pointer; background: var(--surface); }
.opt input { accent-color: var(--accent); margin: 0; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); } .opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.in-t { padding: 8px 10px; border: 1.5px solid var(--line2); border-radius: 8px; background: var(--surface); color: var(--fg); width: 100%; font-size: 1rem; }
.in-t.gap { width: 9em; display: inline-block; padding: 4px 8px; margin: 2px; }
select.in-t { width: auto; max-width: 100%; }
.in-t.ok { border-color: var(--ok); background: var(--ok-soft); } .in-t.bad { border-color: var(--bad); background: var(--bad-soft); }
.words { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--line2); padding: 0 4px; margin: 0 2px; font-weight: 700; color: var(--accent); text-align: center; }
.words span { border: 1px dashed var(--line2); border-radius: 6px; padding: 2px 8px; font-weight: 700; }
.fb { font-size: .9rem; color: var(--muted); margin-top: 6px; border-left: 3px solid var(--line2); padding-left: 8px; }
.fb .a { color: var(--ok); font-weight: 800; } .fb .x { color: var(--bad); font-weight: 800; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.bar .in { max-width: 860px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.confirm { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 10px; padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score .big { font-size: 2.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.band { font-weight: 800; font-size: 1.1rem; }
table.t { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: .93rem; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; }
table.t td.r, table.t th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pbar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; min-width: 60px; }
.pbar i { display: block; height: 100%; background: var(--accent); }
.pbar i.low { background: var(--bad); } .pbar i.mid { background: var(--warn); }
.speak li { margin: 4px 0; }
.rub { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
.hist li { margin: 3px 0; }
@media (max-width: 480px) { .in-t.gap { width: 7.5em; } .brand { font-size: .9rem; } .back { font-size: .8rem; padding: 3px 9px; } .top .in { padding: 8px 12px; gap: 6px; } }
</style>

<script>
const DATA = {"pageTitle":"Kiểm tra FaF3 Units 1–13 · Đề 4","brand":"Family and Friends 3 · Units 1–13 · Đề 4","storageKey":"faf3-test-u1-13-de4-v1","exportName":"ket-qua-faf3-u1-13-de4.json","audioDir":"faf3-de4","outFile":"faf3-kiem-tra-u1-13-de4.html","title":"Bài kiểm tra Family and Friends 3 · Units 1–13 · Đề 4","subtitle":"Listening · Vocabulary & Phonics · Grammar · Reading · Writing — 100 điểm, khoảng 70 phút","instructions":["Làm lần lượt từ trên xuống. Phần nghe: bấm ▶ để nghe, mỗi bài nghe 2 lần.","Đề này có nhiều câu phải TỰ VIẾT (từ, cụm từ hoặc cả câu). Đọc kỹ đề trước khi viết.","Bài viết: chữ hoa hay chữ thường đều được; viết tắt (didn't) hay viết đầy đủ (did not) đều được.","Làm xong bấm «Nộp bài» ở dưới cùng. Bài đang làm được tự lưu trên máy này."],"parts":{"A":"Part A · Listening (25 điểm)","B":"Part B · Vocabulary & Phonics (20 điểm)","C":"Part C · Grammar (28 điểm)","D":"Part D · Reading (15 điểm)","E":"Part E · Writing (12 điểm)"},"unitTitles":{"1":"They're from Australia!","2":"My weekend","3":"My things","4":"We're having fun at the beach!","5":"A naughty monkey!","6":"Jim's day","7":"Places to go!","8":"I'd like a melon!","9":"What's the fastest animal in the world?","10":"In the park!","11":"In the museum","12":"A clever baby!","13":"The Ancient Egyptians"},"bands":[{"min":85,"label":"Giỏi","advice":"Nắm vững kiến thức Units 1–13. Có thể học tiếp Units 14–15."},{"min":70,"label":"Khá","advice":"Nắm được phần lớn kiến thức. Ôn lại các unit có thanh màu cam/đỏ trước khi học tiếp."},{"min":50,"label":"Trung bình","advice":"Còn hổng một số mảng. Ôn lại từng unit yếu (bảng dưới), làm lại bài sau 1 tuần."},{"min":0,"label":"Cần ôn lại","advice":"Cần ôn lại từ vựng và ngữ pháp cơ bản theo từng unit trước khi học tiếp."}],"audioSources":{"t014.mp3":"../../faf/audio/Family and Friends 3 CD1_2/CD_1/Track 14.mp3","t063.mp3":"../../faf/audio/Family and Friends 3 CD1_2/CD_2/Track 16.mp3","t095.mp3":"../../faf/audio/Family and Friends 3 Class CD3/Track 08.mp3","t131.mp3":"../../faf/audio/Family and Friends 3 Class CD3/Track 44.mp3"},"exercises":[{"id":"A1","part":"A","type":"text","audio":"audio/faf3-de4/t014.mp3","title":"Listen to Katie. Write a word or choose the correct answer.","vi":"Nghe bạn Katie trả lời câu hỏi. Viết MỘT từ (hoặc số) vào chỗ trống, hoặc chọn đáp án đúng. Trong băng có câu lệnh và số thứ tự của sách («Listen and tick…», «Number 1…») — con không cần làm theo, chỉ trả lời câu hỏi trên màn hình.","items":[{"q":"Katie is ___ years old.","accept":["eight","8"],"unit":1,"level":1,"why":"\"How old are you, Katie?\" – \"I'm eight.\""},{"q":"Katie's birthday is in ___. (Write the month.)","accept":["March"],"unit":1,"level":2,"why":"\"When's your birthday?\" – \"It's in spring.\" – \"Which month?\" – \"My birthday is in March.\" Chính tả: M-a-r-c-h.","trap":{"spring":"spring là MÙA (mùa xuân). Đề hỏi tên THÁNG: March.","May":"Katie nói March (tháng Ba), không phải May (tháng Năm).","Marh":"Thiếu chữ c: M-a-r-c-h."}},{"type":"mcq","q":"Where is Katie from?","options":["the UK","the USA","Spain"],"answer":1,"unit":1,"level":2,"why":"\"Are you from the UK, Katie?\" – \"No, I'm not.\" – \"Where are you from?\" – \"I'm from the USA, but my mum and dad are from Spain.\"","trap":{"0":"Người hỏi đoán «from the UK», nhưng Katie trả lời «No, I'm not».","2":"Spain là nơi BỐ MẸ Katie đến từ (my mum and dad are from Spain). Katie đến từ the USA."}},{"type":"kw","q":"Why doesn't Katie like winter?","kw":[["cold"]],"model":"Because it's cold in winter.","unit":1,"level":2,"why":"\"I don't like winter. It's cold in winter.\" Chỉ cần ý: trời lạnh (cold).","trap":{"Because it's hot.":"hot (nóng) là mùa hè — mùa Katie THÍCH. Mùa đông thì lạnh: cold."}},{"type":"mcq","q":"Which sentence is NOT true?","options":["Katie's birthday is in spring.","Katie's mum and dad are from the USA.","Katie's favourite season is summer."],"answer":1,"unit":1,"level":3,"why":"Katie đến từ the USA, nhưng bố mẹ bạn ấy đến từ Spain → câu «mum and dad are from the USA» là câu SAI.","trap":{"0":"Câu này ĐÚNG: \"It's in spring\" (sinh nhật vào mùa xuân). Đề hỏi câu KHÔNG đúng.","2":"Câu này ĐÚNG: \"My favourite season is summer.\" Đề hỏi câu KHÔNG đúng."}}]},{"id":"A2","part":"A","type":"text","audio":"audio/faf3-de4/t063.mp3","title":"Listen to the interview. Write one word or choose the correct answer.","vi":"Nghe một bạn nhỏ trả lời phỏng vấn về những nơi bạn ấy hay đi. Viết MỘT từ vào chỗ trống, hoặc chọn đáp án đúng. Trong băng có câu lệnh và số thứ tự của sách («Listen and tick…», «Number 1…») — con không cần làm theo, chỉ trả lời câu hỏi trên màn hình.","items":[{"q":"\"Do you ever go to the cinema?\" \"Yes, I ___ go to the cinema with my dad.\"","accept":["sometimes"],"unit":7,"level":2,"why":"\"Yes, I sometimes go to the cinema with my dad.\" (sometimes = thỉnh thoảng).","trap":{"always":"Băng nói sometimes (thỉnh thoảng), không phải always (luôn luôn).","never":"Bạn ấy có đi xem phim («Yes, …») → không thể là never.","sometime":"Cần có s ở cuối: sometimes."}},{"q":"\"Do you ever go to concerts?\" \"No, I don't. I ___ go to concerts.\"","accept":["never"],"unit":7,"level":2,"why":"\"No, I don't. I never go to concerts.\" (never = không bao giờ).","trap":{"sometimes":"Bạn ấy trả lời «No, I don't» → không bao giờ đi: never.","always":"Bạn ấy trả lời «No, I don't» → never."}},{"q":"\"Do you like sports?\" \"Yes, I do. I like football and ___.\"","accept":["basketball","basket ball"],"unit":7,"level":1,"why":"\"I like football and basketball.\"","trap":{"volleyball":"Băng nói basketball (bóng rổ), không phải volleyball.","basketbal":"ball có hai chữ l: basketball."}},{"q":"\"I go to the sports centre every ___.\"","accept":["Saturday"],"unit":7,"level":2,"why":"\"I go to the Sports Centre every Saturday.\" Chính tả: S-a-t-u-r-d-a-y.","trap":{"Sunday":"Băng nói Saturday (thứ Bảy), không phải Sunday.","Saturdays":"Sau every dùng số ít: every Saturday.","Saterday":"Chính tả: Sat-ur-day."}},{"type":"mcq","q":"Which place does the child NEVER go to?","options":["the cinema","the library","the shopping mall"],"answer":1,"unit":7,"level":2,"why":"\"Do you ever go to the library?\" – \"No, I don't. I never go to the library.\"","trap":{"0":"Bạn ấy THỈNH THOẢNG đi xem phim với bố (sometimes).","2":"Bạn ấy THỈNH THOẢNG đi trung tâm mua sắm với mẹ (sometimes)."}},{"q":"\"I sometimes go to the shopping mall with my ___.\"","accept":["mum","mom","mother"],"unit":7,"level":1,"why":"\"I sometimes go to the shopping mall with my mum.\"","trap":{"dad":"Đi xem phim với bố (dad); đi trung tâm mua sắm với mẹ (mum)."}},{"type":"mcq","q":"Which sentence is true?","options":["The child likes reading.","The child likes music.","The child goes to the library on Saturdays."],"answer":1,"unit":7,"level":3,"why":"\"I never go to concerts. But I like music.\" → bạn ấy không đi hòa nhạc nhưng VẪN thích âm nhạc.","trap":{"0":"\"Do you like reading?\" – \"No, I don't.\" → bạn ấy KHÔNG thích đọc sách.","2":"\"I never go to the library.\" Thứ Bảy bạn ấy đến Sports Centre."}},{"type":"kw","q":"What does the child think about the shopping mall?","kw":[["boring"]],"model":"It's boring.","unit":7,"level":2,"why":"\"I sometimes go to the shopping mall with my mum. It's boring!\" (boring = chán).","trap":{"It's great.":"Băng nói «It's boring!» (chán), không phải great."}}]},{"id":"A3","part":"A","type":"text","audio":"audio/faf3-de4/t095.mp3","title":"Listen to Emma and her friend. Write one word or answer the questions.","vi":"Nghe Emma và bạn nói chuyện về người Viking (Vikings) ngày xưa. Viết MỘT từ vào chỗ trống, trả lời ngắn, hoặc chọn đáp án đúng. Trong băng có câu lệnh và số thứ tự của sách («Listen and tick…», «Number 1…») — con không cần làm theo, chỉ trả lời câu hỏi trên màn hình.","items":[{"q":"Emma is writing about the Vikings for her ___.","accept":["homework"],"unit":11,"level":1,"why":"\"What are you doing?\" – \"I'm doing my homework. I'm writing about the Vikings.\""},{"q":"There were lots of farms, so lots of Vikings were ___.","accept":["farmers"],"unit":11,"level":2,"why":"\"There were lots of farms. So lots of Vikings were farmers.\" (farmer = nông dân).","trap":{"farmer":"lots of Vikings (nhiều người) → số nhiều: farmers.","farms":"farms là trang trại. NGƯỜI làm ở trang trại là farmers."}},{"type":"kw","q":"Why weren't there any schools in Viking times?","kw":[["work","working","worked","no time","busy","farm","farms"]],"model":"Because there was lots of work to do on the farms.","unit":11,"level":3,"why":"\"There was lots of work to do on the farms. So there was no time for children to go to school.\" Chỉ cần ý: nhiều việc ở trang trại / không có thời gian (work, no time, busy, farms).","trap":{"Because there weren't any teachers.":"Băng không nói về giáo viên. Lý do: có rất nhiều việc ở trang trại (lots of work), trẻ con không có thời gian đi học."}},{"q":"There was lots of ___ and fish.","accept":["meat"],"unit":11,"level":1,"why":"\"Do you know about food in Viking times?\" – \"Yes. There was lots of meat and fish.\"","trap":{"bread":"Băng nói meat (thịt) and fish."}},{"type":"mcq","q":"Which sentence about Viking houses is NOT true?","options":["There was only one room in most houses.","There were kitchens in the houses.","There was a fire for cooking."],"answer":1,"unit":11,"level":3,"why":"\"There weren't any kitchens in Viking houses.\" → câu «There were kitchens» là câu SAI.","trap":{"0":"Câu này ĐÚNG: \"there was only one room in most houses\". Đề hỏi câu KHÔNG đúng.","2":"Câu này ĐÚNG: \"there was a fire in the middle of the room for cooking\". Đề hỏi câu KHÔNG đúng."}},{"q":"There were cows, sheep and ___.","accept":["chickens"],"unit":11,"level":2,"why":"\"There were cows, sheep and chickens.\" Nhiều con gà → chickens (có s).","trap":{"chicken":"Băng nói chickens (nhiều con gà, có s): cows, sheep and chickens.","horses":"Băng nói cows, sheep and chickens — không có horses."}}]},{"id":"A4","part":"A","type":"mcq","audio":"audio/faf3-de4/t131.mp3","title":"Listen to the story about Simon. Choose or write the answer.","vi":"Nghe đoạn nói về bạn Simon. Chọn đáp án đúng, hoặc viết câu trả lời. Trong băng có câu lệnh của sách «Skills test 1, exercise 2. Listen and tick» — con không cần làm theo, chỉ trả lời câu hỏi trên màn hình.","items":[{"q":"Where does Simon live now?","options":["in New York","in London","in the countryside"],"answer":1,"unit":1,"level":2,"why":"\"Simon is from New York, but he lives in London now.\"","trap":{"0":"New York là nơi Simon đến từ (is from). Bây giờ (now) bạn ấy sống ở London.","2":"Simon MUỐN sống ở nông thôn (would like to live …), nhưng bây giờ bạn ấy sống ở London."}},{"type":"text","q":"Simon ___ football very much.","accept":["likes"],"unit":2,"level":2,"why":"\"He also likes football very much.\" Simon = he → likes (thêm -s).","trap":{"like":"Simon = he → likes (thêm -s).","loves":"Trong băng nói likes. Viết đúng từ nghe được: likes.","doesn't like":"Simon thích bóng đá: \"He also likes football very much.\" Simon chỉ không thích thành phố lớn."}},{"q":"Where would Simon like to live?","options":["in a big city","in the countryside","in New York"],"answer":1,"unit":8,"level":2,"why":"\"He … would like to live in the countryside.\" (countryside = vùng nông thôn).","trap":{"0":"Simon KHÔNG thích thành phố lớn (doesn't like big cities).","2":"New York là nơi Simon đến từ; bạn ấy muốn sống ở nông thôn."}},{"type":"kw","q":"Simon doesn't like big cities. Why does he like London?","kw":[["park","parks"]],"model":"Because there are a lot of parks.","unit":2,"level":3,"why":"\"But he likes London because there are a lot of parks.\" — sau because là lý do: parks.","trap":{"Because there are a lot of football teams.":"Câu về các đội bóng nói rằng Simon thích BÓNG ĐÁ. Câu có because nói lý do thích London: «because there are a lot of parks»."}},{"type":"text","q":"A lot of Simon's friends like Manchester United. This team plays in ___.","accept":["red"],"unit":1,"level":1,"why":"\"A lot of his friends like Manchester United. They play in red.\"","trap":{"blue":"blue là màu của đội Chelsea (đội Simon thích). Manchester United mặc màu đỏ: red."}},{"q":"Why does Simon like Chelsea?","options":["Chelsea's colour is blue.","Simon's friends like Chelsea.","Chelsea is a team from New York."],"answer":0,"unit":2,"level":2,"why":"\"He likes Chelsea because their colour is blue. Blue is his favourite colour.\"","trap":{"1":"Bạn bè Simon thích đội KHÁC (Manchester United).","2":"Băng nói Chelsea là một đội bóng ở London, không nói New York."}}]},{"id":"B1","part":"B","type":"text","title":"Read and complete the text with the words in the box.","vi":"Đọc bài. Viết từ trong khung vào chỗ trống (1)–(6). Mỗi từ dùng một lần. Có 3 từ thừa.","passageTitle":"A day with my aunt","passage":"Last month, I visited my aunt in the city. First, we walked along the river and looked at the old (1) ________ over the water. It is two hundred years old!\n\nNext to the river, there was lots of (2) ________: old bottles, paper and bags. My aunt and I cleaned it up.\n\nMy aunt's dog, Rocky, saw some birds near the water. He wanted to (3) ________ them, but my aunt shouted, \"No, Rocky! Stop!\"\n\nThe water in the river isn't clean. It's (4) ________, so people mustn't swim in it.\n\nAt lunchtime, we had pizza at a café. An old man at the next table was very hungry, so my aunt got a pizza for him, too. She's very (5) ________!\n\nOn the bus home, a little boy wanted to say hello to us, but he was very (6) ________. He looked at his mum and didn't say anything.","bank":["bridge","litter","chase","polluted","generous","shy","lake","cross","mean"],"items":[{"q":"(1) We looked at the old ___ over the water.","accept":["bridge"],"unit":9,"level":1,"why":"Cái cầu bắc QUA mặt nước (over the water) → bridge.","trap":{"lake":"lake (hồ) cũng là danh từ, nhưng «cái hồ bắc qua mặt nước» không có nghĩa. Thứ bắc qua sông là bridge.","fountain":"Đài phun nước không bắc qua sông. Qua sông là bridge (cầu).","*":"Thứ cũ, nằm bắc qua mặt nước (over the water) → bridge."}},{"q":"(2) Next to the river, there was lots of ___: old bottles, paper and bags.","accept":["litter"],"unit":10,"level":2,"why":"Chai cũ, giấy, túi vứt bừa bên sông = rác: litter.","trap":{"lake":"lake (hồ) không phải chai, giấy, túi. Đọc phần sau dấu hai chấm: old bottles, paper and bags → litter (rác).","bridge":"Cầu không phải chai, giấy, túi → litter.","polluted":"polluted là tính từ (bị ô nhiễm), dùng cho câu (4). «lots of ___» cần danh từ: litter.","*":"Chai cũ, giấy, túi = rác → litter."}},{"q":"(3) Rocky saw some birds. He wanted to ___ them.","accept":["chase"],"unit":10,"level":2,"why":"Con chó muốn ĐUỔI THEO lũ chim → chase. (want to + động từ nguyên mẫu.)","trap":{"cross":"cross cũng là động từ, nhưng cross = đi qua (cross the river). «Đi qua con chim» không có nghĩa. Đuổi theo → chase.","*":"Sau want to cần động từ; con chó muốn ĐUỔI THEO chim → chase."}},{"q":"(4) The water in the river isn't clean. It's ___.","accept":["polluted"],"unit":4,"level":2,"why":"isn't clean (không sạch) → polluted (bị ô nhiễm), nên không được bơi.","trap":{"mean":"mean (keo kiệt) dùng để tả NGƯỜI, không tả nước sông.","shy":"shy (nhút nhát) dùng để tả người. Nước không sạch → polluted.","generous":"generous (hào phóng) tả người. Nước không sạch → polluted.","*":"Nước không sạch (isn't clean) → polluted.","litter":"litter là danh từ (rác). «It's ___» nói nước sông thế nào → tính từ polluted (bị ô nhiễm)."}},{"q":"(5) My aunt got a pizza for a hungry old man, too. She's very ___!","accept":["generous"],"unit":12,"level":3,"why":"Dì mua thêm pizza cho một ông cụ đói (người lạ) → rất hào phóng: generous.","trap":{"mean":"mean (keo kiệt) có nghĩa NGƯỢC LẠI. Người mua đồ ăn cho người khác là generous.","shy":"shy (nhút nhát) không liên quan đến việc mua pizza cho ông cụ → generous.","*":"Mua đồ ăn cho người khác → generous (hào phóng)."}},{"q":"(6) A little boy wanted to say hello, but he was very ___.","accept":["shy"],"unit":12,"level":2,"why":"Muốn chào nhưng lại chỉ nhìn mẹ, không nói gì → nhút nhát: shy.","trap":{"mean":"mean = keo kiệt. Cậu bé MUỐN chào nhưng không dám nói → shy (nhút nhát).","generous":"generous = hào phóng, không hợp với «không dám nói gì» → shy.","*":"Muốn chào nhưng không dám nói → shy."}}]},{"id":"B2","part":"B","type":"text","title":"Read and write the word. The first letter is there to help you.","vi":"Đọc câu và viết cả từ còn thiếu (chữ cái đầu đã cho sẵn; mỗi gạch là một chữ cái).","items":[{"q":"A l _ _ _ _ _ is a small green or brown animal. It likes sitting on hot stones in the sun.","accept":["lizard","izard"],"unit":5,"level":2,"why":"lizard = con thằn lằn (6 chữ cái: l-i-z-a-r-d).","trap":{"lizzard":"lizard chỉ có MỘT chữ z: l-i-z-a-r-d.","lion":"lion không phải con vật nhỏ, và có 4 chữ cái. Con vật nhỏ phơi nắng trên đá → lizard."}},{"q":"When my mum cuts an o _ _ _ _, she cries!","accept":["onion","nion"],"unit":8,"level":2,"why":"Cắt hành tây làm cay mắt, chảy nước mắt → onion (o + 4 chữ cái).","trap":{"onoin":"Chính tả: o-n-i-o-n.","onions":"Có «an» → một củ: onion. Và chỉ có 5 chữ cái.","orange":"orange có 6 chữ cái và cắt cam không làm chảy nước mắt → onion."}},{"q":"I've got thirty p _ _ _ _ _ _ _ _ from my holidays. They have pictures of beaches and mountains on them.","accept":["postcards","ostcards"],"unit":3,"level":3,"why":"postcards = bưu thiếp (có tranh ảnh nơi mình đi chơi). thirty (30) → số nhiều: postcards (9 chữ cái).","trap":{"postcard":"thirty (30) → số nhiều: postcards.","posters":"posters (áp phích) có 7 chữ cái; tấm thiếp từ chuyến đi chơi là postcards (9 chữ cái)."}},{"q":"The clown at the party yesterday was very funny. Everybody l _ _ _ _ _ _ a lot.","accept":["laughed","aughed"],"unit":13,"level":3,"why":"laugh = cười. yesterday → quá khứ: laugh + ed = laughed (7 chữ cái).","trap":{"laugh":"yesterday → quá khứ: laughed.","laughs":"yesterday → quá khứ: laughed.","laught":"laugh + ed → laughed (l-a-u-g-h-e-d).","laughted":"laugh chỉ thêm ed: laughed."}},{"q":"I don't go to school at the w _ _ _ _ _ _. I stay at home and play with my brother.","accept":["weekend","eekend"],"unit":6,"level":1,"why":"Không đi học vào cuối tuần: at the weekend (w + 6 chữ cái).","trap":{"wekend":"Chính tả: w-e-e-k-e-n-d (hai chữ e).","weekand":"Chính tả: week + end → weekend."}}]},{"id":"B3","part":"B","type":"mcq","title":"Phonics. Choose the correct letters or word.","vi":"Chọn chữ cái đúng để hoàn thành từ, hoặc chọn từ theo yêu cầu về âm.","items":[{"q":"Which word has the same sound as 'ow' in 'elbow'?","options":["cow","nose","hot"],"answer":1,"unit":13,"level":3,"why":"elbow có âm /əʊ/ (như snow, show). nose (o_e) cũng đọc /əʊ/ — khác cách viết nhưng cùng âm.","trap":{"0":"cow viết ow nhưng đọc /aʊ/ (như clown, house) — khác âm với elbow.","2":"hot có o ngắn /ɒ/, không phải /əʊ/."}},{"q":"s _ _ l (plants grow in it)","options":["oy","oi","ow"],"answer":1,"unit":6,"level":2,"why":"soil (đất trồng cây) viết oi — như coin, oil.","trap":{"0":"oy cũng đọc /ɔɪ/ nhưng thường đứng CUỐI từ (boy, toy). Giữa từ viết oi: soil.","2":"ow đọc như cow hoặc snow — «sowl» không phải là từ."}},{"q":"_ _ oon (you eat soup with it)","options":["sp","sn","dr"],"answer":0,"unit":1,"level":2,"why":"Cái thìa: spoon (sp).","trap":{"1":"snoon không phải từ. Ăn súp bằng spoon.","2":"droon không phải từ. Ăn súp bằng spoon."}},{"q":"Which word has the same sound at the END as 'pond'?","options":["tent","sand","lamp"],"answer":1,"unit":9,"level":3,"why":"pond kết thúc bằng nd /nd/; sand cũng kết thúc bằng nd.","trap":{"0":"tent kết thúc bằng nt /nt/, khác nd.","2":"lamp kết thúc bằng mp /mp/, khác nd."}},{"q":"f _ _ ld (cows and sheep eat grass there)","options":["ee","ei","ie"],"answer":2,"unit":8,"level":2,"why":"Cánh đồng: field — viết ie, như shield.","trap":{"0":"feeld sai chính tả. Viết ie: field.","1":"feild sai chính tả: i đứng trước e → field."}}]},{"id":"B4","part":"B","type":"mcq","title":"Read and choose the best word.","vi":"Đọc câu và chọn từ hợp nghĩa nhất.","items":[{"q":"We opened the door of the bird's house. Now the bird can fly away. It's ___!","options":["free","sorry","kind"],"answer":0,"unit":5,"level":2,"why":"Mở cửa, chim bay đi được → được tự do: free.","trap":{"1":"sorry = xin lỗi / tiếc. Chim bay đi được là được tự do → free.","2":"kind = tốt bụng. Câu nói con chim bay đi được → free."}},{"q":"Grace loves art. She likes ___ pictures of flowers.","options":["painting","cooking","shopping"],"answer":0,"unit":2,"level":1,"why":"Thích môn vẽ (art), vẽ tranh hoa → painting pictures.","trap":{"1":"cooking = nấu ăn; không ai «nấu» tranh. Vẽ tranh → painting.","2":"shopping = mua sắm; câu nói về môn vẽ (art) → painting."}},{"q":"Where's the cat? Oh, I can see it. It's ___ the box!","options":["inside","along","through"],"answer":0,"unit":11,"level":1,"why":"inside = ở bên trong: con mèo ở trong cái hộp.","trap":{"1":"along = dọc theo (walk along the river). Không nói «dọc theo cái hộp».","2":"through = xuyên qua (go through a door). Con mèo đang Ở trong hộp → inside."}},{"q":"Riding a bike is very ___ for my big brother. He can ride with no hands!","options":["easy","difficult","heavy"],"answer":0,"unit":13,"level":2,"why":"Đạp xe không cần tay → với anh ấy việc đó rất dễ: easy.","trap":{"1":"difficult (khó) ngược nghĩa: anh ấy giỏi đến mức không cần tay → easy.","2":"heavy (nặng) tả đồ vật, không tả việc làm dễ hay khó."}}]},{"id":"C1","part":"C","type":"mcq","title":"Choose the correct answer.","vi":"Chọn đáp án đúng.","items":[{"q":"My cousins ___ from Russia, and my aunt ___ from Spain.","options":["are … is","is … are","are … are"],"answer":0,"unit":1,"level":2,"why":"My cousins (nhiều người) → are; my aunt (một người) → is.","trap":{"1":"Ngược rồi: cousins số nhiều → are; aunt số ít → is.","2":"my aunt là MỘT người → is, không dùng are."}},{"q":"Zoe's brothers ___ playing chess. They like playing football.","options":["doesn't like","don't like","aren't like"],"answer":1,"unit":2,"level":2,"why":"Zoe's brothers = they (số nhiều) → don't like + V-ing.","trap":{"0":"doesn't dùng cho một người (he/she); brothers là số nhiều → don't like.","2":"like là động từ thường → phủ định bằng don't, không dùng aren't."}},{"q":"First, I get up. ___, I have a shower. Finally, I have breakfast.","options":["Then","Finally","First"],"answer":0,"unit":6,"level":1,"why":"Thứ tự: First (đầu tiên) → Then (sau đó) → Finally (cuối cùng).","trap":{"1":"Finally dùng cho việc CUỐI CÙNG (đã có ở câu sau). Ở giữa dùng Then.","2":"First đã dùng cho việc đầu tiên. Ở giữa dùng Then."}},{"q":"Grace is tall, but Fiona is ___ girl in our class.","options":["taller","the tallest","tallest"],"answer":1,"unit":9,"level":3,"why":"«… girl in our class» (trong cả lớp) → so sánh nhất: the tallest.","trap":{"0":"taller đi với than (taller than Grace). Câu có «in our class» → the tallest.","2":"So sánh nhất cần the: the tallest girl."}},{"q":"Your hands are very dirty. You ___ wash them before lunch.","options":["must","mustn't","can't"],"answer":0,"unit":10,"level":1,"why":"Tay bẩn → PHẢI rửa: must.","trap":{"1":"mustn't = không được. Tay bẩn thì phải rửa → must.","2":"can't = không thể / không được. Tay bẩn thì phải rửa → must."}},{"q":"Look at this old photo of my dad and my uncle. They ___ very handsome when they ___ young.","options":["were … were","was … were","were … was"],"answer":0,"unit":12,"level":2,"why":"They (bố và chú, hai người) → were ở cả hai chỗ: They were handsome … when they were young.","trap":{"1":"They là số nhiều → were, không dùng was.","2":"«when they ___ young»: chủ ngữ vẫn là they → were."}},{"q":"Ella ___ her book last night because she was very tired. She went to bed early.","options":["didn't finish","wasn't finish","didn't finished"],"answer":0,"unit":13,"level":2,"why":"Phủ định quá khứ của động từ thường: didn't + động từ nguyên mẫu → didn't finish.","trap":{"1":"finish là động từ thường → dùng didn't, không dùng wasn't.","2":"Sau didn't động từ giữ nguyên, không thêm -ed: didn't finish."}},{"q":"In my grandpa's town, there ___ a cinema, but there were two theatres.","options":["wasn't","weren't","didn't"],"answer":0,"unit":11,"level":3,"why":"a cinema (một rạp, số ít) → there wasn't. «but there were two theatres» → không có rạp phim, nhưng có hai nhà hát.","trap":{"1":"weren't dùng với danh từ số nhiều (weren't any cinemas). a cinema là số ít → wasn't.","2":"Cấu trúc là there was / there wasn't, không dùng «there didn't»."}}]},{"id":"C2","part":"C","type":"text","title":"Write the correct form of the word in brackets.","vi":"Viết dạng đúng của từ trong ngoặc (có thể cần 1–2 từ).","items":[{"q":"Do your friends like ___ (dive)?","accept":["diving","to dive"],"unit":4,"level":2,"why":"like + V-ing: dive bỏ e rồi thêm -ing → diving. (like to dive cũng đúng.)","trap":{"diveing":"dive tận cùng bằng e → bỏ e rồi thêm -ing: diving.","dive":"Sau like dùng V-ing: diving.","dives":"Sau like dùng V-ing: diving.","divving":"Không gấp đôi v: diving."}},{"q":"\"Is this your sister's camera?\" \"Yes, it's ___ (she) camera.\"","accept":["her"],"unit":3,"level":2,"why":"she → her (của cô ấy) đứng trước danh từ: her hat.","trap":{"she":"Trước danh từ (hat) dùng tính từ sở hữu: her.","hers":"hers đứng MỘT MÌNH (It's hers). Trước danh từ hat dùng her.","she's":"she's = she is. «Của cô ấy» là her.","his":"his = của anh ấy / cậu ấy. Chị/em gái → her.","your":"your = của bạn. Đang nói về chị/em gái → her."}},{"q":"Look! The boys ___ (snorkel) in the sea.","accept":["are snorkelling","are snorkeling"],"unit":4,"level":3,"why":"Look! → đang xảy ra: are + V-ing. The boys = they → are snorkelling.","trap":{"is snorkelling":"The boys là số nhiều → are.","snorkelling":"Thiếu are: The boys are snorkelling.","are snorkel":"Sau are dùng V-ing: snorkelling.","snorkel":"Look! → đang xảy ra: are snorkelling.","do snorkelling":"Không dùng do với V-ing: are snorkelling."}},{"q":"Ruby ___ (do) gymnastics every Tuesday.","accept":["does"],"unit":6,"level":3,"why":"every Tuesday → thói quen. Ruby = she → do thêm -es: does.","trap":{"do":"Ruby = she → do thêm -es: does.","dos":"do + es → does (d-o-e-s).","is doing":"every Tuesday là thói quen (hiện tại đơn), không phải việc đang làm → does.","did":"every Tuesday là thói quen hằng tuần → hiện tại: does."}},{"q":"This is the ___ (big) shopping mall in our city.","accept":["biggest","the biggest"],"unit":9,"level":2,"why":"the … in our city → so sánh nhất. big → gấp đôi g + est: biggest.","trap":{"bigest":"big có MỘT nguyên âm giữa hai phụ âm → gấp đôi g: biggest.","bigger":"bigger dùng với than. «the … in our city» → biggest.","most big":"Tính từ ngắn thêm -est: biggest."}},{"q":"When I was six, my hair ___ (be) very short.","accept":["was"],"unit":12,"level":3,"why":"my hair (tóc) là danh từ không đếm được → như it: was. «when I was six» → quá khứ.","trap":{"were":"hair (tóc) không đếm được, dùng như it → was.","is":"«when I was six» là quá khứ → was.","had":"had đi với danh từ (I had short hair). Câu này có my hair làm chủ ngữ → my hair was …"}},{"q":"Last summer, we went to Nha Trang. We ___ (love) the beach there!","accept":["loved"],"unit":13,"level":2,"why":"Last summer → quá khứ. love tận cùng bằng e → chỉ thêm -d: loved.","trap":{"loveed":"love đã có e → chỉ thêm -d: loved.","loves":"Last summer → quá khứ: loved.","love":"Last summer → quá khứ, thêm -d: loved.","lovd":"Chính tả: l-o-v-e-d."}},{"q":"Fiona ___ (not / like) the film last night. It was too long.","accept":["didn't like","did not like"],"unit":13,"level":2,"why":"last night → quá khứ phủ định: didn't + like (nguyên mẫu).","trap":{"doesn't like":"last night → quá khứ: didn't like.","didn't liked":"Sau didn't động từ giữ nguyên: like.","wasn't like":"like là động từ thường → phủ định quá khứ là didn't like.","don't like":"last night → quá khứ: didn't like.","not liked":"Thiếu did: didn't like."}}]},{"id":"C3","part":"C","type":"text","pts":2,"title":"Read the answer. Write the question.","vi":"Đọc câu trả lời, viết câu hỏi bắt đầu bằng từ trong ngoặc.","example":"My bag is red. (What colour …?) → \u003cb>What colour is your bag?\u003c/b>","items":[{"q":"Oscar has got fifty badges. (How many …?)","accept":["How many badges has Oscar got","How many badges has he got","How many badges does Oscar have","How many badges does he have"],"unit":3,"level":3,"why":"has got → câu hỏi đưa has lên trước chủ ngữ: How many badges + has + Oscar + got?","trap":{"How many badges Oscar has got":"Câu hỏi phải đưa has lên TRƯỚC Oscar: How many badges has Oscar got?","How many badges have Oscar got":"Oscar = he → has.","How many badges is Oscar got":"has got → hỏi bằng has, không dùng is.","How many badges does Oscar has":"Sau does động từ giữ nguyên: have.","How many badges has Oscar":"Thiếu got: How many badges has Oscar got?","How many badge has Oscar got":"How many + danh từ số nhiều: badges."}},{"q":"The monkey is sitting in the tree. (Where …?)","accept":["Where is the monkey sitting","Where is it sitting"],"unit":5,"level":3,"why":"Hiện tại tiếp diễn: Where + is + the monkey + sitting?","trap":{"Where the monkey is sitting":"Câu hỏi phải đưa is lên trước the monkey: Where is the monkey sitting?","Where does the monkey sitting":"does không đi với V-ing; dùng is: Where is the monkey sitting?","Where is the monkey sit":"Sau is … dùng V-ing: sitting.","Where are the monkey sitting":"the monkey là một con → is.","Where does the monkey sit":"Câu trả lời là «is sitting» (đang ngồi) → hỏi Where is the monkey sitting?"}},{"q":"Peter plays chess with his grandpa on Sundays. (What …?)","accept":["What does Peter do on Sundays","What does Peter do on Sunday","What does Peter do every Sunday","What does Peter do with his grandpa on Sundays","What does Peter do with his grandpa on Sunday","What does Peter do with his grandpa every Sunday","What does Peter do with his grandpa","What does Peter play on Sundays","What does Peter play on Sunday","What does Peter play every Sunday","What does Peter play with his grandpa on Sundays","What does Peter play with his grandpa on Sunday","What does Peter play with his grandpa every Sunday","What does Peter play with his grandpa","What does he do on Sundays","What does he do on Sunday","What does he do every Sunday","What does he do with his grandpa on Sundays","What does he do with his grandpa on Sunday","What does he do with his grandpa every Sunday","What does he do with his grandpa","What does he play on Sundays","What does he play on Sunday","What does he play every Sunday","What does he play with his grandpa on Sundays","What does he play with his grandpa on Sunday","What does he play with his grandpa every Sunday","What does he play with his grandpa","On Sundays, what does Peter do","On Sundays, what does Peter play","On Sundays, what does Peter do with his grandpa"],"unit":6,"level":3,"why":"Hiện tại đơn với he: What + does + Peter + do/play (nguyên mẫu) + on Sundays?","trap":{"What Peter plays on Sundays":"Câu hỏi cần does: What does Peter play on Sundays?","What does Peter plays on Sundays":"Sau does động từ giữ nguyên: play.","What do Peter play on Sundays":"Peter = he → does.","What is Peter play on Sundays":"play là động từ thường → hỏi bằng does, không dùng is.","What does Peter does on Sundays":"Sau does động từ giữ nguyên: do.","What is Peter doing on Sundays":"on Sundays là thói quen (hiện tại đơn) → What does Peter do on Sundays?"}},{"q":"There were three tigers at the zoo last year. (How many …?)","accept":["How many tigers were there at the zoo last year","How many tigers were at the zoo last year","How many tigers were there at the zoo","How many tigers were at the zoo","How many tigers were there in the zoo last year","How many tigers were in the zoo last year","How many tigers were there in the zoo","How many tigers were in the zoo","How many tigers were there last year","How many tigers were there","Last year, how many tigers were there at the zoo","Last year, how many tigers were there in the zoo","Last year, how many tigers were there"],"unit":11,"level":3,"why":"Câu hỏi với there were: How many + tigers + were there + at the zoo + last year?","trap":{"How many tigers there were at the zoo last year":"Câu hỏi phải đảo: were there (không phải there were).","How many tigers was there at the zoo last year":"tigers là số nhiều → were.","How many tigers are there at the zoo last year":"last year → quá khứ: were there.","How many tiger were there at the zoo last year":"Sau How many danh từ số nhiều: tigers.","How many tigers did there at the zoo last year":"Không dùng did với there: How many tigers were there …?"}}]},{"id":"C4","part":"C","type":"mcq","title":"Choose the correct sentence.","vi":"Chọn câu ĐÚNG.","items":[{"options":["Adam sometimes go to the library.","Adam goes sometimes to the library.","Adam sometimes goes to the library."],"answer":2,"unit":7,"level":3,"why":"sometimes đứng TRƯỚC động từ thường; Adam = he → goes: Adam sometimes goes …","trap":{"0":"Adam = he → goes (thêm -es), dù có sometimes ở trước.","1":"sometimes phải đứng trước động từ: sometimes goes."}},{"options":["I'd like two potatoes and some salt, please.","I'd like two potato and some salt, please.","I'd like two potatoes and a salt, please."],"answer":0,"unit":8,"level":2,"why":"two → danh từ số nhiều: potatoes. salt không đếm được → some salt.","trap":{"1":"two (hai) → số nhiều: potatoes.","2":"salt không đếm được → some salt, không dùng a salt."}},{"options":["What the penguins are doing?","What are the penguins doing?","What are the penguins do?"],"answer":1,"unit":5,"level":3,"why":"Câu hỏi hiện tại tiếp diễn: What + are + the penguins + doing?","trap":{"0":"Câu hỏi phải đưa are lên TRƯỚC the penguins.","2":"Sau are … dùng V-ing: doing."}},{"options":["My cousins are sail on the lake now.","My cousins are sailing on the lake now.","My cousins sailing on the lake now."],"answer":1,"unit":4,"level":2,"why":"now → đang xảy ra: are + V-ing: are sailing.","trap":{"0":"Sau are dùng V-ing: are sailing.","2":"Thiếu are: My cousins are sailing."}}]},{"id":"D1","part":"D","type":"tf","title":"Read Hannah's story. Choose True or False.","vi":"Đọc bài viết của Hannah. Chọn True (đúng) hoặc False (sai). Có câu phải suy ra từ bài, không có sẵn y nguyên.","passageTitle":"My week at summer camp","passage":"Hi! I'm Hannah. I'm ten and I live in Manchester with my parents and my little brother, Nick. At home, my dad and I walk to school every morning. I never go swimming, because there isn't a swimming pool in our town.\n\nLast July, I stayed at a summer camp near a big lake for a week. There were forty children at the camp, and my best friend Zara was there, too. She's nine. Zara loves taking photos. She took photos of every bird at the lake!\n\nOn the first night, I was very worried and I wanted to go home. But on the second day, Zara and I played games with lots of other children, and after that I was relaxed and happy.\n\nEvery morning, we got up very early, at six o'clock, and walked round the lake. In the afternoons, we went kayaking. We cooked our dinner on a fire every evening. Zara's pasta was cold! We were busy all day. In the evenings, we were always very tired.\n\nNear the camp, there was a small café, but there weren't any shops. Zara read comics in the café every evening. She's got fifty comics at home!\n\nOn the last night, we danced and played music until ten o'clock. It was great!\n\nI want to go to the camp again next summer, and I'd like my little brother to come with me!","items":[{"q":"Zara is younger than Hannah.","answer":"True","unit":9,"level":3,"why":"\"I'm ten\" (Hannah) và \"She's nine\" (Zara) → Zara nhỏ hơn Hannah: younger → True."},{"q":"At home, Hannah sometimes goes swimming.","answer":"False","unit":7,"level":2,"why":"\"I never go swimming\" → never (không bao giờ), không phải sometimes → False."},{"q":"The camp teachers cooked dinner for the children every evening.","answer":"False","unit":13,"level":3,"why":"\"We cooked our dinner on a fire every evening\" → các bạn nhỏ TỰ nấu, không phải thầy cô → False."},{"q":"There were some shops near the camp.","answer":"False","unit":11,"level":2,"why":"\"there was a small café, but there weren't any shops\" → không có cửa hàng nào → False."}]},{"id":"D2","part":"D","type":"text","title":"Read the story again. Complete the sentences with 1, 2 or 3 words from the story.","vi":"Câu hỏi viết KHÁC bài một chút. Tìm câu trong bài có cùng ý, rồi chép 1–3 từ trong bài vào chỗ trống.","items":[{"q":"At home, Hannah ___ to school with her dad.","accept":["walks"],"unit":6,"level":1,"why":"\"At home, I walk to school with my dad\" → Hannah walks (ngôi thứ ba thêm -s).","trap":{"walk":"Chủ ngữ là Hannah (she) → walks.","walked":"Câu nói về thói quen ở nhà (hiện tại) → walks."}},{"q":"Every afternoon, the children ___ on the lake. (2 words)","accept":["went kayaking"],"unit":4,"level":2,"why":"\"In the afternoons, we went kayaking.\" → went kayaking (chèo thuyền kayak trên hồ).","trap":{"kayaking":"Câu cần 2 từ: went kayaking.","went swimming":"Hannah không bao giờ đi bơi; buổi chiều các bạn went kayaking.","go kayaking":"Chép đúng từ trong bài (chuyện đã qua): went kayaking."}},{"q":"On the last night, the children ___ and played music.","accept":["danced"],"unit":13,"level":2,"why":"\"On the last night, we danced and played music\" → danced.","trap":{"dance":"Câu nói về đêm cuối (đã qua) → danced.","danceed":"dance có e → chỉ thêm -d: danced."}},{"q":"Near the camp, Zara read her comics in a small ___.","accept":["café","cafe"],"unit":11,"level":2,"why":"\"Near the camp, there was a small café … Zara read comics in the café every evening.\" → café.","trap":{"shop":"Gần trại KHÔNG có cửa hàng (there weren't any shops). Zara đọc truyện ở quán café.","lake":"Zara đọc truyện trong quán café, không phải ở hồ."}},{"q":"At home, Zara has got ___ comics.","accept":["fifty","50"],"unit":3,"level":1,"why":"\"She's got fifty comics at home!\" → fifty.","trap":{"fourty":"Chính tả: fifty (50). forty (40) là số trẻ em ở trại.","forty":"forty (40) là số trẻ em ở trại. Zara có fifty (50) truyện tranh."}}]},{"id":"D3","part":"D","type":"kw","pts":2,"title":"Read the story again. Answer the questions.","vi":"Trả lời câu hỏi — viết ngắn (vài từ) cũng được, không cần cả câu.","items":[{"q":"Why were the children always tired in the evenings?","kw":[["busy","walk","walked","walking","kayak","kayaked","kayaking","six","6","early"]],"model":"Because they were very busy every day.","unit":13,"level":3,"why":"Bài không nói thẳng «vì sao». Phải suy ra: các bạn bận cả ngày (\"We were busy all day\": dậy lúc 6 giờ, đi bộ quanh hồ, chèo kayak) → tối rất mệt. Chỉ cần một ý: busy / dậy sớm / đi bộ / chèo kayak.","trap":{"Because they were worried.":"Hannah chỉ lo lắng đêm đầu. Các bạn mệt vì bận cả ngày: busy."}},{"q":"Hannah was worried on the first night. How was she after the second day? Why? (Write two things.)","kw":[["relaxed","happy"],["games","played","friends","children"]],"model":"She was relaxed and happy because she played games with lots of other children.","unit":12,"level":3,"why":"\"On the second day, Zara and I played games with lots of other children, and after that I was relaxed and happy.\" Cần hai ý: thoải mái/vui (relaxed, happy) và lý do: chơi trò chơi với các bạn khác.","trap":{"She was happy.":"Mới có một ý. Cần thêm lý do: vì chơi trò chơi với nhiều bạn khác (played games with other children)."}},{"q":"Next summer, Hannah would like someone to come to the camp with her. What's his name?","kw":[["Nick"]],"model":"Nick (her little brother).","unit":8,"level":3,"why":"\"I'd like my little brother to come with me!\" — đoạn đầu: \"my little brother, Nick\" → Nick. Phải nối hai đoạn mới ra tên.","trap":{"Zara.":"Zara là bạn đã đi trại cùng năm nay. Người Hannah muốn rủ năm sau là em trai: Nick."}}]},{"id":"E1","part":"E","type":"text","pts":2,"title":"Write sentences. Follow the instructions.","vi":"Làm theo yêu cầu của từng câu. Viết thành câu đầy đủ (chữ hoa hay chữ thường đều được).","items":[{"q":"A sign in the park: 🚲🚫 (ride / bikes / here). Write ONE sentence with «You must …» or «You mustn't …».","accept":["You mustn't ride bikes here","You mustn't ride bikes in the park","You mustn't ride bikes in this park","You mustn't ride bikes","Here, you mustn't ride bikes","In the park, you mustn't ride bikes","You mustn't ride a bike here","You mustn't ride a bike in the park","You mustn't ride a bike in this park","You mustn't ride a bike","Here, you mustn't ride a bike","In the park, you mustn't ride a bike","You mustn't ride your bike here","You mustn't ride your bike in the park","You mustn't ride your bike in this park","You mustn't ride your bike","Here, you mustn't ride your bike","In the park, you mustn't ride your bike","You mustn't ride your bikes here","You mustn't ride your bikes in the park","You mustn't ride your bikes in this park","You mustn't ride your bikes","Here, you mustn't ride your bikes","In the park, you mustn't ride your bikes"],"unit":10,"level":2,"why":"Biển có 🚫 → cấm: You mustn't + động từ nguyên mẫu: You mustn't ride bikes here.","trap":{"You mustn't ride bikes at here":"Không viết «at here»: here đứng một mình → You mustn't ride bikes here.","You must ride bikes here":"Biển có 🚫 → mustn't, không phải must.","You mustn't to ride bikes here":"Sau mustn't không có to: You mustn't ride …","You mustn't riding bikes here":"Sau mustn't dùng động từ nguyên mẫu: ride.","You don't must ride bikes here":"Phủ định của must là mustn't: You mustn't ride bikes here.","Don't ride bikes here":"Câu này đúng nghĩa nhưng đề yêu cầu viết với «You must …» hoặc «You mustn't …»: You mustn't ride bikes here.","*":"Biển 🚫 → You mustn't + ride + bikes (here)."}},{"q":"Oscar's diary – Sunday: ✔ paint / a picture   ✘ listen / to music. Write ONE sentence with «but».","accept":["Oscar painted a picture, but he didn't listen to music","Oscar painted a picture, but didn't listen to music","On Sunday, Oscar painted a picture, but he didn't listen to music","On Sunday, Oscar painted a picture, but didn't listen to music","Last Sunday, Oscar painted a picture, but he didn't listen to music","Last Sunday, Oscar painted a picture, but didn't listen to music","Oscar painted a picture on Sunday, but he didn't listen to music","Oscar painted a picture on Sunday, but didn't listen to music","Oscar painted a picture last Sunday, but he didn't listen to music","Oscar painted a picture last Sunday, but didn't listen to music","Oscar painted a picture, but he didn't listen to music on Sunday","Oscar painted a picture, but didn't listen to music on Sunday","Oscar didn't listen to music, but he painted a picture","Oscar didn't listen to music on Sunday, but he painted a picture","Oscar didn't listen to music last Sunday, but he painted a picture","On Sunday, Oscar didn't listen to music, but he painted a picture","He painted a picture, but he didn't listen to music","He painted a picture, but didn't listen to music","On Sunday, he painted a picture, but he didn't listen to music","On Sunday, he painted a picture, but didn't listen to music","Last Sunday, he painted a picture, but he didn't listen to music","Last Sunday, he painted a picture, but didn't listen to music","He painted a picture on Sunday, but he didn't listen to music","He painted a picture on Sunday, but didn't listen to music","He painted a picture last Sunday, but he didn't listen to music","He painted a picture last Sunday, but didn't listen to music","He painted a picture, but he didn't listen to music on Sunday","He painted a picture, but didn't listen to music on Sunday","He didn't listen to music, but he painted a picture","He didn't listen to music on Sunday, but he painted a picture","He didn't listen to music last Sunday, but he painted a picture","On Sunday, he didn't listen to music, but he painted a picture"],"unit":13,"level":3,"why":"✔ → quá khứ khẳng định: painted (thêm -ed). ✘ → didn't + động từ nguyên mẫu: didn't listen. Nối bằng but: Oscar painted a picture, but he didn't listen to music.","trap":{"Oscar painted a picture, but he didn't listened to music":"Sau didn't động từ giữ nguyên: didn't listen.","Oscar painted a picture, but he doesn't listen to music":"Nhật ký Chủ nhật (đã qua) → didn't listen.","Oscar painted a picture, but he wasn't listen to music":"listen là động từ thường → didn't listen, không dùng wasn't.","Oscar paints a picture, but he doesn't listen to music":"Nhật ký kể chuyện đã qua → painted … didn't listen.","Oscar paint a picture, but he didn't listen to music":"✔ quá khứ → thêm -ed: painted.","Oscar painted a picture, but he not listened to music":"Phủ định quá khứ: didn't listen.","Oscar painted a picture and listened to music":"✘ nghĩa là KHÔNG làm → didn't listen; và đề yêu cầu dùng but.","Oscar paintted a picture, but he didn't listen to music":"Chính tả: painted (không gấp đôi t).","*":"✔ painted a picture, ✘ didn't listen to music, nối bằng but."}},{"q":"Ruby is 12. Jake is 10. Nick is 8. Write ONE sentence. Start with «Jake is …» and use the word «old» and «than».","accept":["Jake is older than Nick","He is older than Nick","Jake is two years older than Nick","Jake is 2 years older than Nick","Jake is older than Nick but younger than Ruby","Jake is older than Nick, but he is younger than Ruby","Jake is older than Nick and younger than Ruby","Jake is older than Nick, but Ruby is older than Jake","Jake is older than Nick, but Ruby is older than him"],"unit":9,"level":3,"why":"Jake 10 tuổi, Nick 8 tuổi → Jake lớn hơn Nick: Jake is older than Nick. (Jake nhỏ hơn Ruby nên không viết older than Ruby.)","trap":{"Jake is older than Ruby":"Ruby 12 tuổi, Jake 10 tuổi → Jake KHÔNG lớn hơn Ruby. Jake lớn hơn Nick.","Jake is old than Nick":"Có than → thêm -er: older.","Jake is more old than Nick":"Tính từ ngắn thêm -er: older.","Jake is the oldest":"Ruby mới là người lớn nhất. Đề yêu cầu dùng than: Jake is older than Nick.","Jake is oldest than Nick":"Có than → older (so sánh hơn), không dùng oldest.","Jake is younger than Ruby":"Câu này đúng nghĩa, nhưng đề yêu cầu dùng từ old: Jake is older than Nick.","Jake older than Nick":"Thiếu is: Jake is older than Nick.","*":"Jake 10 tuổi: so với ai thì Jake lớn hơn? → Jake is older than …","Ruby is older than Jake":"Câu này đúng nghĩa, nhưng đề yêu cầu bắt đầu bằng «Jake is …»: Jake is older than Nick."}},{"q":"Zoe / brush / her teeth / after dinner / every evening","accept":["Zoe brushes her teeth after dinner every evening","Zoe brushes her teeth every evening after dinner","Every evening, Zoe brushes her teeth after dinner","After dinner, Zoe brushes her teeth every evening","Every evening after dinner, Zoe brushes her teeth"],"unit":6,"level":2,"why":"every evening → thói quen (hiện tại đơn). Zoe = she → động từ thêm -es (brush tận cùng sh): brushes.","trap":{"Zoe brush her teeth after dinner every evening":"Zoe = she → brushes (thêm -es).","Zoe brushs her teeth after dinner every evening":"brush tận cùng bằng sh → thêm -es: brushes.","Zoe is brush her teeth after dinner every evening":"Không dùng is với động từ thường: Zoe brushes …","Zoe is brushing her teeth after dinner every evening":"every evening → thói quen, dùng hiện tại đơn: brushes.","Zoe brushed her teeth after dinner every evening":"every evening → thói quen (hiện tại): brushes.","*":"Zoe brushes her teeth after dinner every evening."}}]},{"id":"E2","part":"E","type":"text","title":"Find the mistake. Write the sentence correctly.","vi":"Mỗi câu có MỘT lỗi sai. Viết lại cả câu cho đúng.","items":[{"q":"Is your dad cook dinner now?","accept":["Is your dad cooking dinner now"],"unit":5,"level":2,"why":"now → đang xảy ra: Is + your dad + V-ing: Is your dad cooking dinner now?","trap":{"Is your dad cook dinner now?":"Câu này chép lại y nguyên, chưa sửa lỗi. Sau Is … dùng V-ing: cooking.","Does your dad cooking dinner now":"does không đi với V-ing; giữ Is: Is your dad cooking dinner now?","Does your dad cook dinner now":"Có now (bây giờ) → đang nấu: Is your dad cooking dinner now?","Is your dad cooks dinner now":"Sau Is … dùng V-ing: cooking.","Is your dad cookking dinner now":"cook + ing → cooking (không gấp đôi k)."}},{"q":"When I was little, I don't have a bike.","accept":["When I was little, I didn't have a bike","I didn't have a bike when I was little"],"unit":12,"level":3,"why":"«When I was little» → quá khứ. Phủ định của have ở quá khứ: didn't have.","trap":{"When I was little, I don't have a bike.":"Câu này chép lại y nguyên, chưa sửa lỗi. «When I was little» → didn't have.","When I was little, I didn't had a bike":"Sau didn't động từ giữ nguyên: have.","When I was little, I wasn't have a bike":"Phủ định của have là didn't have, không dùng wasn't.","When I was little, I doesn't have a bike":"Quá khứ → didn't have (và I không đi với doesn't).","When I am little, I don't have a bike":"Câu nói về lúc còn nhỏ (đã qua) → giữ was, sửa thành didn't have."}},{"q":"My dad plays always tennis on Sundays.","accept":["My dad always plays tennis on Sundays","On Sundays, my dad always plays tennis","On Sundays my dad always plays tennis"],"unit":7,"level":2,"why":"always đứng TRƯỚC động từ thường: My dad always plays tennis.","trap":{"My dad plays always tennis on Sundays.":"Câu này chép lại y nguyên, chưa sửa lỗi. always đứng trước plays.","My dad always play tennis on Sundays":"My dad = he → plays (vẫn thêm -s khi có always).","Always my dad plays tennis on Sundays":"always đứng ngay trước động từ, không đứng đầu câu: My dad always plays …","My dad is always play tennis on Sundays":"Không thêm is: My dad always plays tennis."}},{"q":"Ruby and Jake have got a cat. There cat is black and white.","accept":["Ruby and Jake have got a cat. Their cat is black and white","Their cat is black and white"],"unit":3,"level":2,"why":"Của Ruby và Jake (họ) → their (t-h-e-i-r). there = ở đó.","trap":{"Ruby and Jake have got a cat. There cat is black and white.":"Câu này chép lại y nguyên, chưa sửa lỗi. «Của họ» viết là Their.","Ruby and Jake have got a cat. They cat is black and white":"Trước danh từ (cat) dùng tính từ sở hữu: Their.","Ruby and Jake have got a cat. They're cat is black and white":"They're = They are. «Của họ» là Their.","Ruby and Jake have got a cat. Our cat is black and white":"our = của chúng tôi. Ruby và Jake = they → Their.","Ruby and Jake have got a cat. Her cat is black and white":"her = của cô ấy (một người). Ruby và Jake là hai người → Their."}}]}],"speaking":{"title":"Part F · Speaking (phụ huynh chấm riêng, không tính vào 100 điểm)","note":"Phụ huynh hỏi bằng tiếng Anh, con trả lời bằng câu đầy đủ. Có 5 nhóm, mỗi nhóm tối đa 2 điểm: 2 = trả lời đúng bằng câu đầy đủ; 1 = trả lời được nhưng chỉ bằng từ đơn hoặc sai ngữ pháp (thiếu -s/-es, nhầm does/is, quên -ed, nhầm was/were …); 0 = chưa trả lời được. Cộng 5 nhóm = điểm Speaking (/10).","max":10,"prompts":["Units 1–3: Where are your grandparents from? When is your birthday? Which season do you like best? Why? Tell me two things your mum likes and one thing she doesn't like. — Hold up two things: Is this your pencil or my pencil? What things do you collect?","Units 4–6: Look out of the window or at a photo. Tell me about two people: what is each person doing now? Is anyone running? — Tell me three things your mum does in the morning, in order. When does she start work?","Units 7–9: How often do you go to the swimming pool? Which place do you never go to? What would you like for lunch tomorrow? — Which animal do you like? Is it faster than a dog? Is your bag heavier than my bag?","Units 10–12: Tell me two school rules: one with must and one with mustn't. — Was there a park near our house when you were four? When you were six, were you tall or short? What was your favourite toy when you were small?","Unit 13: Talk about yesterday. Use four of these verbs: walk, watch, help, play, listen, cook, clean, visit (Yesterday I …). — Which school subject is easy for you? Which one is difficult?"],"rubric":["Gợi ý xếp loại theo tổng điểm:","9–10: trả lời trôi chảy, câu đầy đủ, hầu như không sai ngữ pháp.","7–8: trả lời được hết, vài lỗi nhỏ (thiếu -s, quên -ed, nhầm was/were).","5–6: trả lời được khoảng một nửa, câu ngắn, nhiều lỗi.","3–4: chỉ trả lời bằng từ đơn lẻ, cần gợi ý nhiều.","0–2: chưa trả lời được."]}};
const LS = DATA.storageKey;

// ---- grading helpers (same rules as Revision 1–9: case-insensitive, contractions = full forms)
function norm(s) {
  s = String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); // café = cafe
  s = s.replace(/[’‘`´ʼ′]/g, "'").replace(/[“”«»]/g, '"').replace(/[–—‐‑]/g, '-');
  s = s.replace(/[.,!?;:"()]/g, ' ').replace(/\s*-\s*/g, '-').replace(/\s+/g, ' ').trim();
  s = s.replace(/(^|[^a-z0-9])'+|'+(?=[^a-z]|$)/g, '$1 ').replace(/\s+/g, ' ').trim(); // quotes around a word: 'gets' → gets
  // "'s got" is always "has got" (never "is got"), for pronouns AND names: Tim's got = Tim has got; "Tim is got" stays wrong.
  // iPad without apostrophe: "Tims got" / "shes got" = "… has got" (except words that end in s by themselves: has, is, this, his…)
  s = s.replace(/\b([a-z]+)'s got\b/g, '$1 has got')
       .replace(/\b([a-z]+)s got\b/g, (m, w) => /s$|^(ha|i|wa|thi|hi|u|ye|doe|goe|her|our|your|their|thu|plu|ga|bu)$/.test(w) ? m : w + ' has got');
  s = s.replace(/\bi'm\b/g, 'i am').replace(/\b([a-z]+)'re\b/g, '$1 are')
       .replace(/\b(it|he|she|that|this|there|here|what|who|where|how)'s\b/g, '$1 is')
       .replace(/\bisn't\b/g, 'is not').replace(/\baren't\b/g, 'are not')
       .replace(/\bdon't\b/g, 'do not').replace(/\bdoesn't\b/g, 'does not')
       .replace(/\bcan't\b/g, 'cannot').replace(/\bcan not\b/g, 'cannot')
       .replace(/\bhaven't\b/g, 'have not').replace(/\bhasn't\b/g, 'has not')
       .replace(/\b([a-z]+)'ve\b/g, '$1 have').replace(/\b([a-z]+)'ll\b/g, '$1 will')
       // 'd is ambiguous (he'd = he had / he would): expand only in "'d like/love/prefer", leave other 'd untouched
       .replace(/\b(i|you|we|they|he|she)'d (like|love|prefer)\b/g, '$1 would $2')
       .replace(/\b(i|you|we|they)d (like|love|prefer)\b/g, '$1 would $2') // iPad: "Id like"
       .replace(/\bdidn't\b/g, 'did not').replace(/\bwasn't\b/g, 'was not').replace(/\bweren't\b/g, 'were not')
       .replace(/\bmustn't\b/g, 'must not').replace(/\bwon't\b/g, 'will not');
  s = s.replace(/\bim\b/g, 'i am').replace(/\bdont\b/g, 'do not').replace(/\bdoesnt\b/g, 'does not')
       .replace(/\bisnt\b/g, 'is not').replace(/\barent\b/g, 'are not').replace(/\bcant\b/g, 'cannot')
       .replace(/\bhavent\b/g, 'have not').replace(/\bhasnt\b/g, 'has not').replace(/\bdidnt\b/g, 'did not')
       .replace(/\bwasnt\b/g, 'was not').replace(/\bwerent\b/g, 'were not').replace(/\bmustnt\b/g, 'must not')
       .replace(/\btheyre\b/g, 'they are').replace(/\byoure\b/g, 'you are')
       .replace(/\bthats\b/g, 'that is').replace(/\btheres\b/g, 'there is').replace(/\bwhats\b/g, 'what is')
       .replace(/\bhes\b/g, 'he is').replace(/\bshes\b/g, 'she is')
       .replace(/\b(i|we|you|they)ve\b/g, '$1 have').replace(/\bwouldnt\b/g, 'would not').replace(/\bcouldnt\b/g, 'could not');
  return s.replace(/\s+/g, ' ').trim();
}
// trap feedback: keys in data.json may be written with contractions/capitals/punctuation → compare normalised
function trapFor(trap, v) {
  if (!trap) return null; const n = norm(v);
  for (const k of Object.keys(trap)) if (k !== '*' && norm(k) === n) return trap[k];
  return null;
}
const matches = (u, acc) => { const n = norm(u); return !!n && acc.some(a => norm(a) === n); };
// kw: every group needs one alternative present as whole words
const kwOk = (u, groups) => { const s = ' ' + norm(u) + ' '; return norm(u) !== '' && groups.every(g => g.some(a => s.includes(' ' + norm(a) + ' '))); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---- state
let store = { attempts: [], draft: null };
const isObj = o => !!o && typeof o === 'object' && !Array.isArray(o);
try {
  const v = JSON.parse(localStorage.getItem(LS) || 'null');
  if (isObj(v) && Array.isArray(v.attempts)) store = {
    // drop anything malformed (old versions / hand-edited / corrupted values) instead of crashing
    attempts: v.attempts.filter(a => isObj(a) && typeof a.score === 'number' && !isNaN(new Date(a.date))),
    draft: isObj(v.draft) ? v.draft : null };
} catch (e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} };
let answers = (store.draft && isObj(store.draft.answers)) ? store.draft.answers : {};
let graded = null; let confirmOpen = false;
let speak = (store.draft && isObj(store.draft.speak)) ? store.draft.speak : {};

const items = []; DATA.exercises.forEach(ex => ex.items.forEach((it, i) => items.push({ ex, it, key: ex.id + '.' + (i + 1) })));
const TOTAL = items.reduce((s, x) => s + (x.it.pts || x.ex.pts || 1), 0);

function render() {
  const app = document.getElementById('app');
  let h = `<h1>${esc(DATA.title)}</h1><p class="muted">${esc(DATA.subtitle)}</p>`;
  h += `<div class="card small">${DATA.instructions.map(esc).join('<br>')}</div>`;
  if (graded) h += resultHtml();
  let part = null, exNo = 0;
  for (const ex of DATA.exercises) {
    if (ex.part !== part) { part = ex.part; h += `<h2 class="part">${esc(DATA.parts[part])}</h2>`; }
    exNo++;
    const exPts = ex.items.reduce((s, it) => s + (it.pts || ex.pts || 1), 0);
    const got = graded ? ex.items.reduce((s, it, i) => s + (graded.res[ex.id + '.' + (i + 1)].pts), 0) : null;
    h += `<section class="card" id="ex-${ex.id}"><div class="exh"><span class="num">${exNo}</span><div class="ttl"><b>${esc(ex.title)}</b><span class="vi">${esc(ex.vi || '')}</span></div><span class="pts ${graded ? 'done' : ''}">${graded ? got + ' / ' : ''}${exPts} điểm</span></div>`;
    if (ex.audio) h += `<div class="audio"><audio controls preload="none" src="${esc(ex.audio)}"></audio><span class="small muted">Nghe 2 lần.</span></div>`;
    if (ex.passage) h += `<div class="passage">${ex.passageTitle ? `<h4>${esc(ex.passageTitle)}</h4>` : ''}${esc(ex.passage)}</div>`;
    if (ex.bank) h += `<div class="bank">${ex.bank.map(w => `<span>${esc(w)}</span>`).join('')}</div>`;
    if (ex.example) h += `<p class="eg">Ví dụ: ${ex.example}</p>`;
    ex.items.forEach((it, i) => { h += itemHtml(ex, it, ex.id + '.' + (i + 1), i + 1); });
    h += `</section>`;
  }
  h += speakingHtml();
  if (store.attempts.length) h += historyHtml();
  app.innerHTML = h;
  bindInputs(); renderBar();
}

function itemHtml(ex, it, key, n) {
  const v = answers[key]; const r = graded && graded.res[key];
  const type = it.type || ex.type;
  let body = it.q ? `<div class="q">${fmtQ(it.q, key, type, v, r, ex, it)}</div>` : '';
  if (type === 'mcq' || type === 'tf') {
    const opts = type === 'tf' ? ['True', 'False'] : (it.options || ex.options);
    body += `<div class="opts" role="radiogroup">` + opts.map((o, k) => {
      let cls = ''; if (graded) { if (k === answerIndex(ex, it)) cls = 'ok'; else if (v === k) cls = 'bad'; }
      return `<label class="opt ${cls}"><input type="radio" name="${key}" value="${k}" ${v === k ? 'checked' : ''} ${graded ? 'disabled' : ''}><span>${esc(o)}</span></label>`;
    }).join('') + `</div>`;
  } else if (type === 'select') {
    if (!/___/.test(it.q || '')) body += selectHtml(ex, key, v, r);
  } else if (type === 'order') {
    body = `<div class="words">${it.words.map(w => `<span>${esc(w)}</span>`).join('')}</div>` + `<input class="in-t ${r ? (r.ok ? 'ok' : 'bad') : ''}" data-k="${key}" value="${esc(v || '')}" ${graded ? 'readonly' : ''} autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Viết câu hoàn chỉnh…">`;
  } else if ((type === 'text' || type === 'kw') && !/___/.test(it.q || '')) {
    body += `<input class="in-t ${r ? (r.ok ? 'ok' : 'bad') : ''}" data-k="${key}" value="${esc(v || '')}" ${graded ? 'readonly' : ''} autocomplete="off" autocapitalize="off" spellcheck="false">`;
  }
  if (r && !r.ok) body += fbHtml(ex, it, v);
  return `<div class="item"><span class="n">${n}.</span><div>${body}</div></div>`;
}
function selectHtml(ex, key, v, r) {
  const opts = ex.options;
  return `<select class="in-t ${r ? (r.ok ? 'ok' : 'bad') : ''}" data-k="${key}" ${graded ? 'disabled' : ''}><option value="">— chọn —</option>${opts.map(o => `<option ${v === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
}
function fmtQ(q, key, type, v, r, ex, it) {
  const parts = esc(q).split('___');
  if (parts.length === 1) return parts[0];
  // mcq/tf: the gap is NOT an input (answer = the radio); it shows the chosen option
  if (type === 'mcq' || type === 'tf') {
    const opts = type === 'tf' ? ['True', 'False'] : (it.options || ex.options);
    return parts[0] + `<span class="blank" data-b="${key}">${typeof v === 'number' && opts[v] != null ? esc(opts[v]) : '&nbsp;'}</span>` + parts.slice(1).join('___');
  }
  const field = type === 'select' ? selectHtml(ex, key, v, r)
    : `<input class="in-t gap ${r ? (r.ok ? 'ok' : 'bad') : ''}" data-k="${key}" value="${esc(v || '')}" ${graded ? 'readonly' : ''} autocomplete="off" autocapitalize="off" spellcheck="false">`;
  return parts[0] + field + parts.slice(1).join('___');
}
function answerIndex(ex, it) { return typeof it.answer === 'number' ? it.answer : (it.answer === 'True' ? 0 : it.answer === 'False' ? 1 : -1); }
function modelAnswer(ex, it) {
  const type = it.type || ex.type;
  if (type === 'mcq') return (it.options || ex.options)[it.answer];
  if (type === 'tf') return it.answer;
  if (type === 'select') return it.answer;
  if (type === 'kw') return it.model;
  return it.accept[0];
}
function fbHtml(ex, it, v) {
  const type = it.type || ex.type;
  let wrongWhy = '';
  if (it.trap && v != null && v !== '') {
    // mcq/tf: key = option index ("0","1"…; tf also accepts "True"/"False"); text/select/kw: key = typed text (normalised)
    const t = (type === 'mcq' || type === 'tf') ? (it.trap[String(v)] || (type === 'tf' && it.trap[['True', 'False'][v]]) || it.trap['*'])
      : trapFor(it.trap, v) || it.trap['*'];
    if (t) wrongWhy = `<br><span class="x">Vì sao sai:</span> ${esc(t)}`;
  }
  return `<div class="fb">Đáp án: <span class="a">${esc(modelAnswer(ex, it))}</span>${it.why ? `<br>${esc(it.why)}` : ''}${wrongWhy}</div>`;
}

function speakingHtml() {
  const s = DATA.speaking; if (!s) return '';
  let h = `<h2 class="part">${esc(s.title)}</h2><div class="card"><p class="small muted">${esc(s.note)}</p><ol class="speak">${s.prompts.map(p => `<li>${esc(p)}</li>`).join('')}</ol>`;
  h += `<p class="small"><b>Phụ huynh chấm (0–${s.max}):</b></p><div class="rub" role="radiogroup" aria-label="Điểm Speaking">`;
  for (let k = 0; k <= s.max; k++) h += `<label class="opt"><input type="radio" name="speak" value="${k}" ${speak.score === k ? 'checked' : ''}><span>${k}</span></label>`;
  h += `</div><p class="small muted">${s.rubric.map(esc).join('<br>')}</p></div>`;
  return h;
}

function bindInputs() {
  // accessible names: "Bài 3, câu 2" for every input / select / radiogroup
  document.querySelectorAll('section[id^="ex-"]').forEach(sec => {
    const exn = sec.querySelector('.num').textContent;
    sec.querySelectorAll('.item').forEach(row => {
      const lab = `Bài ${exn}, câu ${row.querySelector('.n').textContent.replace('.', '')}`;
      row.querySelectorAll('[data-k], [role=radiogroup]').forEach(el => el.setAttribute('aria-label', lab));
    });
  });
  document.querySelectorAll('[data-k]').forEach(el => {
    const on = () => { answers[el.dataset.k] = el.value; draft(); renderBar(); };
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', on);
  });
  document.querySelectorAll('input[type=radio]').forEach(el => el.addEventListener('change', () => {
    if (el.name === 'speak') { speak.score = +el.value; draft(); if (graded) { graded.speaking = speak.score; persistSpeak(); } return; }
    answers[el.name] = +el.value; draft(); renderBar();
    const b = document.querySelector(`.blank[data-b="${CSS.escape(el.name)}"]`); if (b) b.textContent = el.nextElementSibling.textContent;
  }));
}
function draft() { if (!graded) { store.draft = { answers, speak }; save(); } else save(); }
function persistSpeak() { const a = store.attempts[store.attempts.length - 1]; if (a && a.id === graded.id) { a.speaking = speak.score; save(); } }
function answeredCount() { return items.filter(x => answers[x.key] !== undefined && answers[x.key] !== '').length; }

// keep the last content clear of the fixed bottom bar (bar grows to 2–3 lines on phones in the confirm state)
function fitBar() { document.getElementById('app').style.paddingBottom = (document.getElementById('bar').offsetHeight + 28) + 'px'; }
addEventListener('resize', fitBar);
function renderBar() { renderBarInner(); fitBar(); }
function renderBarInner() {
  const prog = document.getElementById('prog'), btns = document.getElementById('barBtns');
  if (graded) {
    prog.innerHTML = `Điểm: <b>${graded.score} / ${TOTAL}</b>`;
    btns.innerHTML = `<button class="btn" id="bTop">Xem kết quả</button> <button class="btn primary" id="bNew">Làm lại từ đầu</button>`;
    document.getElementById('bTop').onclick = () => document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
    document.getElementById('bNew').onclick = () => { if (confirm('Xoá bài đang xem và làm lại từ đầu?')) { answers = {}; speak = {}; graded = null; store.draft = null; save(); render(); scrollTo(0, 0); } };
    return;
  }
  const n = answeredCount();
  prog.innerHTML = `Đã làm <b>${n}</b> / ${items.length} câu`;
  if (confirmOpen) {
    btns.innerHTML = `<span class="confirm">Còn ${items.length - n} câu chưa làm. Vẫn nộp bài? <button class="btn" id="bNo">Làm tiếp</button> <button class="btn primary" id="bYes">Nộp</button></span>`;
    document.getElementById('bNo').onclick = () => { confirmOpen = false; renderBar(); };
    document.getElementById('bYes').onclick = () => { confirmOpen = false; grade(); };
  } else {
    btns.innerHTML = `<button class="btn primary" id="bGrade">Nộp bài</button>`;
    document.getElementById('bGrade').onclick = () => { if (answeredCount() < items.length) { confirmOpen = true; renderBar(); } else grade(); };
  }
}

function grade() {
  const res = {}; let score = 0;
  for (const { ex, it, key } of items) {
    const type = it.type || ex.type, v = answers[key], pts = it.pts || ex.pts || 1;
    let ok = false;
    if (type === 'mcq' || type === 'tf') ok = v === answerIndex(ex, it);
    else if (type === 'select') ok = v === it.answer;
    else if (type === 'kw') ok = kwOk(v, it.kw);
    else ok = matches(v, it.accept);
    res[key] = { ok, pts: ok ? pts : 0, max: pts };
    score += res[key].pts;
  }
  graded = { id: Date.now(), date: new Date().toISOString(), score, res, speaking: speak.score };
  store.attempts.push({ id: graded.id, date: graded.date, score, total: TOTAL, speaking: speak.score ?? null,
    answers: { ...answers }, wrong: items.filter(x => !res[x.key].ok).map(x => x.key),
    byPart: breakdown('part'), byUnit: breakdown('unit'), byLevel: breakdown('level') });
  store.draft = null; save();
  render(); document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
}
function breakdown(dim) {
  const m = {};
  for (const { ex, it, key } of items) {
    const k = dim === 'part' ? ex.part : dim === 'unit' ? String(it.unit ?? ex.unit) : String(it.level || 2);
    m[k] = m[k] || { got: 0, max: 0 }; m[k].max += graded.res[key].max; m[k].got += graded.res[key].pts;
  }
  return m;
}
function band(p) { return DATA.bands.find(b => p >= b.min); }
function barCell(got, max) { const p = max ? got / max : 0; return `<div class="pbar"><i class="${p < .5 ? 'low' : p < .75 ? 'mid' : ''}" style="width:${Math.round(p * 100)}%"></i></div>`; }
function resultHtml() {
  const pct = Math.round(graded.score * 100 / TOTAL), b = band(pct);
  const bp = breakdown('part'), bu = breakdown('unit');
  let h = `<section class="card" id="result" style="border:2px solid var(--accent)"><div class="score"><span class="big">${graded.score}</span><span class="muted">/ ${TOTAL} điểm</span><span class="band">${esc(b.label)}</span></div><p>${esc(b.advice)}</p>`;
  h += `<h3>Theo kỹ năng</h3><table class="t"><tr><th>Phần</th><th class="r">Điểm</th><th style="width:40%"></th></tr>` +
    Object.keys(DATA.parts).filter(k => bp[k]).map(k => `<tr><td>${esc(DATA.parts[k])}</td><td class="r">${bp[k].got} / ${bp[k].max}</td><td>${barCell(bp[k].got, bp[k].max)}</td></tr>`).join('') + `</table>`;
  const unitKeys = Object.keys(bu).sort((a, b) => (+a || 0) - (+b || 0));
  h += `<h3>Theo unit</h3><table class="t"><tr><th>Unit</th><th class="r">Điểm</th><th style="width:40%"></th></tr>` +
    unitKeys.map(k => `<tr><td>${k === 'mix' ? 'Tổng hợp' : /^[0-9]+$/.test(k) ? 'Unit ' + esc(k) : esc(k)} <span class="small muted">${esc(DATA.unitTitles[k] || '')}</span></td><td class="r">${bu[k].got} / ${bu[k].max}</td><td>${barCell(bu[k].got, bu[k].max)}</td></tr>`).join('') + `</table>`;
  const weak = unitKeys.filter(k => bu[k].max >= 3 && bu[k].got / bu[k].max < .6);
  if (weak.length) h += `<p><b>Cần ôn lại:</b> ${weak.map(k => (k === 'mix' ? 'phần tổng hợp' : (/^[0-9]+$/.test(k) ? 'Unit ' : '') + k + ' (' + (DATA.unitTitles[k] || '') + ')')).map(esc).join(', ')}.</p>`;
  h += `<p class="small muted">Các câu sai được tô đỏ bên dưới, kèm đáp án và giải thích.</p></section>`;
  return h;
}
function historyHtml() {
  return `<h2 class="part">Các lần làm trước</h2><div class="card"><ul class="hist">${store.attempts.slice().reverse().map(a => `<li>${new Date(a.date).toLocaleString('vi-VN')}: <b>${a.score} / ${a.total}</b>${a.speaking != null ? ` · Speaking ${a.speaking}/${DATA.speaking.max}` : ''}</li>`).join('')}</ul>
  <button class="btn" id="bExport">Tải kết quả (JSON)</button></div>`;
}
document.addEventListener('click', e => {
  if (e.target.id === 'bExport') {
    const blob = new Blob([JSON.stringify(store.attempts, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = DATA.exportName; a.click();
  }
});
render();
</script>
</body>
</html>
