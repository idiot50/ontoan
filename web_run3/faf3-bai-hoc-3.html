<title>Bài học nhanh FaF3 · Phần 3</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root {
  --bg: #f4f6f3; --surface: #fff; --fg: #1d2924; --muted: #5d6c65; --line: #d7ded8; --line2: #b9c4bd;
  --accent: #1f6f5c; --accent-ink: #fff; --accent-soft: #e2f1ea;
  --ok: #2c7a39; --ok-soft: #e4f4e6; --bad: #b9312f; --bad-soft: #fbe7e5; --warn: #9a5b00; --warn-soft: #fff1d6;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131916; --surface: #1b2420; --fg: #e5ebe6; --muted: #9db0a5; --line: #2c3a33; --line2: #41534a;
  --accent: #6fcfb0; --accent-ink: #0f1f19; --accent-soft: #1d3a31;
  --ok: #7bd389; --ok-soft: #1e3525; --bad: #ff8f85; --bad-soft: #3d2321; --warn: #ffc46b; --warn-soft: #3a2c14; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #131916; --surface: #1b2420; --fg: #e5ebe6; --muted: #9db0a5; --line: #2c3a33; --line2: #41534a;
  --accent: #6fcfb0; --accent-ink: #0f1f19; --accent-soft: #1d3a31;
  --ok: #7bd389; --ok-soft: #1e3525; --bad: #ff8f85; --bad-soft: #3d2321; --warn: #ffc46b; --warn-soft: #3a2c14; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: "Nunito", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.55; }
button, input { font: inherit; }
.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .in { max-width: 820px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.brand { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { margin-left: auto; flex: 0 0 auto; font-size: .88rem; font-weight: 700; color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; }
.wrap { max-width: 820px; margin: 0 auto; padding: 16px 16px 60px; }
h1 { font-size: 1.4rem; margin: 6px 0; line-height: 1.25; }
.muted { color: var(--muted); } .small { font-size: .88rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.chip { border: 1px solid var(--line2); border-radius: 999px; padding: 3px 10px; font-size: .85rem; font-weight: 700; color: var(--muted); text-decoration: none; background: var(--surface); }
.chip.done { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
details.lesson { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin: 12px 0; }
details.lesson > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; gap: 10px; align-items: center; }
details.lesson > summary::-webkit-details-marker { display: none; }
.num { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 800; display: flex; align-items: center; justify-content: center; }
.num.done { background: var(--ok); }
.st { flex: 1; min-width: 0; font-weight: 800; }
.st small { display: block; font-weight: 600; color: var(--muted); }
.body { padding: 0 16px 16px; }
.from { border-left: 4px solid var(--warn); background: var(--warn-soft); padding: 8px 12px; border-radius: 8px; margin: 4px 0 12px; font-size: .95rem; }
.rule { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
.rule p { margin: 6px 0; } .rule ul, .rule ol { margin: 6px 0; padding-left: 20px; } .rule li { margin: 3px 0; }
table.rt { border-collapse: collapse; margin: 6px 0; font-size: .93rem; width: 100%; max-width: 560px; }
table.rt th, table.rt td { border: 1px solid var(--line2); padding: 4px 8px; text-align: left; vertical-align: top; background: var(--surface); }
table.rt th { background: var(--bg); }
.eg { margin: 6px 0; padding-left: 12px; border-left: 3px solid var(--accent); }
.passage { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 10px 0; white-space: pre-line; }
h3 { font-size: 1rem; margin: 14px 0 4px; }
.item { display: grid; grid-template-columns: 1.6em minmax(0, 1fr); gap: 4px; padding: 9px 0; border-top: 1px dashed var(--line); }
.item .n { font-weight: 800; color: var(--muted); }
.q { margin-bottom: 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.opt { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line2); border-radius: 10px; padding: 6px 12px; cursor: pointer; background: var(--surface); }
.opt input { accent-color: var(--accent); margin: 0; }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); } .opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.in-t { padding: 8px 10px; border: 1.5px solid var(--line2); border-radius: 8px; background: var(--surface); color: var(--fg); width: 100%; font-size: 1rem; }
.in-t.gap { width: 9em; max-width: 100%; display: inline-block; padding: 4px 8px; margin: 2px; }
.in-t.ok { border-color: var(--ok); background: var(--ok-soft); } .in-t.bad { border-color: var(--bad); background: var(--bad-soft); }
.words { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.words span { border: 1px dashed var(--line2); border-radius: 6px; padding: 2px 8px; font-weight: 700; }
.fb { font-size: .92rem; margin-top: 6px; border-left: 3px solid var(--line2); padding-left: 8px; color: var(--muted); }
.fb .a { color: var(--ok); font-weight: 800; } .fb .x { color: var(--bad); font-weight: 800; }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.btn { border: 1px solid var(--line2); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 9px 16px; cursor: pointer; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:focus-visible, .in-t:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sayrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 6px; }
.btn.say { padding: 5px 12px; font-size: .95rem; }
details.pfb { display: none; margin: 0 0 6px; }
body.novoice details.pfb { display: block; }
body.novoice .btn.say { display: none; }
.score { font-weight: 800; }
.score.full { color: var(--ok); }
</style>
</head>

<script>
const DATA = {"pageTitle":"Bài học nhanh FaF3 · Phần 3","outFile":"faf3-bai-hoc-3.html","title":"Bài học nhanh sau Đề 3: sửa các lỗi lặp lại","intro":"Đề 3 con làm phần Đọc đúng hết 15/15 — rất giỏi! Phần 3 này sửa những lỗi con mắc ở cả 3 bài kiểm tra: đặt câu hỏi, was/were/had, chính tả, my/your/their. Mỗi bài 3–5 phút. Bài cuối là bài ôn luyện tổng hợp — làm sau khi xong 7 bài.","storageKey":"faf3-bai-hoc-3-v1","lessons":[{"id":"P1","minutes":5,"title":"Câu hỏi Có/Không: Do, Does, Is hay Are?","fromTest":"Cả 3 bài kiểm tra con đều sai dạng này: «Are Holly and Max have lunch at school?» (Đề 2), «Are Max and Holly like playing chess?» và «Does Max ever goes to the museum?» (Đề 3). Đúng là: Do Holly and Max have…? · Do Max and Holly like…? · Does Max ever go…?","rule":"\u003cp>\u003cb>Bước 1 — nhìn động từ:\u003c/b>\u003c/p>\u003ctable class='rt'>\u003ctr>\u003cth>Sau chủ ngữ là …\u003c/th>\u003cth>Dùng\u003c/th>\u003c/tr>\u003ctr>\u003ctd>V-ing, tính từ (happy), nơi chốn (at home)\u003c/td>\u003ctd>\u003cb>Is / Are\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>động từ thường: like, have, go, play, live\u003c/td>\u003ctd>\u003cb>Do / Does\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp>\u003cb>Bước 2 — đếm người:\u003c/b> MỘT người (Max, my mum, he, she) → \u003cb>Does / Is\u003c/b>. HAI người trở lên (\u003cb>Max and Holly\u003c/b> = they), I, you, we → \u003cb>Do / Are\u003c/b>.\u003c/p>\u003cp>\u003cb>Bước 3:\u003c/b> sau \u003cb>Do / Does\u003c/b> động từ \u003cb>giữ nguyên\u003c/b>, không thêm -s: Does Max \u003cb>go\u003c/b>? (không phải \u003cs>goes\u003c/s>).\u003c/p>","examples":["\u003cb>Do\u003c/b> Max and Holly \u003cb>like\u003c/b> playing chess? (2 người + like)","\u003cb>Are\u003c/b> Max and Holly \u003cb>playing\u003c/b> chess now? (có -ing)","\u003cb>Does\u003c/b> Max ever \u003cb>go\u003c/b> to the museum? (1 người, go giữ nguyên)"],"items":[{"type":"mcq","q":"___ Amy and Leo like swimming?","options":["Do","Are","Does"],"answer":0,"why":"like là động từ thường; Amy and Leo = 2 người → Do.","trap":{"1":"Are đi với V-ing/tính từ; like là động từ thường → Do.","2":"Does chỉ dùng cho MỘT người; Amy and Leo là 2 người → Do."}},{"type":"mcq","q":"___ Amy and Leo swimming in the sea now?","options":["Are","Do","Does"],"answer":0,"why":"swimming có -ing → Are.","trap":{"1":"Do không đi với V-ing.","2":"Does không đi với V-ing và chỉ dùng cho 1 người."}},{"type":"mcq","q":"___ your brother play the guitar?","options":["Does","Is","Do"],"answer":0,"why":"play là động từ thường; your brother = 1 người → Does.","trap":{"1":"Is đi với V-ing (Is your brother playing…?).","2":"Do dùng cho 2 người trở lên hoặc I/you/we/they."}},{"type":"mcq","q":"Does Holly ___ to the library on Mondays?","options":["go","goes","going"],"answer":0,"why":"Sau Does động từ giữ nguyên → go.","trap":{"1":"-s đã nằm trong Does rồi, nên động từ không thêm -s nữa.","2":"Does không đi với V-ing."}},{"type":"mcq","q":"___ your mum and dad at home today?","options":["Are","Do","Does"],"answer":0,"why":"at home là nơi chốn (không có động từ thường); mum and dad = 2 người → Are.","trap":{"1":"Do cần một động từ thường đi sau (like, have…); ở đây là «at home» → Are.","2":"Does dùng cho 1 người và cần động từ thường."}},{"type":"mcq","q":"___ your cousins have a big garden?","options":["Do","Are","Does"],"answer":0,"why":"have là động từ thường; your cousins = nhiều người → Do.","trap":{"1":"Are không đi với have (động từ thường).","2":"Does chỉ dùng cho 1 người."}},{"type":"text","q":"Write the question: Tom and Lucy / like / cooking","accept":["Do Tom and Lucy like cooking","Do Lucy and Tom like cooking"],"why":"2 người + like → Do Tom and Lucy like cooking?","trap":{"are tom and lucy like cooking":"like là động từ thường → Do, không dùng Are.","does tom and lucy like cooking":"Tom and Lucy là 2 người → Do."}},{"type":"text","q":"Find the mistake and write the question correctly: «Does Leo likes skateboarding?»","accept":["Does Leo like skateboarding"],"why":"Sau Does → like (không -s).","trap":{"does leo likes skateboarding":"Câu chưa sửa: sau Does bỏ -s → like.","do leo like skateboarding":"Leo là 1 người → Does."}}]},{"id":"P2","minutes":5,"title":"Câu hỏi What: 3 bước, đừng chép cả câu trả lời","fromTest":"Đề 3 con viết «What Lily likes playing the guitar?» và «What Max is eating a sandwich?». Con đã chép nguyên câu trả lời rồi thêm What ở đầu. Câu đúng: What does Lily like doing? · What is Max eating?","rule":"\u003cp>Câu trả lời: \u003cb>Max is eating \u003cu>a sandwich\u003c/u>.\u003c/b> → hỏi về \u003cu>a sandwich\u003c/u>.\u003c/p>\u003col>\u003cli>\u003cb>Bỏ\u003c/b> phần muốn hỏi (a sandwich) và đặt \u003cb>What\u003c/b> ở đầu.\u003c/li>\u003cli>Có \u003cb>is / are\u003c/b> → đưa nó lên ngay sau What: What \u003cb>is\u003c/b> Max eating?\u003c/li>\u003cli>Không có is/are (động từ thường: likes, plays) → thêm \u003cb>does / do\u003c/b> và bỏ -s: Lily \u003cb>likes\u003c/b> playing the guitar → What \u003cb>does\u003c/b> Lily \u003cb>like\u003c/b> doing?\u003c/li>\u003c/ol>\u003ctable class='rt'>\u003ctr>\u003cth>Câu trả lời\u003c/th>\u003cth>Câu hỏi\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Max \u003cb>is\u003c/b> eating a sandwich.\u003c/td>\u003ctd>What \u003cb>is\u003c/b> Max eating?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lily \u003cb>likes\u003c/b> playing the guitar.\u003c/td>\u003ctd>What \u003cb>does\u003c/b> Lily \u003cb>like\u003c/b> doing?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Max \u003cb>gets up\u003c/b> at seven.\u003c/td>\u003ctd>What time \u003cb>does\u003c/b> Max \u003cb>get up\u003c/b>?\u003c/td>\u003c/tr>\u003c/table>","examples":["❌ What Max is eating a sandwich? → ✅ What \u003cb>is\u003c/b> Max eating?"],"items":[{"type":"order","words":["is","What","Amy","reading","?"],"accept":["What is Amy reading"],"why":"What + is + Amy + reading?"},{"type":"order","words":["does","What","Leo","like","doing","?"],"accept":["What does Leo like doing"],"why":"What + does + Leo + like doing?"},{"type":"text","q":"Answer: «Holly is drinking orange juice.» Write the question: What …?","accept":["What is Holly drinking"],"why":"Có is → What is Holly drinking? (bỏ «orange juice»).","trap":{"what holly is drinking orange juice":"Đừng chép câu trả lời. Bỏ «orange juice», đưa is lên sau What: What is Holly drinking?","what is holly drinking orange juice":"Bỏ phần muốn hỏi (orange juice): What is Holly drinking?","what holly is drinking":"Thứ tự sai: đưa is lên ngay sau What: What is Holly drinking?"}},{"type":"text","q":"Answer: «Tom likes playing chess.» Write the question: What …?","accept":["What does Tom like doing","What does Tom like playing"],"why":"Không có is/are → thêm does, likes → like: What does Tom like doing?","trap":{"what tom likes playing chess":"Đừng chép câu trả lời. Thêm does và bỏ -s: What does Tom like doing?","what does tom likes doing":"Sau does bỏ -s: like.","what is tom like doing":"likes là động từ thường → dùng does, không dùng is.","what tom likes doing":"Đừng giữ nguyên câu trả lời. Thêm does và bỏ -s: What does Tom like doing?","what does tom like":"Gần đúng rồi! Câu trả lời là «playing chess» (một việc làm) → hỏi What does Tom like doing?"}},{"type":"text","q":"Answer: «Amy and Leo are watching a film.» Write the question: What …?","accept":["What are Amy and Leo watching","What are they watching","What are Leo and Amy watching"],"why":"Có are → What are Amy and Leo watching? (bỏ «a film»).","trap":{"what amy and leo are watching a film":"Đừng chép câu trả lời. Bỏ «a film», đưa are lên sau What: What are Amy and Leo watching?","what are amy and leo watching a film":"Bỏ phần muốn hỏi (a film): What are Amy and Leo watching?","what is amy and leo watching":"Amy and Leo là 2 người → are, không dùng is."}},{"type":"text","q":"Answer: «Holly has lunch at one o'clock.» Write the question: What time …?","accept":["What time does Holly have lunch"],"why":"has là động từ thường → thêm does, has → have: What time does Holly have lunch?","trap":{"what time holly has lunch":"Thiếu does: What time does Holly have lunch?","what time does holly has lunch":"Sau does dùng have (không dùng has).","what time is holly have lunch":"have là động từ thường → does, không dùng is.","what time holly has lunch at one o'clock":"Đừng chép câu trả lời. Bỏ «at one o'clock», thêm does: What time does Holly have lunch?"}},{"type":"mcq","q":"Which question is correct?","options":["What does Sam like doing?","What Sam likes doing?","What is Sam like doing?"],"answer":0,"why":"like là động từ thường → What does Sam like doing?","trap":{"1":"Thiếu does (đây là lỗi «chép câu trả lời»).","2":"like là động từ thường → dùng does, không dùng is."}}]},{"id":"P3","minutes":4,"title":"Quá khứ: was / were hay had?","fromTest":"Đề 3 con viết «Grandpa was a bike» (đúng: had), chọn «there had a fire» (đúng: was) và «Were there any trams…? — Yes, there was» (đúng: were). Đề 1: «There is a cinema … fifty years ago» (đúng: was).","rule":"\u003ctable class='rt'>\u003ctr>\u003cth>Nghĩa\u003c/th>\u003cth>Quá khứ\u003c/th>\u003cth>Ví dụ\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Ai CÓ cái gì\u003c/b> (sở hữu)\u003c/td>\u003ctd>\u003cb>had\u003c/b>\u003c/td>\u003ctd>Grandpa \u003cb>had\u003c/b> a bike.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ai \u003cb>THẾ NÀO / Ở ĐÂU\u003c/b>\u003c/td>\u003ctd>\u003cb>was\u003c/b> (I/he/she/it) · \u003cb>were\u003c/b> (we/you/they)\u003c/td>\u003ctd>He \u003cb>was\u003c/b> happy. They \u003cb>were\u003c/b> at home.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Ở ĐÂU ĐÓ CÓ\u003c/b> cái gì\u003c/td>\u003ctd>\u003cb>There was\u003c/b> + 1 vật · \u003cb>There were\u003c/b> + nhiều vật\u003c/td>\u003ctd>There \u003cb>was\u003c/b> a fire. There \u003cb>were\u003c/b> trams.\u003c/td>\u003c/tr>\u003c/table>\u003cp>❌ Không có «there had». Câu trả lời ngắn lặp lại đúng từ của câu hỏi: Were there…? → Yes, there \u003cb>were\u003c/b>.\u003c/p>","examples":["Grandpa \u003cb>had\u003c/b> a blue bike. (ông CÓ xe)","There \u003cb>was\u003c/b> a park near my house. (gần nhà CÓ công viên)"],"items":[{"type":"mcq","q":"When Mum was young, she ___ long hair.","options":["had","was","were"],"answer":0,"why":"Mẹ CÓ tóc dài → had.","trap":{"1":"was = thì/là/ở; «có tóc dài» là sở hữu → had.","2":"were dùng cho we/you/they, và không mang nghĩa «có»."}},{"type":"mcq","q":"___ a big tree in our garden ten years ago.","options":["There was","There had","There were"],"answer":0,"why":"Trong vườn CÓ 1 cái cây → There was.","trap":{"1":"Không có «there had»; dùng There was.","2":"There were dùng với nhiều vật; a big tree là 1 cây."}},{"type":"mcq","q":"There ___ two parks in my grandma's town when she was young.","options":["were","was","had"],"answer":0,"why":"two parks (nhiều) → There were.","trap":{"1":"There was dùng với 1 vật; two parks là số nhiều.","2":"Không có «there had»; ở đâu đó CÓ → there was/were."}},{"type":"mcq","q":"Grandpa ___ very handsome when he was young.","options":["was","had","were"],"answer":0,"why":"Ông THẾ NÀO (handsome) → was.","trap":{"1":"had = có (sở hữu); handsome là tính từ → was.","2":"were dùng cho we/you/they."}},{"type":"text","q":"\"Were there any big shops near your school ten years ago?\" \"Yes, there ___.\"","accept":["were"],"why":"Hỏi Were there…? → Yes, there were.","trap":{"was":"Câu hỏi dùng Were (shops số nhiều) → trả lời were.","had":"Không có «there had»; lặp lại từ của câu hỏi: were."}},{"type":"text","q":"Leo ___ (have) a red skateboard when he was seven.","accept":["had"],"why":"when he was six → quá khứ của have: had.","trap":{"was":"Leo CÓ ván trượt → had, không dùng was.","has":"«when he was seven» là quá khứ → had.","haved":"have là động từ đặc biệt: quá khứ là had, không thêm -ed."}},{"type":"text","q":"My aunt and uncle ___ (be) very happy at the party yesterday.","accept":["were"],"why":"aunt and uncle = 2 người, yesterday → were.","trap":{"was":"2 người (aunt and uncle) → were.","are":"yesterday → quá khứ: were."}}]},{"id":"P4","minutes":5,"title":"Viết từ: đếm ô và soát chữ đôi, cụm phụ âm","fromTest":"Đề 3 con viết Autralia (thiếu s), voleyball (thiếu l), bages (thiếu d), famingo (thiếu l), cheeful (thiếu r); Đề 1–2: Ther, potatos. Con hay bỏ sót MỘT chữ ở chỗ có 2 phụ âm đứng cạnh nhau. Đề 3 con còn viết «white» cho waterfall và «tall» cho taxi — con đoán theo chữ cái đầu mà chưa đọc kỹ câu.","rule":"\u003col>\u003cli>\u003cb>Đọc cả câu trước\u003c/b> để hiểu nghĩa, rồi mới nghĩ từ (nhìn chữ đầu + nghĩa).\u003c/li>\u003cli>\u003cb>Đếm số ô\u003c/b> trước khi viết. Viết xong \u003cb>đếm lại số chữ\u003c/b>: thiếu một chữ là thiếu một ô.\u003c/li>\u003cli>\u003cb>Đọc nhỏ từng âm\u003c/b> khi viết: \u003cb>fr\u003c/b>-ie-n-d · \u003cb>pl\u003c/b>-a-n-e · \u003cb>str\u003c/b>-ee-t · ba-\u003cb>sk\u003c/b>-et-ba-\u003cb>ll\u003c/b>.\u003c/li>\u003c/ol>\u003cp>Chữ hay bị sót: chữ đôi \u003cb>ll\u003c/b>, cụm \u003cb>st, str, fl, dg, rf, cr, pl\u003c/b>.\u003c/p>","examples":["T _ _ _ _ = 5 ô → \u003cb>There\u003c/b> (5 chữ). «Ther» chỉ có 4 chữ → thiếu e."],"items":[{"type":"text","q":"My uncle lives in A _ _ _ _ _ _ _ _ (9 chữ). He can see kangaroos there!","accept":["Australia","ustralia"],"why":"A-u-s-t-r-a-l-i-a: 9 chữ, có cụm «str».","trap":{"autralia":"Thiếu chữ s: Au-s-tra-li-a (đếm lại: 9 chữ).","utralia":"Thiếu chữ s: Au-s-tra-li-a (đếm lại: 9 chữ)."}},{"type":"text","q":"Six children are playing v _ _ _ _ _ _ _ _ _ (10 chữ) in the park. They hit the ball over the net.","accept":["volleyball","olleyball"],"why":"v-o-l-l-e-y-b-a-l-l: 10 chữ, hai chỗ «ll».","trap":{"voleyball":"Thiếu một chữ l: vo-ll-ey-ball (10 chữ).","oleyball":"Thiếu một chữ l: vo-ll-ey-ball (10 chữ).","volleybal":"Cuối từ là ball (hai chữ l): volleyball.","olleybal":"Cuối từ là ball (hai chữ l): volleyball."}},{"type":"text","q":"Look! The f _ _ _ _ _ _ _ (8 chữ) is standing on one leg in the water.","accept":["flamingo","lamingo"],"why":"f-l-a-m-i-n-g-o: 8 chữ, cụm «fl».","trap":{"famingo":"Thiếu chữ l: fl-a-min-go (8 chữ).","amingo":"Thiếu chữ l: fl-a-min-go (8 chữ)."}},{"type":"text","q":"Emily has got fifty b _ _ _ _ _ (6 chữ) on her scarf.","accept":["badges","adges"],"why":"b-a-d-g-e-s: 6 chữ, cụm «dg».","trap":{"bages":"Thiếu chữ d: ba-dg-es (6 chữ).","ages":"Thiếu chữ d: ba-dg-es (6 chữ).","badge":"fifty (50) → nhiều cái: badges (6 chữ).","adge":"fifty (50) → nhiều cái: badges (6 chữ)."}},{"type":"text","q":"My grandma always smiles. She's very c _ _ _ _ _ _ _ (8 chữ).","accept":["cheerful","heerful"],"why":"c-h-e-e-r-f-u-l: 8 chữ, cụm «rf».","trap":{"cheeful":"Thiếu chữ r: chee-r-ful (8 chữ).","heeful":"Thiếu chữ r: chee-r-ful (8 chữ).","cheerfull":"Đuôi -ful chỉ có MỘT chữ l: cheerful (8 chữ).","heerfull":"Đuôi -ful chỉ có MỘT chữ l: cheerful (8 chữ)."}},{"type":"text","q":"A c _ _ _ _ _ _ _ _ (9 chữ) lives in the river. It has got a very big mouth.","accept":["crocodile","rocodile"],"why":"c-r-o-c-o-d-i-l-e: 9 chữ, cụm «cr».","trap":{"cocodile":"Thiếu chữ r: cr-o-co-dile (9 chữ).","ocodile":"Thiếu chữ r: cr-o-co-dile (9 chữ)."}},{"type":"text","q":"Look! The water is coming down from the top of the mountain. It's a beautiful w _ _ _ _ _ _ _ _ (9 chữ).","accept":["waterfall","aterfall"],"why":"Nước đổ xuống từ đỉnh núi → waterfall (thác nước) = water + fall, 9 chữ.","trap":{"white":"Đọc cả câu: nước đổ xuống từ đỉnh núi → waterfall (thác nước). white là màu trắng, chỉ có 5 chữ.","hite":"Đọc cả câu: nước đổ xuống từ đỉnh núi → waterfall (thác nước). white là màu trắng, chỉ có 5 chữ.","waterfal":"fall có hai chữ l: waterfall (9 chữ).","aterfal":"fall có hai chữ l: waterfall (9 chữ)."}},{"type":"text","q":"We haven't got a car, so we go to the airport in a t _ _ _ (4 chữ).","accept":["taxi","axi"],"why":"Không có ô tô nhà mình → đi taxi ra sân bay (Unit 11).","trap":{"tall":"Đọc cả câu: đây là thứ chở người ra sân bay → taxi. tall (cao) không chở người được.","all":"Đọc cả câu: đây là thứ chở người ra sân bay → taxi. tall (cao) không chở người được."}}]},{"id":"P5","minutes":4,"title":"Của ai? và câu trả lời ngắn (đổi I ↔ you)","fromTest":"Đề 3 con chọn «Is this our MP3 player, Holly?» (đúng: your), viết «they are new posters» (đúng: their), và «Can I watch your DVD? — Yes, I can» (đúng: Yes, you can). Đề 1 con chọn your cho «Tom and Lucy's car» cả 2 lần (đúng: their).","rule":"\u003ctable class='rt'>\u003ctr>\u003cth>Người\u003c/th>\u003cth>Của …\u003c/th>\u003c/tr>\u003ctr>\u003ctd>I\u003c/td>\u003ctd>my\u003c/td>\u003c/tr>\u003ctr>\u003ctd>you (người mình đang nói chuyện)\u003c/td>\u003ctd>\u003cb>your\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>he / she\u003c/td>\u003ctd>his / her\u003c/td>\u003c/tr>\u003ctr>\u003ctd>we (Amy and I)\u003c/td>\u003ctd>\u003cb>our\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>they (Sam and Lily)\u003c/td>\u003ctd>\u003cb>their\u003c/b> (khác \u003ci>they're\u003c/i> = they are)\u003c/td>\u003c/tr>\u003c/table>\u003cp>\u003cb>Câu trả lời ngắn:\u003c/b> người hỏi nói \u003cb>I\u003c/b> → con trả lời \u003cb>you\u003c/b>; hỏi \u003cb>you\u003c/b> → trả lời \u003cb>I\u003c/b>. Lặp lại từ đầu câu hỏi: Can I …? → Yes, you \u003cb>can\u003c/b>. Are you …? → Yes, I \u003cb>am\u003c/b>. Does she …? → Yes, she \u003cb>does\u003c/b>.\u003c/p>\u003cp>Đọc cả câu gợi ý: nếu gợi ý nói ngược lại thì trả lời \u003cb>No\u003c/b>.\u003c/p>","examples":["\"Can I use your pencil?\" \"Yes, \u003cb>you\u003c/b> can.\"","Sam and Lily are showing me \u003cb>their\u003c/b> posters."],"items":[{"type":"mcq","q":"(Con hỏi Leo xem quyển truyện có phải của Leo không) \"Leo, is this ___ comic?\"","options":["your","our","his"],"answer":0,"why":"Nói trực tiếp với Leo → your.","trap":{"1":"our = của chúng mình (cả con và Leo); con hỏi Leo về đồ của Leo → your.","2":"his dùng khi nói VỀ Leo với người khác."}},{"type":"mcq","q":"My cousins love animals. ___ dog is very big.","options":["Their","Our","They're"],"answer":0,"why":"My cousins = they → Their dog.","trap":{"1":"our = của chúng mình (có «I» trong nhóm).","2":"They're = They are; «They are dog» sai nghĩa. Của họ → Their."}},{"type":"text","q":"Amy and I are in the same class. ___ teacher is Mrs Green.","accept":["Our"],"why":"Amy and I = we → our.","trap":{"their":"Có «I» trong nhóm → we → our.","my":"Cô giáo của cả Amy và con → our.","we":"we = chúng mình; «của chúng mình» → our."}},{"type":"mcq","q":"\"Can I play with your ball, please?\" \"Yes, ___.\"","options":["you can","I can","you do"],"answer":0,"why":"Người hỏi nói I → con trả lời you: Yes, you can.","trap":{"1":"I can = tớ có thể; nhưng người muốn chơi bóng là bạn kia → you can.","2":"Câu hỏi dùng Can → trả lời can, không dùng do."}},{"type":"mcq","q":"\"Are you hungry, Max?\" \"Yes, ___.\"","options":["I am","you are","I do"],"answer":0,"why":"Hỏi you → Max trả lời I: Yes, I am.","trap":{"1":"Max nói về chính mình → I am.","2":"Câu hỏi dùng Are → trả lời am."}},{"type":"mcq","q":"\"Is your dad reading now?\" (He's in the garden. He's playing football.) \"___\"","options":["No, he isn't.","Yes, he is.","No, he doesn't."],"answer":0,"why":"Bố đang đá bóng, không đọc sách → No, he isn't.","trap":{"1":"Gợi ý nói bố đang chơi bóng → không phải đang đọc → No.","2":"Câu hỏi dùng Is → trả lời isn't, không dùng doesn't."}},{"type":"mcq","q":"\"Does Holly like fishing?\" \"Yes, ___.\"","options":["she does","she is","she likes"],"answer":0,"why":"Hỏi Does → Yes, she does.","trap":{"1":"is trả lời câu hỏi bắt đầu bằng Is.","2":"Câu trả lời ngắn lặp lại does, không lặp lại like."}}]},{"id":"P6","minutes":5,"title":"Nghe: chuyện đã qua hay đang xảy ra? + vần or / ow / oa / ou / ld","fromTest":"Khi nghe chuyện đã qua, con hay chọn hiện tại: «Tom plays» (Đề 2, đúng: played), «we are painting» (Đề 3, đúng: painted). Phonics: chi_ _ → nd (Đề 1, đúng: ld), snow → cow (Đề 2), c_ _n → ow (Đề 3, đúng: corn).","rule":"\u003cp>\u003cb>Nghe từ chỉ thời gian:\u003c/b> yesterday, last … (last Sunday, last summer), … ago, when I was … → động từ \u003cb>-ed\u003c/b>. Nghe \u003cb>Look! / now\u003c/b> → \u003cb>is/are + -ing\u003c/b>.\u003c/p>\u003ctable class='rt'>\u003ctr>\u003cth>Âm\u003c/th>\u003cth>Viết\u003c/th>\u003c/tr>\u003ctr>\u003ctd>/ɔː/ như «o» kéo dài\u003c/td>\u003ctd>\u003cb>or\u003c/b>: corn, fork, horse · \u003cb>aw\u003c/b>: straw, paw\u003c/td>\u003c/tr>\u003ctr>\u003ctd>o dài /əʊ/ (như «âu»)\u003c/td>\u003ctd>\u003cb>oa\u003c/b>: coat, boat · \u003cb>ow\u003c/b>: snow, elbow · o_e: nose\u003c/td>\u003c/tr>\u003ctr>\u003ctd>/aʊ/ như «ao»\u003c/td>\u003ctd>\u003cb>ow\u003c/b>: cow, clown · \u003cb>ou\u003c/b>: house, mouse\u003c/td>\u003c/tr>\u003c/table>\u003cp>⚠️ \u003cb>ow có HAI cách đọc\u003c/b>: snow, slow (o dài) và cow, town (ao). Phải nghe kỹ, không đoán theo chữ viết.\u003c/p>\u003cp>Bấm 🔊 để nghe, 🐢 để nghe chậm.\u003c/p>","examples":["«Yesterday, we cleaned …» → nghe /d/ cuối → \u003cb>cleaned\u003c/b>"],"items":[{"type":"text","say":"Last summer, we visited our cousins in Spain.","q":"Last summer, we ___ our cousins in Spain.","accept":["visited"],"why":"Câu nghe: «Last summer, we visited…» → visited.","trap":{"visit":"«Last summer» là đã qua → visited.","are visiting":"«Last summer» là đã qua → visited."}},{"type":"mcq","say":"Last Monday, we cleaned the classroom.","q":"Last Monday, we ___ the classroom.","options":["cleaned","are cleaning","clean"],"answer":0,"why":"Câu nghe: «… we cleaned the classroom» — có âm /d/ cuối, và «Last Monday» là đã qua.","trap":{"1":"Nghe lại: không có «are»; «Last Monday» là đã qua → cleaned.","2":"Nghe lại âm /d/ ở cuối: cleaned."}},{"type":"mcq","say":"Look! The children are painting pictures now.","q":"Look! The children ___ pictures now.","options":["are painting","painted","paint"],"answer":0,"why":"Câu nghe có «Look!» và «now» → are painting.","trap":{"1":"Câu này nói «now» (bây giờ) → are painting.","2":"Câu nghe có «are … -ing»."}},{"type":"text","say":"My dad washed the car yesterday.","q":"My dad ___ the car yesterday.","accept":["washed"],"why":"Câu nghe: «My dad washed the car yesterday» → washed.","trap":{"washes":"«yesterday» → washed.","wash":"«yesterday» → washed."}},{"type":"mcq","say":"corn","q":"Nghe từ (bắp ngô). Chọn cách viết đúng:","options":["corn","cown","coan"],"answer":0,"why":"corn — vần or như fork, horse.","trap":{"1":"ow trong cow đọc /aʊ/, không giống corn.","2":"oa đọc o dài như coat."}},{"type":"mcq","say":"boat","q":"Nghe từ (cái thuyền). Chọn cách viết đúng:","options":["boat","bout","bort"],"answer":0,"why":"boat — oa đọc o dài như coat.","trap":{"1":"ou đọc /aʊ/ như house.","2":"or đọc /ɔː/ như corn."}},{"type":"mcq","say":"clown","q":"Nghe từ (chú hề). Chọn cách viết đúng:","options":["clown","cloan","clorn"],"answer":0,"why":"clown — ow đọc /aʊ/ như cow.","trap":{"1":"oa đọc o dài (coat), khác clown.","2":"or đọc /ɔː/ (corn), khác clown."}},{"type":"mcq","say":"child","q":"Nghe từ (đứa trẻ). Chọn cách viết đúng:","options":["child","chind","chilt"],"answer":0,"why":"child — ld như field, shield.","trap":{"1":"Có âm l trước d: chi-l-d.","2":"lt có trong belt, quilt; child kết thúc bằng âm d."}},{"type":"mcq","q":"ow có hai cách đọc. Từ nào có ow đọc giống «cow» (như «ao»)?","options":["town","slow","snow"],"answer":0,"why":"town đọc /taʊn/ — ow như cow.","trap":{"1":"slow đọc o dài /əʊ/ như snow, khác cow.","2":"snow đọc o dài /əʊ/, khác cow."}}]},{"id":"P7","minutes":3,"title":"Ôn nhanh: like + V-ing và so sánh nhất","fromTest":"«Do your cousins like read comics?» (Đề 3, đúng: reading), «Lucy doesn't like take photos» (Đề 1, đúng: taking), «This is the older bridge in our town» (Đề 3, đúng: oldest).","rule":"\u003cp>\u003cb>like / love / hate + V-ing\u003c/b>: like read\u003cb>ing\u003c/b>, love ru\u003cb>nn\u003c/b>ing, hate clean\u003cb>ing\u003c/b>.\u003c/p>\u003cp>\u003cb>So sánh:\u003c/b> 2 thứ + \u003cb>than\u003c/b> → \u003cb>-er\u003c/b>: smaller than. Có \u003cb>the … in the world / in our town / in our class\u003c/b> → \u003cb>the -est\u003c/b>: the oldest, the tallest.\u003c/p>","examples":["Do your cousins like \u003cb>reading\u00 function norm(s) {
  s = String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); // café = cafe
  s = s.replace(/[’‘`´ʼ′]/g, "'").replace(/[“”«»]/g, '"').replace(/[–—‐‑]/g, '-');

  // "'s got" is always "has got" (never "is got"), for pronouns AND names: Tim's got = Tim has got; "Tim is got" stays wrong.
  // iPad without apostrophe: "Tims got" / "shes got" = "… has got" (except words that end in s by themselves: has, is, this, his…)
  s = s.replace(/\b([a-z]+)'s got\b/g, '$1 has got')
       .replace(/\b([a-z]+)s got\b/g, (m, w) => /s$|^(ha|i|wa|thi|hi|u|ye|doe|goe|her|our|your|their|thu|plu|ga|bu)$/.test(w) ? m : w + ' has got');
  s = s.replace(/\bi'm\b/g, 'i am').replace(/\b([a-z]+)'re\b/g, '$1 are')
       .replace(/\b(it|he|she|that|this|there|here|what|who|where|how)'s\b/g, '$1 is')
       .replace(/\bisn't\b/g, 'is not').replace(/\baren't\b/g, 'are not')
       .replace(/\bdon't\b/g, 'do not').replace(/\bdoesn't\b/g, 'does not')
       .replace(/\bcan't\b/g, 'cannot').replace(/\bcan not\b/g, 'cannot')
       .replace(/\bhaven't\b/g, 'have not').replace(/\bhasn't\b/g, 'has not')
       .replace(/\b([a-z]+)'ve\b/g, '$1 have').replace(/\b([a-z]+)'ll\b/g, '$1 will')
       // 'd is ambiguous (he'd = he had / he would): expand only in "'d like/love/prefer", leave other 'd untouched
       .replace(/\b(i|you|we|they|he|she)'d (like|love|prefer)\b/g, '$1 would $2')
       .replace(/\b(i|you|we|they)d (like|love|prefer)\b/g, '$1 would $2') // iPad: "Id like"
       .replace(/\bdidn't\b/g, 'did not').replace(/\bwasn't\b/g, 'was not').replace(/\bweren't\b/g, 'were not')
       .replace(/\bmustn't\b/g, 'must not').replace(/\bwon't\b/g, 'will not');
  s = s.replace(/\bim\b/g, 'i am').replace(/\bdont\b/g, 'do not').replace(/\bdoesnt\b/g, 'does not')
       .replace(/\bisnt\b/g, 'is not').replace(/\barent\b/g, 'are not').replace(/\bcant\b/g, 'cannot')
       .replace(/\bhavent\b/g, 'have not').replace(/\bhasnt\b/g, 'has not').replace(/\bdidnt\b/g, 'did not')
       .replace(/\bwasnt\b/g, 'was not').replace(/\bwerent\b/g, 'were not').replace(/\bmustnt\b/g, 'must not')
       .replace(/\btheyre\b/g, 'they are').replace(/\byoure\b/g, 'you are')
       .replace(/\bthats\b/g, 'that is').replace(/\btheres\b/g, 'there is').replace(/\bwhats\b/g, 'what is')
       .replace(/\bhes\b/g, 'he is').replace(/\bshes\b/g, 'she is')
       .replace(/\b(i|we|you|they)ve\b/g, '$1 have').replace(/\bwouldnt\b/g, 'would not').replace(/\bcouldnt\b/g, 'could not');
  return s.replace(/\s+/g, ' ').trim();
}

  let ok = false;
  try { ok = canSpeak && window.speechSynthesis.getVoices().some(v => /^en/i.test(v.lang)); } catch (e) {}
  document.body.classList.toggle('novoice', !ok);
}
if (canSpeak) { try { window.speechSynthesis.addEventListener('voiceschanged', checkVoices); } catch (e) {} setTimeout(checkVoices, 1500); }
else document.body.classList.add('novoice');
const ansIdx = it => it.type === 'tf' ? (it.answer === 'True' ? 0 : 1) : it.answer;
function isOk(it, v) {
  if (it.type === 'mcq' || it.type === 'tf') return v === ansIdx(it);
  if (it.type === 'kw') return kwOk(v, it.kw);
  return matches(v, it.accept);
}
const score = L => { const s = st(L.id); return L.items.filter((it, k) => isOk(it, s.answers[k])).length; };
function bind() {
  document.querySelectorAll('input[data-k]').forEach(el => {
    const s = () => st(el.dataset.l);
    if (el.type === 'radio') el.addEventListener('change', () => { s().answers[el.dataset.k] = +el.value; save(); rerender(el.dataset.l); });
    else el.addEventListener('input', () => { s().answers[el.dataset.k] = el.value; save(); });
  });
  document.querySelectorAll('button[data-act]').forEach(b => b.addEventListener('click', () => {
    const L = DATA.lessons.find(x => x.id === b.dataset.l), s = st(L.id);
    if (b.dataset.act === 'check') { s.checked = true; const sc = score(L); s.best = Math.max(s.best ?? 0, sc); }
    else { s.checked = false; s.answers = {}; }
    save(); render(); const d = document.getElementById(L.id); d.open = true; d.querySelector('.actions').scrollIntoView({ block: 'nearest' });
  }));
}
function rerender(id) { // keep other lessons' open state; re-render whole page but restore open lesson
  const open = [...document.querySelectorAll('details.lesson[open]')].map(d => d.id), y = scrollY;
  render(); document.querySelectorAll('details.lesson').forEach(d => d.open = open.includes(d.id)); scrollTo(0, y);
}
render();
</script>
