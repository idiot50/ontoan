# Vhost nginx cho backend PayOS — KHÔNG đụng site "default" có sẵn.
# Đặt tại /etc/nginx/sites-available/payos-backend rồi symlink sang sites-enabled.
# certbot --nginx sẽ tự thêm khối listen 443 + chứng chỉ cho hostname này.
server {
    listen 80;
    listen [::]:80;
    server_name 3.104.106.255.sslip.io;

    # --- Web học tĩnh (hub + Toán lớp 1/3 + Tiếng Anh) tại /hoc/ ---
    # PHẢI đặt TRƯỚC "location /": nginx ưu tiên prefix DÀI hơn, nên /hoc/... ra file tĩnh
    # còn mọi đường khác (/api/payos/..., /health) vẫn vào proxy backend như trước.
    # Dùng root (KHÔNG dùng alias) với thư mục trùng tên "hoc" để tránh bẫy alias + try_files.
    location /hoc/ {
        root /var/www/toanvui;
        index index.html;
        try_files $uri $uri/ $uri/index.html =404;
        # Nội dung học đổi thường xuyên -> để trình duyệt kiểm lại;
        # service worker của app tự lo phần cache offline.
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    # Ảnh / âm thanh / giọng TTS: cache lâu hơn cho đỡ tải lại.
    location ~* ^/hoc/.*\.(png|jpe?g|gif|svg|ico|webp|woff2?|mp3|ogg|onnx|json)$ {
        root /var/www/toanvui;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
